    function detect(){
      var ua = navigator.userAgent || '';
      var phoneUA = (navigator.userAgentData && navigator.userAgentData.mobile) || /iPhone|iPod|Android.+Mobile|Windows Phone|BlackBerry|Opera Mini|IEMobile/i.test(ua);
      var phone = !!phoneUA || window.matchMedia('(max-width: 700px)').matches;
      var el = document.documentElement, was = el.classList.contains('is-phone');
      el.classList.toggle('is-phone', phone); el.classList.toggle('is-desktop', !phone);
      if (was !== phone && document.readyState !== 'loading') window.dispatchEvent(new Event('devicechange'));
    }
    detect(); window.addEventListener('resize', detect); window.addEventListener('orientationchange', detect);
  })();

<style>
:root{
  --bg:#141B2B; --surface:#1E2638; --ink:#FFFFFF; --muted:#8C97AD; --line:#2C364B;
  --accent:#00CEB8; --accent-ink:#0B1F1D;
  --field:#00CEB8; --field-soft:#183A3F;
  --pylon:#FF6F7E; --pylon-soft:#3A2333; --pylon-ink:#FF9EA8;
  --heat:0,206,184;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 "Barlow","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 56px}
button,select,input{font:inherit;color:inherit}
img{max-width:100%}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:4px solid var(--accent)}
h1{margin:0;font:700 clamp(2.3rem,8vw,3.8rem)/.92 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:-.01em}
.sub{margin:8px 0 0;color:var(--muted)}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:0 0 16px;text-align:center}
.cdlabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.cdgrid{display:flex;justify-content:center;gap:clamp(14px,5vw,36px);margin-top:6px}
.cdgrid>div{display:flex;flex-direction:column;align-items:center;min-width:3rem}
.cdgrid b{font:700 2.2rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;color:var(--accent)}
.cdgrid span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.cddone{font:700 1.6rem/1 "Barlow Condensed",sans-serif;color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:progress}
:is(.btn,.tab,select,input,summary,.seg button):focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:18px 0 20px}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 12px;
  font:600 1.15rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted);cursor:pointer;text-align:center}
.tab:hover{color:var(--ink);border-color:var(--muted)}
.tabgroup{position:relative}
.tabgroup>.tab{width:100%;height:100%}
.tabmenu{display:none;position:absolute;z-index:30;top:100%;left:0;right:0;padding-top:6px}
.tabgroup:hover .tabmenu,.tabgroup:focus-within .tabmenu,.tabgroup.open .tabmenu{display:grid;gap:4px}
.tabopt{background:var(--surface);border:1px solid var(--muted);border-radius:6px;padding:9px 12px;font:600 1.05rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--ink);cursor:pointer;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tabopt:hover,.tabopt[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:540px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
select,input[type="text"]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:40px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 13px;cursor:pointer;color:var(--muted);font-weight:500;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
details.more{margin:10px 0 4px}
details.more summary{cursor:pointer;color:var(--muted);font-size:.9rem;width:max-content}
details.more .controls{margin-top:10px}
.note{color:var(--muted);font-size:.9rem;margin:10px 0 0;max-width:70ch}
.key{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--pylon);margin-right:6px;vertical-align:0}

/* Draft board */
.round h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 8px;
  font:700 1.55rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
.round h2 small{font:500 .85rem "Barlow",sans-serif;color:var(--muted)}
ol.picks{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pick{display:grid;grid-template-columns:4.4rem minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick.traded{box-shadow:inset 5px 0 0 var(--pylon)}

.pp-yr{display:block;margin:8px 0 5px;font-weight:600;font-size:.8rem;color:var(--muted)}.pp-chips{display:flex;flex-wrap:wrap;gap:5px}
.ocard.flash{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);transition:box-shadow .4s,border-color .4s}

.chip.stack{border-color:var(--accent)}

.chipbtn{background:none;font:inherit;font-size:.78rem;text-align:left;cursor:pointer;color:var(--muted)}
.chipbtn:hover{border-color:var(--muted)}
.chipbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chipbtn[aria-pressed="true"] b{color:var(--accent-ink)}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.tenure{line-height:1.35}
.bsplit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px;margin-top:14px;align-items:start}
.rtitle{margin:0 0 2px;font:700 1.5rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
.rhead{margin:16px 0 4px;font:600 1.1rem "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted)}
.rhead small{margin-left:6px;font:500 .8rem "Barlow",sans-serif}
.rlist2{list-style:none;margin:0;padding:0}
.rrow{display:grid;grid-template-columns:3rem 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname.empty{color:var(--muted);font-weight:400}
.rsub{font-size:.8rem;color:var(--muted)}
.rten{font-size:.78rem;color:var(--muted);white-space:nowrap}
.pbadge{display:grid;place-items:center;padding:3px 0;border-radius:6px;font:700 .9rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;background:var(--line);color:var(--ink)}
.pb-QB{background:#FF2A6D;color:#fff}
.pb-RB{background:#00CEB8;color:#06211E}
.pb-WR{background:#FFAE58;color:#2B1A00}
.pb-TE{background:#58A7FF;color:#04182E}
.pb-K{background:#BD66FF;color:#fff}
.pb-DEF{background:#7988A1;color:#fff}
.tenure b{font-size:.95rem}

/* Manager profiles */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.prec{display:flex;align-items:flex-end;gap:12px;margin:14px 0 10px}
.pbig{font:700 2.8rem/.9 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--accent);font-variant-numeric:tabular-nums}
.psub{font-size:.8rem;color:var(--muted);line-height:1.3}
.pstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pstats div{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
.pstats dt{color:var(--muted)}
.pstats dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.tch{margin:12px 0 8px;font:600 1.1rem "Barlow Condensed","Arial Narrow",sans-serif}
.trophies{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.trophies li{display:flex;gap:10px;align-items:flex-start}
.ticon{font-size:1.35rem;line-height:1.1;flex:none}
.trophies b{display:block;font-size:.9rem}
.trophies small{display:block;color:var(--muted);font-size:.8rem}
.tempty{margin:0;color:var(--muted);font-size:.85rem}
/* Trades */
.tlist{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.trade{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.trade time{font-size:.85rem;color:var(--muted)}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:10px}
.side ul{list-style:none;margin:10px 0 0;padding:0}
.side li{display:flex;flex-direction:column;padding:6px 0;border-top:1px solid var(--line);line-height:1.3}
.side li:first-child{border-top:0}
.asset-main{font-weight:600}
.asset-pick .asset-main{color:var(--accent)}
.asset-sub{font-size:.8rem;color:var(--muted)}
.status{padding:40px 0;color:var(--muted)}
.error{background:var(--pylon-soft);color:var(--pylon-ink);border-radius:8px;padding:14px 16px;margin-top:18px}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
footer form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}

.xlabel{font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}.xlabel::before{content:"𝕏";margin-right:8px;color:var(--accent)}

/* ---------- Phone layout (html.is-phone, set by device detection in <head>) ---------- */
.mnav,.msheet,.mtabname{display:none}
.is-phone body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
.is-phone .wrap{padding:0 12px 20px}
.is-phone .top{position:sticky;top:0;z-index:40;margin:0 -12px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;flex-wrap:nowrap;align-items:center;gap:10px;
  background:rgba(20,27,43,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

.is-phone #refresh{padding:7px 12px;font-size:.8rem;flex:none}

.is-phone .cdlabel{font-size:.6rem;line-height:1.35;max-width:38%}
.is-phone .cdgrid{gap:12px;margin:0}.is-phone .cdgrid>div{min-width:0}
.is-phone .cdgrid b{font-size:1.3rem}.is-phone .cdgrid span{font-size:.55rem}

.is-phone .controls{gap:8px}
.is-phone footer{margin-top:28px}
.is-phone .xfeed{margin-bottom:16px;padding:0}
.is-phone #toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}

.is-phone .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));
  background:rgba(30,38,56,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.mnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border:0;background:none;color:var(--muted);font-size:.64rem;font-weight:600;cursor:pointer;border-radius:10px}
.mnav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mnav button[aria-current="true"]{color:var(--accent)}
.mnav button:active{background:rgba(255,255,255,.05)}
/* "More" sheet */
.is-phone .msheet{display:block;position:fixed;inset:0;z-index:95}
.is-phone .msheet[hidden]{display:none}
.msheet-bg{position:absolute;inset:0;background:rgba(5,9,18,.6);opacity:0;transition:opacity .2s}
.msheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .22s ease-out;box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.msheet.open .msheet-bg{opacity:1}.msheet.open .msheet-panel{transform:none}
.msheet-grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.msheet-panel h3{margin:14px 2px 8px;font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.msheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msheet-grid button{padding:13px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:600;font-size:.9rem;text-align:left;cursor:pointer}
.msheet-grid button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* Standings as cards */
.mst{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.mst-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;column-gap:8px;row-gap:6px;padding:10px 10px 9px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.mst-rk{font-weight:700;color:var(--muted);text-align:center}
.mst-team{min-width:0}.mst-team .tname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mst-stk .stkbtn{font-size:.95rem}
.mst-sub{grid-column:2/-1;display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.mst-sub .dot{width:22px;height:22px;line-height:22px}
.mst-sos{display:inline-flex;align-items:center;gap:4px}.mst-sos em{font-style:normal;font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase}
.mst-sos .sos{min-width:0;padding:1px 7px;font-size:.7rem}
.is-phone .scards{grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}
.is-phone .scard{padding:9px 10px;gap:4px}.is-phone .scard .slabel{font-size:.6rem;line-height:1.3}.is-phone .scard .tname{font-size:.85rem}.is-phone .scard b{font-size:1.05rem}
.is-phone .scard .team .hs{width:26px;height:26px}
/* Tables, records, trades */
.is-phone table{font-size:.82rem}
.is-phone th.tl,.is-phone td.tl{max-width:140px;padding-left:10px}
.is-phone .rgrid{grid-template-columns:1fr 1fr;gap:8px}
.is-phone .rcard{padding:10px 11px}.is-phone .rcard h3{font-size:.9rem;margin-bottom:4px}.is-phone .rval{font-size:1.75rem}
.is-phone .tfcols{grid-template-columns:1fr}
.is-phone .lutoggle,.is-phone .btn{min-height:38px}
.is-phone #app > .note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.is-phone #app > .note.open{display:block;-webkit-line-clamp:unset}
.msheet-panel{scroll-padding-bottom:20px}
.is-phone .paygrid{grid-template-columns:1fr 1fr;gap:8px}.is-phone .paycard{padding:10px 11px}.is-phone .payamt{font-size:1.7rem}.is-phone .paycard h3{margin:2px 0 8px;font-size:.82rem}
.is-phone .payhead{flex-direction:column;align-items:flex-start;gap:2px}
.is-phone .pot{padding:12px 14px;gap:10px}.is-phone .potnum{font-size:2.8rem}
</style>

    };

    async function load(){

            <span class="xtime">${isNaN(d) ? '' : `<time datetime="${new Date(d).toISOString()}">${ago(d)}</time>`}</span>${url ? '</a>' : '</div>'}</article>`;
        }).join('');
      } catch (e) { fail(); }
    }
    load();

  })();

  // ---------- Phone navigation: bottom bar, "More" sheet, current-section label ----------

  function goTab(k){ if (!D) return; opts.tab = k; saveOpts(); closeSheet(); render(); window.scrollTo(0, 0); }

  // ---------- Standings ----------
  function standingsData(){
    const res = new Map(D.ids.map(r => [r, { g: [], gm: [], pa: 0, hi: 0, lo: Infinity, opps: [] }]));
    const weeks = [...D.completedWeeks].sort((a, b) => a.week - b.week);
    weeks.forEach(({ week, list }) => {
      const groups = new Map();
      list.forEach(m => { if (m.matchup_id == null || !res.has(m.roster_id)) return; if (!groups.has(m.matchup_id)) groups.set(m.matchup_id, []); groups.get(m.matchup_id).push(m); });
      const scores = list.filter(m => res.has(m.roster_id) && (m.points || 0) > 0).map(m => m.points).sort((x, y) => x - y);
      const med = scores.length ? (scores[Math.floor((scores.length - 1) / 2)] + scores[Math.floor(scores.length / 2)]) / 2 : 0;
      groups.forEach(g => {
        if (g.length !== 2 || !(g[0].points > 0 || g[1].points > 0)) return;
        g.forEach((m, i) => {
          const o = g[1 - i], r = res.get(m.roster_id);
          const res1 = m.points > o.points ? 'W' : m.points < o.points ? 'L' : 'T';
          r.g.push(res1); r.gm.push({ res: res1, w: week, mid: m.matchup_id, pts: m.points || 0, opp: o.roster_id, oppPts: o.points || 0 });
          r.pa += o.points || 0;
          r.opps.push(o.roster_id);
          r.hi = Math.max(r.hi, m.points || 0); r.lo = Math.min(r.lo, m.points || 0);
          if (D.median && med) { const res2 = m.points > med ? 'W' : m.points < med ? 'L' : 'T'; r.g.push(res2); r.gm.push({ res: res2, w: week, mid: m.matchup_id, pts: m.points || 0, med }); }
        });
      });
    });
    res.forEach(r => {
      let cur = { t: '', n: 0 }, bw = 0, bl = 0, run = 0, rt = '';
      r.g.forEach(x => {
        if (x === rt) run++; else { rt = x; run = 1; }
        if (x === 'W') bw = Math.max(bw, run);
        if (x === 'L') bl = Math.max(bl, run);
        cur = { t: x, n: run };
      });
      r.cur = cur; r.bestW = bw; r.bestL = bl;
    });
    return res;
  }
  // Strength of schedule: average season PPG of the opponents a team has faced (played) or still faces (remaining).
  function sosData(info){
    const ppg = new Map(D.ids.map(r => { const h = D.hist.get(r) || []; return [r, h.length ? avg(h) : null]; }));
    const known = [...ppg.values()].filter(v => v != null);
    const lg = known.length ? avg(known) : 0;
    const rem = new Map(D.ids.map(r => [r, []]));
    (D.remaining || []).forEach(w => (w.pairs || []).forEach(([a, b]) => { if (rem.has(a)) rem.get(a).push(b); if (rem.has(b)) rem.get(b).push(a); }));
    const score = list => { const v = list.map(o => ppg.get(o)).filter(x => x != null); return v.length ? avg(v) : null; };
    const build = getOpps => {
      const m = new Map(D.ids.map(r => { const opps = getOpps(r); return [r, { v: score(opps), n: opps.length }]; }));
      const ranked = D.ids.filter(r => m.get(r).v != null).sort((a, b) => m.get(b).v - m.get(a).v || a - b);
      ranked.forEach((r, i) => { m.get(r).rank = i + 1; });
      m.size_ = ranked.length;
      return m;
    };
    const played = build(r => info.get(r).opps), remaining = build(r => rem.get(r));
    return { lg, played, remaining, hasRem: remaining.size_ > 0 };
  }
  function sosCell(m, r, lg, label){
    const x = m.get(r);
    if (!x || x.v == null) return '–';
    const n = m.size_, third = Math.max(1, Math.round(n / 3));
    const cls = x.rank <= third ? 'hard' : x.rank > n - third ? 'easy' : 'mid';
    const d = x.v - lg;
    const tip = `${label}: ${ordinal(x.rank)} hardest of ${n}. Opponents average ${x.v.toFixed(1)} PPG (${d >= 0 ? '+' : ''}${d.toFixed(1)} vs league) over ${x.n} game${x.n === 1 ? '' : 's'}.`;
    return `<span class="sos ${cls}" title="${esc(tip)}">${ordinal(x.rank)}</span><small class="sosd">${d >= 0 ? '+' : ''}${d.toFixed(1)}</small>`;
  }
  function renderStandings(){
    const info = standingsData();
    const gp = t => t.wins + t.losses + t.ties;
    const pct = t => gp(t) ? (t.wins + 0.5 * t.ties) / gp(t) : 0;
    const order = D.ids.slice().sort((a, b) => (pct(team(b)) - pct(team(a))) || (team(b).pf - team(a).pf) || (a - b));
    const played = Math.max(0, ...D.ids.map(r => gp(team(r))));
    const any = played > 0;
    const sN = (r, t) => { const c = info.get(r).cur; return c.n && c.t === t ? c.n : 0; };
    const top = (arr, f) => arr.map(r => ({ r, v: f(r) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v || a.r - b.r)[0];
    const hot = top(D.ids, r => sN(r, 'W')), cold = top(D.ids, r => sN(r, 'L'));
    const bestW = top(D.ids, r => info.get(r).bestW), bestL = top(D.ids, r => info.get(r).bestL);
    const card = (label, x, unit, cls) => `<div class="scard ${cls}"><span class="slabel">${label}</span>${x ? `${teamBlock(team(x.r), '')}<b>${x.v} ${unit}</b>` : '<span class="asset-sub">None yet</span>'}</div>`;
    let html = `<h2 class="sech">League Standings</h2>`;
    const sos = sosData(info);
    if (!any) return html + '<p class="note">Standings appear once the season starts.</p>';
    html += `<div class="scards">${card('Longest active win streak', hot, 'wins', 'good')}${card('Longest active losing streak', cold, 'losses', 'bad')}${card('Best win streak this season', bestW, 'wins', 'good')}${card('Worst losing streak this season', bestL, 'losses', 'bad')}</div>`;
    const phone = isPhoneUI();
    let mrows = '';
    if (!phone) html += `<div class="lwrap"><table class="stbl"><thead><tr><th>#</th><th class="tl">Team</th><th>Record</th><th>PF</th><th>PA</th><th>Streak</th><th>Last 5</th><th title="Strength of schedule so far: 1st = hardest">SOS</th>${sos.hasRem ? '<th title="Remaining regular-season strength of schedule: 1st = hardest">Rem. SOS</th>' : ''}</tr></thead><tbody>`;
    order.forEach((r, i) => {
      const t = team(r), x = info.get(r), c = x.cur;
      const gameLine = gm => gm.med != null
        ? `<span class="tip-row"><b class="tip-${gm.res.toLowerCase()}">${gm.res}</b> Week ${gm.w} · median game: ${gm.pts.toFixed(2)} vs ${gm.med.toFixed(2)}</span>`
        : `<span class="tip-row"><b class="tip-${gm.res.toLowerCase()}">${gm.res}</b> Week ${gm.w} · ${gm.pts.toFixed(2)}–${gm.oppPts.toFixed(2)} vs ${esc(team(gm.opp).name)}</span>`;
      const go = gm => `data-goto-match="${gm.w}:${gm.mid}"`;
      const sGames = c.n ? x.gm.slice(-c.n) : [];
      const streak = c.n ? `<button type="button" class="stk stkbtn ${c.t === 'W' ? 'w' : c.t === 'L' ? 'l' : 't'}" data-streak="${r}" data-tip="${esc(`<span class="tip-h">${c.t === 'W' ? 'Win' : c.t === 'L' ? 'Losing' : 'Tie'} streak: ${c.n}</span>${sGames.slice().reverse().map(gameLine).join('')}<span class="tip-f">Click for the week-by-week matchups</span>`)}" aria-label="${c.t}${c.n} streak. Show week-by-week matchups">${c.t}${c.n}</button>` : '–';
      const last5 = x.gm.slice(-5).map(gm => `<button type="button" class="dot dotbtn ${gm.res.toLowerCase()}" ${go(gm)} data-tip="${esc(gameLine(gm) + '<span class="tip-f">Click to open this matchup</span>')}" aria-label="${gm.res}, week ${gm.w}. Open matchup">${gm.res}</button>`).join('');
      if (phone) {
        const sosChip = (m, label) => { const v = sosCell(m, r, sos.lg, label); return v === '–' ? '' : `<span class="mst-sos"><em>${label === 'Played' ? 'SOS' : 'Rem'}</em>${v.replace(/<small class="sosd">[^<]*<\/small>/, '')}</span>`; };
        mrows += `<div class="mst-row"><span class="mst-rk">${i + 1}</span><button type="button" class="tlink mst-team" data-build-team="${r}">${teamBlock(t, `${record(t)} · ${t.pf.toFixed(1)} PF`)}</button><span class="mst-stk">${streak}</span>
          <div class="mst-sub"><span class="l5">${last5}</span>${sosChip(sos.played, 'Played')}${sos.hasRem ? sosChip(sos.remaining, 'Remaining') : ''}</div></div>`;
        return;
      }
      html += `<tr><td>${i + 1}</td><td class="tl"><button type="button" class="tlink" data-build-team="${r}" title="View ${esc(t.name)} in Team Construction">${teamBlock(t, '')}</button></td><td>${record(t)}</td><td>${t.pf.toFixed(2)}</td><td>${x.pa ? x.pa.toFixed(2) : '–'}</td><td>${streak}</td><td class="l5">${last5}</td><td>${sosCell(sos.played, r, sos.lg, 'Played')}</td>${sos.hasRem ? `<td>${sosCell(sos.remaining, r, sos.lg, 'Remaining')}</td>` : ''}</tr>`;
    });
    html += (phone ? `<div class="mst">${mrows}</div>` : '</tbody></table></div>') + '<details class="stnotes"><summary>How these are calculated</summary><p class="note">Ranked by record, then points for. Streaks count regular-season games' + (D.median ? ', including the weekly median game' : '') + '.</p><p class="note"><b>SOS</b> ranks each schedule by the average points per game of the opponents faced, 1st being the hardest. <span class="sos hard">Red</span> is the toughest third, <span class="sos easy">teal</span> the easiest.' + (sos.hasRem ? ' <b>Rem. SOS</b> does the same for the rest of the regular season.' : '') + ' The small number under each rating is how many points per game those opponents score above or below the league average.</p></details>';
    return html;
  }

  // ---------- Trade Finder (FantasyCalc dynasty values) ----------
  function fcSettings(){
    const rp = D.league.roster_positions || [], sc = D.league.scoring_settings || {};
    const sf = rp.includes('SUPER_FLEX');
    const rec = typeof sc.rec === 'number' ? sc.rec : 1;
    return { numQbs: sf ? 2 : 1, numTeams: D.ids.length, ppr: [0, 0.5, 1].reduce((a, b) => Math.abs(b - rec) < Math.abs(a - rec) ? b : a), sf };
  }
  async function loadFinder(){
    if (!D || D.tf || D.tfLoading) return;
    const myD = D; myD.tfLoading = true;
    const f = fcSettings();
    const qs = `isDynasty=true&numQbs=${f.numQbs}&numTeams=${f.numTeams}&ppr=${f.ppr}`;
    const urls = [VALUES_PROXY ? `${VALUES_PROXY}/values?${qs}` : null, `${VALUES_API}/values/current?${qs}`].filter(Boolean);
    let raw = null;
    for (const u of urls) { try { const r = await fetch(u); if (r.ok) { raw = await r.json(); if (Array.isArray(raw) && raw.length) break; } } catch (e) {} }
    if (!Array.isArray(raw) || !raw.length) { myD.tf = { error: 'Couldn’t load player values from FantasyCalc. Try Refresh in a minute.' }; }
    else {
      const players = new Map(), picks = new Map(), pickAgg = new Map();
      raw.forEach(x => {
        const pl = x.player || {}, v = Number(x.value) || 0;
        const pm = /^(\d{4}) (\d+)(?:st|nd|rd|th)(?: \((?:Early|Mid|Late)\))?$/i.exec(pl.name || '');
        if (pm) { const k = `${pm[1]}-${pm[2]}`; const a = pickAgg.get(k) || [0, 0]; a[0] += v; a[1]++; pickAgg.set(k, a); return; }
        if (pl.sleeperId != null && v > 0) players.set(String(pl.sleeperId), { id: String(pl.sleeperId), name: pl.name, pos: pl.position, tm: pl.maybeTeam || 'FA', age: pl.maybeAge, v, rank: x.overallRank, trend: x.trend30Day });
      });
      pickAgg.forEach((a, k) => picks.set(k, a[0] / a[1]));
      myD.tf = { players, picks, f };
    }
    myD.tfLoading = false;
    if (D === myD && (opts.tab === 'finder' || opts.tab === 'calc')) render();
  }

  function finderModel(){
    const { players, picks } = D.tf;
    const rp = D.league.roster_positions || [], cnt = k => rp.filter(x => x === k).length;
    const need = { QB: cnt('QB') + cnt('SUPER_FLEX'), RB: Math.ceil(cnt('RB') + 0.4 * cnt('FLEX')), WR: Math.ceil(cnt('WR') + 0.4 * cnt('FLEX')), TE: Math.ceil(cnt('TE') + 0.2 * cnt('FLEX')) };
    const POS = ['QB', 'RB', 'WR', 'TE'];
    const teams = new Map();
    (D.rosters || []).forEach(r => {
      if (r.roster_id == null) return;
      const assets = [];
      (r.players || []).forEach(id => { const p = players.get(String(id)); if (p) assets.push({ kind: 'p', key: 'p' + p.id, label: p.name, sub: `${p.pos}, ${p.tm}${p.age ? ', ' + Number(p.age).toFixed(0) : ''}`, pos: p.pos, v: p.v, id: p.id, p }); });
      D.seasons.forEach(se => { for (let rd = 1; rd <= (opts.rounds || 4); rd++) {
        const v = picks.get(`${se}-${rd}`); if (!v) continue;
        D.ids.forEach(orig => { if (ownerOf(se, rd, orig) !== r.roster_id) return;
          const own = orig === r.roster_id;
          assets.push({ kind: 'k', key: `k${se}-${rd}-${orig}`, label: `${se} Round ${rd} pick`, sub: own ? 'Own pick' : `From ${team(orig).name}`, pos: null, v }); });
      } });
      const strength = {}, depth = {};
      POS.forEach(pos => { const vs = assets.filter(a => a.pos === pos).map(a => a.v).sort((a, b) => b - a); strength[pos] = vs.slice(0, need[pos]).reduce((t, x) => t + x, 0); depth[pos] = vs.slice(need[pos]).reduce((t, x) => t + x, 0); });
      const total = assets.reduce((t, a) => t + a.v, 0);
      teams.set(r.roster_id, { rid: r.roster_id, assets: assets.sort((a, b) => b.v - a.v), strength, depth, total });
    });
    const mean = {}; POS.forEach(pos => { mean[pos] = [...teams.values()].reduce((t, x) => t + x.strength[pos], 0) / (teams.size || 1) || 1; });
    teams.forEach(t => { t.need = {}; POS.forEach(pos => { t.need[pos] = Math.max(-0.5, Math.min(0.5, (mean[pos] - t.strength[pos]) / mean[pos])); }); });
    return { teams, POS, need };
  }

  function stratAdj(a, st){
    if (a.kind === 'k') return a.v * (st === 'contend' ? 0.8 : st === 'rebuild' ? 1.2 : 1);
    const age = Number(a.p && a.p.age) || 26;
    const m = st === 'contend' ? (age >= 27 ? 1.1 : age <= 23 ? 0.9 : 1) : st === 'rebuild' ? (age <= 24 ? 1.15 : age >= 30 ? 0.65 : age >= 28 ? 0.8 : 1) : 1;
    return a.v * m;
  }
  const PKG_W = [1, 0.7, 0.55, 0.45];
  const pkgVal = (arr, f) => arr.map(a => f ? f(a) : a.v).sort((x, y) => y - x).reduce((t, v, i) => t + v * (PKG_W[i] ?? 0.35), 0);

  function findTrades(model, me, tol){
    const mine = model.teams.get(me); if (!mine) return [];
    const W = [1, 0.7];
    const pack = arr => pkgVal(arr);
    const fit = (t, get, give) => { const tot = get.concat(give).reduce((x, a) => x + a.v, 0) || 1; const f = a => a.pos ? t.need[a.pos] * a.v : 0; return (get.reduce((x, a) => x + f(a), 0) - give.reduce((x, a) => x + f(a), 0)) / tot; };
    const top = t => t.assets.filter(a => a.v >= 700 && !(noPicks && a.kind === 'k')).slice(0, 14);
    const combos = list => { const o = list.map(a => [a]); for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) o.push([list[i], list[j]]); return o; };
    const st = opts.tfStrat || 'balanced', tgt = opts.tfPos || '', noPicks = opts.tfPicks === 'no';
    const adj = a => stratAdj(a, st);
    const sv = arr => arr.reduce((t, a) => t + adj(a), 0);
    const myTop = top(mine), out = [];
    const mySingles = myTop.map(a => [a]), myPairs = combos(myTop).filter(c => c.length === 2);
    model.teams.forEach((them, rid) => {
      if (rid === me) return;
      const th = top(them), thSingles = th.map(a => [a]), thPairs = combos(th).filter(c => c.length === 2);
      const sets = [[mySingles, thSingles], [myPairs, thSingles], [mySingles, thPairs]];
      const found = [];
      sets.forEach(([giveSet, getSet]) => giveSet.forEach(give => getSet.forEach(get => {
        const a = pack(give), b = pack(get), gap = (b - a) / Math.max(a, b);
        if (Math.abs(gap) > tol) return;
        if (tgt && !get.some(x => x.pos === tgt)) return;
        const fm = fit(mine, get, give), ft = fit(them, give, get);
        if (ft <= 0.01) return;
        const sg = (sv(get) - sv(give)) / Math.max(sv(get), sv(give), 1);
        if (st !== 'balanced' && sg < 0.01) return;
        if (!tgt && fm <= 0.01) return;
        found.push({ rid, give, get, a, b, gap, fm, ft, sg, score: fm + ft + sg * 1.2 - Math.abs(gap) * 1.5 });
      })));
      found.sort((x, y) => y.score - x.score);
      const used = new Set();
      found.filter(f => { const ks = f.give.concat(f.get).map(x => x.key); if (ks.some(k => used.has(k))) return false; ks.forEach(k => used.add(k)); return true; }).slice(0, 2).forEach(f => out.push(f));
    });
    return out.sort((x, y) => y.score - x.score).slice(0, 12);
  }

  function renderFinder(){

    let html = `<h2 class="sech">Trade Finder</h2>

        <label class="field">Target position<select data-opt="tfPos">${[['', 'Any'], ...model.POS.map(x => [x, x])].map(([v, l]) => `<option value="${v}" ${(opts.tfPos || '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="field">Picks<select data-opt="tfPicks"><option value="yes" ${opts.tfPicks !== 'no' ? 'selected' : ''}>Include</option><option value="no" ${opts.tfPicks === 'no' ? 'selected' : ''}>Players only</option></select></label></div>
      <p class="note">Values from <a href="https://www.fantasycalc.com" target="_blank" rel="noopener noreferrer">FantasyCalc</a>, tuned to this league: ${f.sf ? 'superflex' : '1 QB'}, ${f.numTeams} teams, ${f.ppr === 1 ? 'full' : f.ppr === 0.5 ? 'half' : 'no'} PPR, dynasty. Suggestions pair teams that each fill a position of need and stay within the fairness range. ${({ contend: 'Contend now favors proven veterans and values picks less.', rebuild: 'Rebuild favors young players and picks and values older players less.', balanced: '' })[opts.tfStrat || 'balanced']} They are estimates, not verdicts.</p>`;
    const mt = model.teams.get(me);
    html += `<div class="tfneeds">${model.POS.map(pos => { const n = mt.need[pos]; const lab = n > 0.12 ? 'Need' : n < -0.12 ? 'Surplus' : 'Balanced'; return `<span class="tfn ${lab.toLowerCase()}"><b>${pos}</b> ${lab}</span>`; }).join('')}</div>`;
    const trades = findTrades(model, me, tol);
    if (!trades.length) return html + '<p class="note">No trades fit those settings. Try a looser fairness range.</p>';
    const side = (arr, total) => `<ul>${arr.map(a => `<li>${a.kind === 'p' ? shot(a.id, a.pos, a.p.tm, a.label) : '<span class="hs pick" aria-hidden="true">PK</span>'}<span class="tfn2"><span class="asset-main">${a.kind === 'p' ? PL(a.id, a.label, 'span') : esc(a.label)}</span><span class="asset-sub">${esc(a.sub)}</span></span><b class="tfv">${Math.round(a.v).toLocaleString()}</b></li>`).join('')}</ul><div class="tfsum">Package value <b>${Math.round(total).toLocaleString()}</b></div>`;
    html += '<div class="tflist">' + trades.map(t => {
      const g = t.gap, lab = Math.abs(g) <= 0.03 ? 'Even swap' : g > 0 ? `You gain ~${Math.round(g * 100)}% in value` : `You give ~${Math.round(-g * 100)}% extra value`;
      return `<article class="tfcard"><div class="tfhead">${teamBlock(team(t.rid), 'Trade partner')}<span class="tflab ${Math.abs(g) <= 0.03 ? 'even' : g > 0 ? 'win' : 'lose'}">${lab}</span></div>
        <div class="tfcols"><div><div class="tfcap">You send</div>${side(t.give, t.a)}</div><div><div class="tfcap">You get</div>${side(t.get, t.b)}</div></div></article>`;
    }).join('') + '</div>';
    return html;
  }

    const per = opts.rounds * D.seasons.length;

      <p class="note">Every pick each team holds across the next ${D.seasons.length} drafts. ${D.draftSeason} picks show their ${seasonDone() ? 'final' : opts.basis === 'projected' ? 'projected' : 'current'} slot; later years show the round.
      <span class="key"></span>Highlighted picks were acquired in a trade.</p><div class="owners">`;
    const cards = D.ids.slice().sort((a, b) => team(a).name.localeCompare(team(b).name));
    cards.forEach(rid => {
      const items = (own.get(rid) || []).sort((a, b) => a.y - b.y || a.r - b.r || (a.slot ?? 0) - (b.slot ?? 0) || team(a.orig).name.localeCompare(team(b.orig).name));
      html += `<article class="ocard" id="own-${rid}"><header>${teamBlock(team(rid), esc(team(rid).manager))}<span class="count">${items.length}<small>picks</small></span></header>`;
      D.seasons.forEach(y => {
        const yi = items.filter(it => it.y === y);
        html += `<div class="yr">${y}</div><div class="chips">`;
        html += yi.length ? yi.map(it => {
          const acq = it.orig !== rid;
          const main = it.slot ? pickLabel(it.r, it.slot) : ordinal(it.r);
          return `<span class="chip${acq ? ' acq' : ''}"><b>${main}</b>${acq ? `from ${esc(team(it.orig).name)}` : ''}</span>`;
        }).join('') : '<span class="note" style="margin:0">No picks</span>';
        html += '</div>';
      });
      const g = gave.get(rid) || [];
      if (g.length) {
        const gs = g.slice().sort((a, b) => a.y - b.y || a.r - b.r);
        html += `<div class="yr gave-h">Traded away</div><div class="chips">${gs.map(it =>
          `<span class="chip gone"><b>${it.y} ${ordinal(it.r)}</b>to ${esc(team(it.owner).name)}</span>`).join('')}</div>`;
      }
      html += '</article>';
    });
    html += '</div>';
    if (per && cards.some(r => (own.get(r) || []).length !== per)) {
      html += `<p class="note">A full set is ${per} picks (${opts.rounds} rounds × ${D.seasons.length} years).</p>`;
    }
    return html;
  }

  // ---------- League records ----------
  async function loadRecords(){
    if (!D || D.records || D.recordsLoading) return;
    const myD = D;
    myD.recordsLoading = true;
    try {
      const hist = await loadHistory();
      const seasons = hist.map(L => ({ season: L.season, current: L.current, name: rid => L.teamOf(rid).name, weeks: L.weeks }));
      myD.records = computeRecords(seasons);
    } catch (e) {
      myD.records = { error: e.message || 'Couldn’t load league history from Sleeper.' };
    } finally {
      myD.recordsLoading = false;
      if (D === myD && opts.tab === 'rec') render();
    }
  }

  function computeRecords(seasons){
    const scores = [], games = [], seasonPF = [], streaks = [];
    const usedSeasons = [];
    seasons.forEach(s => {
      const pf = new Map(), gp = new Map(), cur = new Map(), best = new Map();
      let any = false;
      s.weeks.slice().sort((a, b) => a.week - b.week).forEach(({ week, list }) => {
        const valid = (list || []).filter(m => typeof m.points === 'number');
        if (!valid.some(m => m.points > 0)) return;
        any = true;
        valid.forEach(m => {
          if (m.points > 0) scores.push({ season: s.season, week, name: s.name(m.roster_id), pts: m.points });
          pf.set(m.roster_id, (pf.get(m.roster_id) || 0) + m.points);
          gp.set(m.roster_id, (gp.get(m.roster_id) || 0) + 1);
        });
        const groups = new Map();
        valid.forEach(m => { if (m.matchup_id == null) return; if (!groups.has(m.matchup_id)) groups.set(m.matchup_id, []); groups.get(m.matchup_id).push(m); });
        groups.forEach(g => {
          if (g.length !== 2) return;
          const [a, b] = g[0].points >= g[1].points ? g : [g[1], g[0]];
          const tie = a.points === b.points;
          games.push({ season: s.season, week, tie, margin: a.points - b.points,
            w: { name: s.name(a.roster_id), pts: a.points }, l: { name: s.name(b.roster_id), pts: b.points } });
          if (tie) { cur.set(a.roster_id, 0); cur.set(b.roster_id, 0); return; }
          const c = (cur.get(a.roster_id) || 0) + 1;
          cur.set(a.roster_id, c);
          if (c > (best.get(a.roster_id) || 0)) best.set(a.roster_id, c);
          cur.set(b.roster_id, 0);
        });
      });
      if (!any) return;
      usedSeasons.push(s.season);
      pf.forEach((v, rid) => seasonPF.push({ season: s.season, current: s.current, name: s.name(rid), pts: v, gp: gp.get(rid) }));
      best.forEach((v, rid) => streaks.push({ season: s.season, name: s.name(rid), len: v }));
    });
    const top = (arr, f) => arr.slice().sort(f).slice(0, 5);
    const pts = x => x.toFixed(2);
    const when = x => `${x.season}, week ${x.week}`;
    const real = games.filter(g => !g.tie);
    return {
      seasons: usedSeasons.sort((a, b) => a - b),
      cards: [
        { title: 'Highest single-week score', rows: top(scores, (a, b) => b.pts - a.pts).map(x => ({ val: pts(x.pts), who: x.name, when: when(x) })) },
        { title: 'Lowest single-week score', rows: top(scores, (a, b) => a.pts - b.pts).map(x => ({ val: pts(x.pts), who: x.name, when: when(x) })) },
        { title: 'Biggest blowout', rows: top(real, (a, b) => b.margin - a.margin).map(g => ({ val: '+' + pts(g.margin), who: `${g.w.name} over ${g.l.name}`, when: `${when(g)}, ${pts(g.w.pts)} to ${pts(g.l.pts)}` })) },
        { title: 'Closest game', rows: top(real, (a, b) => a.margin - b.margin).map(g => ({ val: '+' + pts(g.margin), who: `${g.w.name} over ${g.l.name}`, when: `${when(g)}, ${pts(g.w.pts)} to ${pts(g.l.pts)}` })) },
        { title: 'Highest score in a loss', rows: top(real, (a, b) => b.l.pts - a.l.pts).map(g => ({ val: pts(g.l.pts), who: g.l.name, when: `${when(g)}, lost to ${g.w.name}` })) },
        { title: 'Lowest score in a win', rows: top(real, (a, b) => a.w.pts - b.w.pts).map(g => ({ val: pts(g.w.pts), who: g.w.name, when: `${when(g)}, beat ${g.l.name}` })) },
        { title: 'Most points in a season', rows: top(seasonPF, (a, b) => b.pts - a.pts).map(x => ({ val: pts(x.pts), who: x.name, when: `${x.season}${x.current && !seasonDone() ? `, in progress (${x.gp} games)` : ''}` })) },
        { title: 'Longest win streak', rows: top(streaks, (a, b) => b.len - a.len).map(x => ({ val: `${x.len} W`, who: x.name, when: `${x.season} season` })) }
      ]
    };
  }

  function renderRecords(){
    if (!D.records) {
      loadRecords();
      return '<p class="status">Loading league history from Sleeper…</p>';
    }
    if (D.records.error) return `<div class="error"><strong>${esc(D.records.error)}</strong><br>Try Refresh.</div>`;
    const { seasons, cards } = D.records;
    if (!seasons.length) return '<p class="note">No games have been played yet. Records fill in after week 1 is final.</p>';
    const span = seasons.length > 1 ? `${seasons.length} seasons (${seasons[0]} to ${seasons[seasons.length - 1]})` : `the ${seasons[0]} season`;
    let html = `<p class="note">All-time records from completed regular-season games across ${span}. Each card shows the current record holder.</p><div class="rgrid">`;
    cards.forEach(c => {
      if (!c.rows.length) return;
      const first = c.rows[0];
      html += `<article class="rcard"><h3>${esc(c.title)}</h3><div class="rval">${esc(first.val)}</div>
        <div class="rwho">${esc(first.who)}</div><div class="rwhen">${esc(first.when)}</div>
      </article>`;
    });
    return html + '</div>';
  }

  // ---------- Playoff odds ----------
  function renderOdds(){
    const S = D.sim, n = D.ids.length, k = S.pTeams;
    const idx = new Map(D.ids.map((r, i) => [r, i]));
    const fmt = p => p >= 0.9995 ? '100%' : p >= 0.995 ? '>99%' : p === 0 ? '0%' : p < 0.005 ? '<1%' : Math.round(p * 100) + '%';
    const heat = p => `background:rgba(var(--heat),${Math.min(1, p * 1.15).toFixed(3)});${p * 1.15 > .55 ? 'color:var(--accent-ink);font-weight:600' : ''}`;
    const hasBye = k === 6;
    const playoffsStarted = seasonDone() && (D.firstOpen > D.lastReg);
    let html = '';
    if (!seasonDone()) {
      html += `<p class="note">Odds from ${S.sims.toLocaleString()} simulations of the remaining ${D.remaining.length} weeks and a ${k}-team playoff. Each team’s weekly score is modeled from its scoring so far, pulled slightly toward the league average. Seeds go by record, then points for${D.median ? ', and the median-win game is included' : ''}. Division winners aren’t accounted for.${D.schedUnknown ? ' Some remaining matchups aren’t published yet, so those weeks use random pairings.' : ''}</p>`;
    } else {
      html += `<p class="note">The regular season is over, so the seeds are set. Title odds come from ${S.sims.toLocaleString()} simulations of the bracket${playoffsStarted ? ' and don’t account for playoff games already played; see Playoff Bracket for results' : ''}.</p>`;
    }
    if (!S.bracketOK) html += `<p class="note">Title odds aren’t available for a ${k}-team playoff yet, so only playoff and seed odds are shown.</p>`;
    const rows = D.ids.slice().sort((a, b) => {
      const i = idx.get(a), j = idx.get(b);
      return (S.make[j] - S.make[i]) || (S.champ[j] - S.champ[i]) || (S.avgSeed[i] - S.avgSeed[j]);
    });
    html += `<div class="tablewrap"><table><thead><tr><th class="tl" scope="col">Team</th><th scope="col">Record</th><th scope="col">PF</th>
      <th scope="col">Make playoffs</th>${hasBye ? '<th scope="col">First-round bye</th>' : ''}${S.bracketOK ? '<th scope="col">Reach final</th><th scope="col">Win title</th>' : ''}
      <th scope="col">Avg seed</th>${[...Array(k).keys()].map(p => `<th scope="col">Seed ${p + 1}</th>`).join('')}</tr></thead><tbody>`;
    rows.forEach((rid, pos) => {
      const t = team(rid), i = idx.get(rid);
      const cut = pos === k - 1 ? ' class="cutline"' : '';
      html += `<tr${cut}><td class="tl">${teamBlock(t, '')}</td><td>${record(t)}</td><td>${pfTxt(t)}</td>
        <td class="odds" style="${heat(S.make[i])}">${fmt(S.make[i])}</td>
        ${hasBye ? `<td class="odds" style="${heat(S.bye[i])}">${fmt(S.bye[i])}</td>` : ''}
        ${S.bracketOK ? `<td class="odds" style="${heat(S.finals[i])}">${fmt(S.finals[i])}</td><td class="odds" style="${heat(S.champ[i])}">${fmt(S.champ[i])}</td>` : ''}
        <td class="avgp">${S.avgSeed[i].toFixed(1)}</td>
        ${S.seedProbs[i].slice(0, k).map(p => `<td class="heat" style="${heat(p)}">${p > 0 ? fmt(p) : ''}</td>`).join('')}</tr>`;
    });
    html += '</tbody></table></div>';
    html += `<p class="note">Teams above the line are in the top ${k} by playoff odds. Percentages are simulation estimates, so 100% means every simulated season, not a mathematical clinch.</p>`;
    return html;
  }

  // ---------- News feed ----------
  const REPORTER = { name: 'NOT Adam Schefter', handle: '@NOTAdamSchefter', initials: 'NA', tag: 'Parody', cls: '' };
  const ROAST = { name: 'Turnover Tony', handle: '@TurnoverTony', initials: 'TT', tag: 'Roasts', cls: 'alt' };
  const COACH = { name: 'Coach JB', handle: '@CoachJB', initials: 'JB', tag: 'Retired coach', cls: 'c2' };
  const ANALYST = { name: 'Nazzir Lam', handle: '@NazzirLam', initials: 'NL', tag: 'Analyst', cls: 'c3' };
  const AUTHORS = { adam: REPORTER, roast: ROAST, coach: COACH, analyst: ANALYST };
  function hashStr(str){ let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const choose = (arr, key) => arr[hashStr(key) % arr.length];
  const B = t => `<b>${esc(t)}</b>`;
  // A player's name that opens his profile card.
  const PL = (pid, nm, tag) => `<${tag || 'b'} class="plink" data-player="${esc(pid)}" role="button" tabindex="0">${esc(nm)}</${tag || 'b'}>`;
  const p2 = x => x.toFixed(2);

  async function loadNews(){
    if (!D || D.news || D.newsLoading) return;
    const myD = D;
    myD.newsLoading = true;
    try {
      if (!myD.trades) await loadTrades();
      for (let i = 0; i < 100 && myD.tradesLoading; i++) await new Promise(r => setTimeout(r, 150));
      const posts = [];
      const add = (week, kind, html, key, author) => posts.push({ week, kind, html, author: author || 'adam', key: key || `${week}-${kind}-${posts.length}` });
      const rec = new Map(myD.ids.map(r => [r, { w: 0, l: 0, t: 0, streak: 0 }]));
      const recTxt = r => `${r.w}-${r.l}${r.t ? '-' + r.t : ''}`;
      const pct = r => { const g = r.w + r.l + r.t; return g ? (r.w + 0.5 * r.t) / g : 0.5; };
      let seasonHigh = 0;

      // Player names for lineup stories
      const ids = new Set();
      myD.completedWeeks.forEach(({ list }) => list.forEach(m => (m.players || []).forEach(id => ids.add(id))));
      if (ids.size) myD.players = await playerNames([...ids]);
      const info = id => pname(id) || { nm: 'a player', pos: '', tm: '' };

      // Weekly NFL stat lines (turnovers, missed kicks) for the most recent weeks
      const statsByWeek = new Map();
      const recentWeeks = myD.completedWeeks.map(x => x.week).sort((a, b) => a - b).slice(-6);
      await Promise.all(recentWeeks.map(wk => getJSON(`/stats/nfl/regular/${myD.season}/${wk}`)
        .then(r => { if (r && typeof r === 'object') statsByWeek.set(wk, r); }).catch(() => {})));

      myD.completedWeeks.slice().sort((a, b) => a.week - b.week).forEach(({ week: w, list }) => {
        const valid = list.filter(m => typeof m.points === 'number' && rec.has(m.roster_id));
        if (!valid.some(m => m.points > 0)) return;
        const name = rid => team(rid).name;
        const sorted = valid.slice().sort((a, b) => b.points - a.points);
        const top = sorted[0], low = sorted[sorted.length - 1];

        // CoachJB: retired high school and college coach commenting on the league
        add(w, 'coach_top', choose([
          `Coach JB on ${B(name(top.roster_id))}’s <b>${p2(top.points)}</b>: “Thirty years of coaching, and I can count on one hand the teams that play with that kind of fire. Hat’s off.”`,
          `“${p2(top.points)}? That’s a team that shows up Monday through Saturday, not just Sunday,” says Coach JB of ${B(name(top.roster_id))}.`,
          `Coach JB watched the film on ${B(name(top.roster_id))}’s big week: “Balanced, disciplined, nobody trying to be a hero. That’s how you win ballgames.”`
        ], `${w}ct`), `${w}ct`, 'coach');
        add(w, 'coach_low', choose([
          `Coach JB on ${B(name(low.roster_id))}’s <b>${p2(low.points)}</b>: “I’ve seen JV teams with more fight than that. Somebody get that group back to the practice field.”`,
          `“Fundamentals,” says Coach JB after ${B(name(low.roster_id))} managed ${p2(low.points)}. “Blocking, tackling, setting a lineup. It all starts there.”`,
          `Retired, but Coach JB still has notes for ${B(name(low.roster_id))}’s ${p2(low.points)}: “That’s a team that didn’t come to play. I’d have had them running gassers.”`
        ], `${w}cl`), `${w}cl`, 'coach');

        // Turnover Tony: roast managers for bad plays by their players
        const wkStats = statsByWeek.get(w);
        if (wkStats) {
          const evs = [];
          valid.forEach(m => {
            const started = new Set(m.starters || []);
            (m.players || []).forEach(pid => {
              const st = wkStats[pid];
              if (!st) return;
              const ints = st.pass_int || 0, fl = st.fum_lost || 0, fm = st.fgmiss || 0;
              let type = null, n = 0;
              if (ints > 0 && ints >= fl) { type = 'int'; n = ints; }
              else if (fl > 0) { type = 'fum'; n = fl; }
              else if (fm > 0) { type = 'kick'; n = fm; }
              if (!type) return;
              const isStarter = started.has(pid);
              evs.push({ rid: m.roster_id, pid, type, n, isStarter, score: n * (type === 'kick' ? 2 : 3) + (isStarter ? 1.5 : 0) });
            });
          });
          evs.sort((a, b) => b.score - a.score).slice(0, 3).forEach(e => {
            const nm = PL(e.pid, info(e.pid).nm, 'span'), t = B(name(e.rid)), s = e.n === 1 ? '' : 's', key = `${w}${e.type}${e.pid}`;
            let html;
            if (!e.isStarter) {
              html = choose([
                `${nm} turned it over this week, but ${t} had him on the bench. Smartest move that roster made all week. 🧠`,
                `Good news for ${t}: ${nm} had a rough one, and he was sitting on the bench. Bad news: that was the best decision they made.`
              ], key);
            } else if (e.type === 'int') {
              html = choose([
                `🤡 ${t} started ${nm} in Week ${w}. He threw <b>${e.n} pick${s}</b>. Who was that football even for?`,
                `${nm} threw ${e.n} interception${s} and ${t} watched it happen on their own roster. Bold strategy.`,
                `${e.n} INT${s} from ${nm}. ${t} would have been better off starting a mannequin. The mannequin doesn’t throw it to the defense.`
              ], key);
            } else if (e.type === 'fum') {
              html = choose([
                `${nm} put the ball on the turf. ${t} had him in the lineup. 🤡 Butter fingers, butter lineup.`,
                `🤡 ${nm} fumbled it away, and ${t}’s hopes went with it.`,
                `Somebody tell ${nm} the ball goes in the hands, not on the ground. ${t} started him anyway.`
              ], key);
            } else {
              html = choose([
                `${nm} missed <b>${e.n} field goal${s}</b>. ${t} is basically running a kicker charity.`,
                `🤡 ${nm} missed ${e.n} kick${s}. Kickers have one job, and ${t} started him anyway.`
              ], key);
            }
            add(w, e.type, html, key, 'roast');
          });
        }

        if (top.points > seasonHigh && seasonHigh > 0) {
          add(w, 'high', choose([
            `🚨 BREAKING: ${B(name(top.roster_id))} just dropped <b>${p2(top.points)}</b> in Week ${w}, the highest score of the ${myD.season} season. The commissioner is reportedly reviewing the tape.`,
            `🚨 Season high: ${B(name(top.roster_id))} puts up <b>${p2(top.points)}</b>. Per league sources, the rest of the league has been notified and is “processing.”`
          ], `${w}high`));
        } else {
          add(w, 'top', choose([
            `🚨 ${B(name(top.roster_id))} posted <b>${p2(top.points)}</b> in Week ${w}, the top score in the league. Sources say opposing managers have stopped answering their phones.`,
            `${B(name(top.roster_id))} drops <b>${p2(top.points)}</b> this week. League sources describe the performance as “disrespectful.”`,
            `Team of the Week: ${B(name(top.roster_id))} with <b>${p2(top.points)}</b>. Per sources, a parade route is already being discussed.`,
            `${B(name(top.roster_id))} was the league’s highest scorer in Week ${w} at <b>${p2(top.points)}</b>. Sources say the manager has started referring to themselves in the third person.`
          ], `${w}top`));
        }
        seasonHigh = Math.max(seasonHigh, top.points);
        add(w, 'low', choose([
          `${B(name(low.roster_id))} managed just <b>${p2(low.points)}</b> in Week ${w}, the lowest in the league. Sources say the lineup may have been set by a raccoon.`,
          `Rough week for ${B(name(low.roster_id))}: <b>${p2(low.points)}</b> points. Per sources, the front office is “evaluating all options,” including a full rebuild.`,
          `${B(name(low.roster_id))} scored <b>${p2(low.points)}</b> in Week ${w}. Team officials declined to comment, and the group chat has gone quiet.`,
          `Per sources, ${B(name(low.roster_id))}’s <b>${p2(low.points)}</b> this week has been flagged for review by the league’s integrity committee.`
        ], `${w}low`));

        const groups = new Map();
        valid.forEach(m => { if (m.matchup_id == null) return; if (!groups.has(m.matchup_id)) groups.set(m.matchup_id, []); groups.get(m.matchup_id).push(m); });
        const games = [...groups.values()].filter(g => g.length === 2).map(g => {
          const [a, b] = g[0].points >= g[1].points ? g : [g[1], g[0]];
          return { W: a, L: b, margin: a.points - b.points, tie: a.points === b.points,
            preW: { ...rec.get(a.roster_id) }, preL: { ...rec.get(b.roster_id) } };
        });
        const real = games.filter(g => !g.tie);
        if (real.length) {
          const blow = real.slice().sort((a, b) => b.margin - a.margin)[0];
          if (blow.margin >= 30) add(w, 'blowout', choose([
            `${B(name(blow.W.roster_id))} beat ${B(name(blow.L.roster_id))} by <b>${p2(blow.margin)}</b> (${p2(blow.W.points)} to ${p2(blow.L.points)}). Sources describe the ${esc(name(blow.L.roster_id))} locker room as “a ghost town.”`,
            `Not close: ${B(name(blow.W.roster_id))} over ${B(name(blow.L.roster_id))}, ${p2(blow.W.points)} to ${p2(blow.L.points)}. Per sources, the mercy rule was discussed but ultimately rejected.`,
            `${B(name(blow.W.roster_id))} wins by <b>${p2(blow.margin)}</b> over ${B(name(blow.L.roster_id))}. League sources say the matchup was “over by Sunday at 1pm.”`
          ], `${w}blow`));
          const close = real.slice().sort((a, b) => a.margin - b.margin)[0];
          if (close.margin < 5) add(w, 'close', choose([
            `Instant classic: ${B(name(close.W.roster_id))} edges ${B(name(close.L.roster_id))}, ${p2(close.W.points)} to ${p2(close.L.points)}. A <b>${p2(close.margin)}</b>-point margin. Sources say at least one manager has not slept since Monday night.`,
            `${B(name(close.W.roster_id))} survives ${B(name(close.L.roster_id))} by <b>${p2(close.margin)}</b>. Per sources, ${esc(name(close.L.roster_id))} is “replaying every lineup decision in their head.”`
          ], `${w}close`));
          const upsets = real.filter(g => (g.preW.w + g.preW.l + g.preW.t) > 0 && pct(g.preL) - pct(g.preW) >= 0.25)
            .sort((a, b) => (pct(b.preL) - pct(b.preW)) - (pct(a.preL) - pct(a.preW)));
          if (upsets[0]) {
            const u = upsets[0];
            add(w, 'upset', choose([
              `UPSET ALERT: ${B(name(u.W.roster_id))} (${recTxt(u.preW)}) knocks off ${B(name(u.L.roster_id))} (${recTxt(u.preL)}), ${p2(u.W.points)} to ${p2(u.L.points)}. Vegas is reportedly furious.`,
              `Stunner: ${B(name(u.W.roster_id))} (${recTxt(u.preW)}) takes down ${B(name(u.L.roster_id))} (${recTxt(u.preL)}). Per sources, nobody saw this coming, including ${esc(name(u.W.roster_id))}.`
            ], `${w}upset`));
          }

          // Lineup blunders: a bench player at the same position would have flipped the result
          let worst = null;
          real.forEach(g => {
            const m = g.L, pp = m.players_points || {}, starters = (m.starters || []);
            const bench = (m.players || []).filter(id => !starters.includes(id));
            starters.forEach(sid => {
              const sPts = sid === '0' ? 0 : (pp[sid] || 0);
              const sPos = sid === '0' ? null : info(sid).pos;
              bench.forEach(bid => {
                const bi = info(bid);
                if (sid !== '0' && bi.pos !== sPos) return;
                if (sid === '0' && !bi.pos) return;
                const gain = (pp[bid] || 0) - sPts;
                if (gain > g.margin && (!worst || gain > worst.gain)) worst = { g, sid, bid, gain, sPts, bPts: pp[bid] || 0 };
              });
            });
          });
          if (worst) {
            const t = B(name(worst.g.L.roster_id)), bp = info(worst.bid);
            add(w, 'blunder', worst.sid === '0'
              ? `Ouch. ${t} left a lineup spot <b>empty</b> and lost by ${p2(worst.g.margin)}. ${PL(worst.bid, bp.nm, 'span')} scored ${p2(worst.bPts)} on their bench. Sources say the manager is “aware.”`
              : choose([
                `Ouch. ${t} benched ${PL(worst.bid, bp.nm, 'span')} (<b>${p2(worst.bPts)}</b>) and started ${PL(worst.sid, info(worst.sid).nm, 'span')} (${p2(worst.sPts)}). They lost by ${p2(worst.g.margin)}. Sources say the manager is “aware.”`,
                `Per sources, ${t} is still thinking about ${PL(worst.bid, bp.nm, 'span')}’s <b>${p2(worst.bPts)}</b> points on the bench in a ${p2(worst.g.margin)}-point loss. Start/sit decisions are under internal review.`
              ], `${w}blunder`));
          }
        }

        games.forEach(g => {
          [[g.W, g.tie ? 't' : 'w'], [g.L, g.tie ? 't' : 'l']].forEach(([m, r]) => {
            const R = rec.get(m.roster_id);
            if (r === 'w') { R.w++; R.streak = R.streak > 0 ? R.streak + 1 : 1; }
            else if (r === 'l') { R.l++; R.streak = R.streak < 0 ? R.streak - 1 : -1; }
            else { R.t++; R.streak = 0; }
          });
        });
        games.forEach(g => [g.W, g.L].forEach(m => {
          const R = rec.get(m.roster_id), n = Math.abs(R.streak), t = B(name(m.roster_id));
          if (R.streak >= 3) add(w, 'streak', choose([
            `${t} has won <b>${n} straight</b> and sits at ${recTxt(R)}. League sources believe they are the team to beat, and nobody is arguing right now.`,
            `${n} in a row for ${t}. Per sources, the manager has begun “casually” bringing up the trophy in the group chat.`
          ], `${w}ws${m.roster_id}`));
          if (R.streak <= -3) add(w, 'skid', choose([
            `${t} has now lost <b>${n} in a row</b> and falls to ${recTxt(R)}. Per sources, scouting for the ${D.draftSeason} rookie draft has begun in earnest.`,
            `Losing streak hits ${n} for ${t}. Sources say the team is “fully committed to the process,” whatever that means.`
          ], `${w}ls${m.roster_id}`));
        }));

        let bestS = null;
        rec.forEach((R, rid) => { const n = Math.abs(R.streak); if (n >= 3 && (!bestS || n > bestS.n)) bestS = { rid, n, up: R.streak > 0 }; });
        if (bestS) {
          const tb = B(name(bestS.rid));
          add(w, 'coach_streak', bestS.up ? choose([
            `Coach JB on ${tb}’s ${bestS.n}-game win streak: “Winning is a habit. I told my players that for 30 years, and ${tb} is proving me right.”`,
            `Asked about ${bestS.n} straight wins for ${tb}, Coach JB said: “That’s a program. You don’t luck into ${bestS.n} in a row.”`
          ], `${w}cs`) : choose([
            `Coach JB on ${tb}’s ${bestS.n}-game skid: “Losing is a habit too. Somebody in that locker room has to stand up and say enough.”`,
            `“Tough to watch,” says Coach JB after ${tb} dropped ${bestS.n} straight. “Go back to the basics, and I mean the basics.”`
          ], `${w}cs`), `${w}cs`, 'coach');
        }

        // Nazzir Lam: power rankings and tank watch
        const ranked = [...rec.entries()].sort((a, b) => pct(b[1]) - pct(a[1]) || team(b[0]).pf - team(a[0]).pf);
        add(w, 'power', `Nazzir Lam’s Week ${w} power rankings: ${ranked.slice(0, 3).map(([rid, R], i) => `${i + 1}. ${B(name(rid))} (${recTxt(R)})`).join(', ')}. Disagree? You’re wrong.`, `${w}pr`, 'analyst');
        const worst = ranked[ranked.length - 1];
        if (worst && (worst[1].w + worst[1].l + worst[1].t) > 0) {
          const [wrid, WR] = worst, owner = ownerOf(myD.draftSeason, 1, wrid);
          const tail = owner !== wrid
            ? `The ${myD.draftSeason} 1st belongs to ${B(name(owner))}, so ${B(name(wrid))} is tanking for someone else.`
            : `They still own their ${myD.draftSeason} 1st, so every loss pays off.`;
          add(w, 'tank', choose([
            `Tank watch, Week ${w}: ${B(name(wrid))} sits at ${recTxt(WR)}. ${tail}`,
            `Nazzir Lam’s tank rankings: ${B(name(wrid))} (${recTxt(WR)}) holds the top spot in the race for the ${myD.draftSeason} rookie class. ${tail}`
          ], `${w}tk`), `${w}tk`, 'analyst');
        }
      });

      // Trades
      (myD.trades && myD.trades.list || []).filter(x => x.L.current).forEach(({ t }) => {
        const pl = myD.trades.players || {};
        const sides = (t.roster_ids || []).map(rid => {
          const got = [];
          Object.entries(t.adds || {}).forEach(([pid, to]) => { if (to === rid) got.push(esc((pl[pid] || pid).split('|')[0])); });
          (t.draft_picks || []).forEach(dp => { if (dp.owner_id === rid) got.push(`a ${esc(dp.season)} ${ordinal(dp.round)}`); });
          (t.waiver_budget || []).forEach(x => { if (x.receiver === rid) got.push(`$${esc(x.amount)} FAAB`); });
          return { rid, got };
        });
        const list = a => a.length <= 1 ? (a[0] || 'nothing') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
        let html;
        if (sides.length === 2) {
          const [a, b] = sides;
          html = choose([
            `🚨 Trade: ${B(team(a.rid).name)} acquires ${list(a.got)} from ${B(team(b.rid).name)} for ${list(b.got)}, per league sources.`,
            `🚨 Blockbuster: ${B(team(b.rid).name)} is sending ${list(a.got)} to ${B(team(a.rid).name)} in exchange for ${list(b.got)}. Sources call it a “franchise-altering move” for at least one of them.`
          ], t.transaction_id);
        } else {
          html = `🚨 ${sides.length}-team trade, per league sources: ${sides.map(x => `${B(team(x.rid).name)} gets ${list(x.got)}`).join('; ')}.`;
        }
        add(t.leg || D.startWeek, 'trade', html, t.transaction_id);
        if (sides.length === 2) {
          const grades = ['A+', 'A', 'A-', 'B+', 'B', 'B-', 'C+', 'C', 'C-', 'D+', 'D', 'F'];
          const gr = k => grades[hashStr(k) % grades.length];
          const an = g => (g[0] === 'A' || g[0] === 'F') ? 'an' : 'a';
          const [a, b] = sides;
          add(t.leg || D.startWeek, 'grade', choose([
            `Nazzir Lam’s instant trade grades: ${B(team(a.rid).name)} <b>${gr(t.transaction_id + a.rid)}</b>, ${B(team(b.rid).name)} <b>${gr(t.transaction_id + b.rid)}</b>. Zero research, total confidence.`,
            `Trade grade: ${B(team(a.rid).name)} gets ${an(gr(t.transaction_id + a.rid))} <b>${gr(t.transaction_id + a.rid)}</b>. ${B(team(b.rid).name)} gets ${an(gr(t.transaction_id + b.rid))} <b>${gr(t.transaction_id + b.rid)}</b>. Don’t @ me.`
          ], t.transaction_id + 'g'), t.transaction_id + 'g', 'analyst');
        }
      });

      // Waiver wire, free agents and drops (current league only)
      try {
        const lastLeg = Math.max(myD.defWeek || 1, myD.firstOpen || 1);
        const txWeeks = await Promise.all([...Array(Math.min(19, lastLeg + 1)).keys()].map(w => w < 1 ? Promise.resolve([]) : getJSON(`/league/${leagueId}/transactions/${w}`).catch(() => [])));
        const txs = txWeeks.flat().filter(t => t && (t.type === 'waiver' || t.type === 'free_agent') && t.status === 'complete');
        const txIds = new Set();
        txs.forEach(t => { Object.keys(t.adds || {}).forEach(id => txIds.add(id)); Object.keys(t.drops || {}).forEach(id => txIds.add(id)); });
        if (txIds.size) myD.players = await playerNames([...txIds]);
        const budget = Number((myD.league.settings || {}).waiver_budget) || 0;
        const tname = rid => B(team(rid).name);
        const pfull = pid => { const i = pname(pid); return i ? `${PL(pid, i.nm)}${i.pos ? ` (${esc([i.pos, i.tm].filter(Boolean).join(', '))})` : ''}` : B('a player'); };
        const spent = new Map(myD.ids.map(r => [r, 0]));
        const byWeek = new Map();
        txs.forEach(t => {
          const w = t.leg || 0; if (w < 1) return;
          const adds = Object.entries(t.adds || {}), drops = Object.entries(t.drops || {});
          const bid = t.type === 'waiver' ? Number((t.settings || {}).waiver_bid) || 0 : 0;
          const rid = (adds[0] || drops[0] || [])[1]; if (rid == null) return;
          if (t.type === 'waiver' && adds[0]) spent.set(rid, (spent.get(rid) || 0) + bid);
          if (!byWeek.has(w)) byWeek.set(w, []);
          byWeek.get(w).push({ t, rid, bid, add: adds[0] && adds[0][0], drop: drops[0] && drops[0][0], type: t.type, ts: t.status_updated || t.created || 0 });
        });
        const pctB = b => budget ? Math.round(100 * b / budget) : 0;
        byWeek.forEach((list, w) => {
          const claims = list.filter(x => x.type === 'waiver' && x.add).sort((a, b) => b.bid - a.bid);
          const top = claims[0];
          if (top) {
            const k = `${w}wv${top.t.transaction_id}`;
            add(w, 'waiver', top.bid > 0 ? choose([
              `🚨 WAIVER WIRE: ${tname(top.rid)} wins the bidding for ${pfull(top.add)} with a <b>$${top.bid}</b> FAAB bid${budget ? ` (${pctB(top.bid)}% of the budget)` : ''}, per league sources.`,
              `🚨 ${tname(top.rid)} has claimed ${pfull(top.add)} off waivers for <b>$${top.bid}</b>. Sources say the rest of the league was “not even close.”`,
              `Breaking from the waiver wire: ${pfull(top.add)} is headed to ${tname(top.rid)} at a price of <b>$${top.bid}</b> in FAAB.`
            ], k) : choose([
              `🚨 ${tname(top.rid)} claims ${pfull(top.add)} off waivers for a <b>$0</b> bid. Sources call it “the quietest move of the week.”`,
              `${tname(top.rid)} picks up ${pfull(top.add)} from waivers, no FAAB spent. Per sources, nobody else was watching.`
            ], k), k);
            if (budget && top.bid >= budget * 0.25) add(w, 'waiver_roast', choose([
              `🤡 ${tname(top.rid)} spent <b>$${top.bid}</b> on ${pfull(top.add)}. That’s ${pctB(top.bid)}% of the season’s FAAB on one waiver claim. Bold. Very bold.`,
              `$${top.bid} for ${pfull(top.add)}?? ${tname(top.rid)} just lit a quarter of their budget on fire and called it a strategy.`
            ], k + 'r'), k + 'r', 'roast');
            else if (top.bid === 0 && claims.length >= 3) add(w, 'waiver_roast', `${tname(top.rid)} is treating FAAB like a coupon: $0 on ${pfull(top.add)} while everyone else paid real money. Respect, or just a mistake?`, k + 'r', 'roast');
          }
          if (claims.length >= 2) {
            add(w, 'waiver_recap', choose([
              `Nazzir Lam’s waiver wire report, Week ${w}: ${claims.length} claims went through. Top bids: ${claims.slice(0, 3).map(c => `${tname(c.rid)} for ${pfull(c.add)} ($${c.bid})`).join('; ')}. Take notes.`,
              `Waiver recap, Week ${w}: ${claims.slice(0, 3).map(c => `${pfull(c.add)} to ${tname(c.rid)} ($${c.bid})`).join(', ')}. Nazzir Lam’s verdict: “some of these are smart. Not all.”`
            ], `${w}wr`), `${w}wr`, 'analyst');
          }
          const fa = list.filter(x => x.type === 'free_agent' && x.add);
          if (fa[0]) {
            const f = fa[0], k = `${w}fa${f.t.transaction_id}`;
            add(w, 'fa', choose([
              `Coach JB likes what he sees: ${tname(f.rid)} picked up ${pfull(f.add)} as a free agent. “Always be looking for the next guy. That’s how you build depth.”`,
              `${tname(f.rid)} grabbed ${pfull(f.add)} off the free agent list. Coach JB: “Hustle on the wire is how rosters get built.”`
            ], k), k, 'coach');
          }
          const swaps = list.filter(x => x.add && x.drop);
          const cuts = list.filter(x => x.drop);
          if (swaps[0]) {
            const x = swaps[0], k = `${w}sw${x.t.transaction_id}`;
            add(w, 'drop', choose([
              `🚨 ${tname(x.rid)} cuts ${pfull(x.drop)} and adds ${pfull(x.add)}, per league sources. Roster churn continues.`,
              `${tname(x.rid)} swaps ${pfull(x.drop)} for ${pfull(x.add)}. Sources say the cut “came as a surprise to no one.”`
            ], k), k);
          } else if (cuts[0]) {
            const x = cuts[0], k = `${w}dr${x.t.transaction_id}`;
            add(w, 'drop', `${tname(x.rid)} has released ${pfull(x.drop)}. Per sources, the player “wished the team well.”`, k);
          }
        });
        if (budget && [...spent.values()].some(v => v > 0)) {
          const lw = Math.max(...byWeek.keys());
          const ranked = [...spent.entries()].sort((a, b) => b[1] - a[1]);
          const [r1, v1] = ranked[0], left = budget - v1;
          add(lw, 'waiver_recap', choose([
            `Nazzir Lam’s FAAB watch: ${tname(r1)} has spent the most this season at <b>$${v1}</b> (${pctB(v1)}% of the budget), leaving <b>$${left}</b>. Sources say they are “not done.”`,
            `FAAB report: ${tname(r1)} leads the league in spending with <b>$${v1}</b>. Nazzir Lam: “Eventually the money runs out, folks.”`
          ], 'faabwatch'), 'faabwatch', 'analyst');
        }
      } catch (e) { /* waiver stories are optional */ }

      // Preview of the next week
      const next = myD.remaining[0];
      if (next && next.pairs.length && myD.sim && myD.sim.means) {
        const idx = new Map(myD.ids.map((r, i) => [r, i]));
        const gotw = next.pairs.slice().sort((x, y) => (pct(rec.get(y[0])) + pct(rec.get(y[1]))) - (pct(rec.get(x[0])) + pct(rec.get(x[1]))))[0];
        const [a, b] = gotw;
        const diff = myD.sim.means[idx.get(a)] - myD.sim.means[idx.get(b)];
        const z = diff / (myD.sim.sd * Math.SQRT2);
        const erf = x => { const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; };
        const pa = 0.5 * (1 + erf(z));
        const [fav, dog, pf] = pa >= 0.5 ? [a, b, pa] : [b, a, 1 - pa];
        add(next.week, 'preview', `📺 Game of the Week ${next.week}: ${B(team(a).name)} (${recTxt(rec.get(a))}) vs ${B(team(b).name)} (${recTxt(rec.get(b))}). Sources expect playoff intensity. The model gives ${esc(team(fav).name)} a <b>${Math.round(pf * 100)}%</b> chance; ${esc(team(dog).name)} has reportedly printed that number and taped it to the fridge.`, `prev${next.week}`);
      }

      const kindOrder = ['preview', 'trade', 'grade', 'waiver', 'waiver_roast', 'waiver_recap', 'drop', 'fa', 'high', 'top', 'coach_top', 'upset', 'blowout', 'close', 'blunder', 'int', 'fum', 'kick', 'coach_low', 'coach_streak', 'streak', 'skid', 'power', 'tank', 'low'];
      posts.sort((x, y) => (y.week - x.week) || (kindOrder.indexOf(x.kind) - kindOrder.indexOf(y.kind)));
      myD.news = { posts };
    } catch (e) {
      myD.news = { error: e.message || 'Couldn’t build the news feed.' };
    } finally {
      myD.newsLoading = false;
      if (D === myD && opts.tab === 'news') render();
    }
  }

  function renderNews(){
    if (!D.news) { loadNews(); return '<p class="status">Checking with league sources…</p>'; }
    if (D.news.error) return `<div class="error"><strong>${esc(D.news.error)}</strong><br>Try Refresh.</div>`;
    const { posts: allPosts } = D.news;
    const posts = allPosts;
    if (!posts.length) return '<p class="note">No news yet. Posts show up once Week 1 is final.</p>';
    let html = `<div class="feed">`;
    let lastWeek = null;
    const liveList = D.live || [];
    if (liveList.length) html += `<h3 class="feedwk livewk"><span class="livedot"></span>Just in</h3>`;
    liveList.concat(posts).forEach(p => {
      if (!p.live && p.week !== lastWeek) { html += `<h3 class="feedwk">Week ${p.week}</h3>`; lastWeek = p.week; }
      const h = hashStr(p.key);
      const a = AUTHORS[p.author] || REPORTER;
      const likes = 20 + h % 480, reposts = 3 + (h >>> 9) % 90, replies = 1 + (h >>> 17) % 60;
      html += `<article class="post"><span class="pav${a.cls ? ' ' + a.cls : ''}" aria-hidden="true">${a.initials}</span><div class="pbody">
        <div class="phead"><b>${esc(a.name)}</b><span class="ptag">${esc(a.tag)}</span><span class="phandle">${esc(a.handle)} · ${p.live ? 'LIVE' : 'Wk ' + p.week}</span></div>
        <p class="ptext">${p.html}</p>
        <div class="pacts" aria-hidden="true"><span>💬 ${replies}</span><span>🔁 ${reposts}</span><span>♡ ${likes}</span></div>
      </div></article>`;
    });
    return html + '</div>';
  }

  // ---------- Week data and player names ----------
  function fetchWeek(w){
    if (D.weekData.has(w)) return Promise.resolve(D.weekData.get(w));
    const myD = D;
    myD.weekLoading.add(w);
    return getJSON(`/league/${leagueId}/matchups/${w}`).catch(() => []).then(list => {
      myD.weekData.set(w, list || []);
      myD.weekLoading.delete(w);
      return list || [];
    });
  }
  const pname = pid => {
    const v = D.players[pid];
    if (!v) return null;
    const [nm, pos, tm] = v.split('|');
    return { nm, pos, tm };
  };
  function ensureNames(ids){
    const missing = ids.filter(id => id && id !== '0' && !D.players[id]);
    if (!missing.length || D.namesLoading) return;
    const myD = D;
    myD.namesLoading = true;
    playerNames(missing).then(cache => {
      myD.players = cache;
      myD.namesLoading = false;
      if (D === myD && opts.tab === 'match') render();
    });
  }
  const SLOT = { QB: 'QB', RB: 'RB', WR: 'WR', TE: 'TE', K: 'K', DEF: 'DEF', FLEX: 'FLX', SUPER_FLEX: 'SF', WRRB_FLEX: 'W/R', REC_FLEX: 'W/T', IDP_FLEX: 'IDP' };

  // ---------- Player scoring breakdown ----------
  const STAT_LABELS = {
    pass_yd: 'Passing yards', pass_td: 'Passing TD', pass_int: 'Interceptions thrown', pass_2pt: 'Passing 2-pt conversion',
    pass_cmp: 'Completions', pass_att: 'Pass attempts', pass_inc: 'Incomplete passes', pass_sack: 'Sacks taken', pass_fd: 'Passing first downs',
    rush_yd: 'Rushing yards', rush_td: 'Rushing TD', rush_att: 'Carries', rush_2pt: 'Rushing 2-pt conversion', rush_fd: 'Rushing first downs',
    rec: 'Receptions', rec_yd: 'Receiving yards', rec_td: 'Receiving TD', rec_2pt: 'Receiving 2-pt conversion', rec_fd: 'Receiving first downs', rec_tgt: 'Targets',
    fum: 'Fumbles', fum_lost: 'Fumbles lost', fum_rec: 'Fumble recoveries', fum_rec_td: 'Fumble recovery TD',
    xpm: 'Extra points made', xpmiss: 'Extra points missed', fgm: 'Field goals made', fgmiss: 'Field goals missed',
    fgm_0_19: 'FG 0-19 yards', fgm_20_29: 'FG 20-29 yards', fgm_30_39: 'FG 30-39 yards', fgm_40_49: 'FG 40-49 yards', fgm_50p: 'FG 50+ yards',
    sack: 'Sacks', int: 'Interceptions', ff: 'Forced fumbles', def_td: 'Defensive TD', def_st_td: 'Special teams TD', st_td: 'Special teams TD',
    safe: 'Safeties', blk_kick: 'Blocked kicks', pts_allow: 'Points allowed', tkl: 'Tackles', tkl_solo: 'Solo tackles', tkl_ast: 'Assisted tackles', pass_def: 'Passes defended'
  };
  const statLabel = k => STAT_LABELS[k] || (k.startsWith('pts_allow_') ? `Points allowed (${k.slice(10).replace('_', '-')})` : k.startsWith('bonus_') ? 'Bonus: ' + k.slice(6).replace(/_/g, ' ') : (k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, ' ')));

  function fetchStats(w){
    if (!D.statsCache) D.statsCache = new Map();
    if (D.statsCache.has(w)) return Promise.resolve(D.statsCache.get(w));
    return getJSON(`/stats/nfl/regular/${D.season}/${w}`)
      .then(r => (r && typeof r === 'object') ? r : null).catch(() => null)
      .then(r => { if (r) D.statsCache.set(w, r); return r; });
  }

  function breakdownHtml(pid, w, reported, stats){
    const info = pname(pid) || { nm: 'Player', pos: '', tm: '' };
    const link = '<div class="bkclips" data-clips></div>';
    const head = `<div class="bkhead"><span class="bkwho">${shot(pid, info.pos, info.tm, info.nm)}${PL(pid, info.nm)}</span><span>${reported.toFixed(2)} pts</span></div>`;
    const st = stats && stats[pid];
    const sc = D.league.scoring_settings || {};
    if (!st) return head + '<p class="bknote">Scoring details aren’t available for this week yet.</p>' + link;
    const rows = Object.keys(st).filter(k => typeof st[k] === 'number' && st[k] !== 0 && typeof sc[k] === 'number' && sc[k] !== 0)
      .map(k => ({ k, v: st[k], m: sc[k], p: st[k] * sc[k] })).sort((a, b) => Math.abs(b.p) - Math.abs(a.p));
    const rest = reported - rows.reduce((t, r) => t + r.p, 0);
    const pt = x => `<td class="${x < 0 ? 'neg' : ''}">${x > 0 ? '+' : x < 0 ? '−' : ''}${Math.abs(x).toFixed(2)}</td>`;
    let body = rows.map(r => `<tr><td>${esc(statLabel(r.k))}</td><td>${Number.isInteger(r.v) ? r.v : r.v.toFixed(2)}</td><td>×${Number(r.m.toFixed(4))}</td>${pt(r.p)}</tr>`).join('');
    if (Math.abs(rest) > 0.005) body += `<tr><td>Bonuses and other</td><td></td><td></td>${pt(rest)}</tr>`;
    if (!body) return head + '<p class="bknote">No points scored this week.</p>' + link;
    return head + `<table class="bkt"><tbody>${body}<tr class="tot"><td colspan="3">Total</td><td>${reported.toFixed(2)}</td></tr></tbody></table>` + link;
  }

  // ---------- Highlight clips ----------
  const CLIP_ABBR = { WAS: 'WSH', JAC: 'JAX', LA: 'LAR' };
  function fetchClips(info, w){
    if (!CLIP_API || !D.seasonStart || !info || !info.tm || !info.nm) return Promise.resolve([]);
    const ab = CLIP_ABBR[info.tm] || info.tm;
    const key = ab + '|' + w;
    if (!D.clipCache) D.clipCache = new Map();
    if (D.clipCache.has(key)) return D.clipCache.get(key);
    const t0 = Date.parse(D.seasonStart + 'T00:00:00Z') + (w - 1) * 7 * 864e5 - 864e5;
    const t1 = t0 + 7 * 864e5;
    const q = side => fetch(`${CLIP_API}/highlights?season=${D.season}&${side}TeamAbbreviation=${encodeURIComponent(ab)}&limit=100`)
      .then(r => r.ok ? r.json() : { data: [] }).then(j => j.data || []).catch(() => []);
    const pr = Promise.all([q('home'), q('away')]).then(([a, b]) => {
      const seen = new Set();
      return a.concat(b).filter(h => {
        if (!h || seen.has(h.id)) return false; seen.add(h.id);
        const d = h.match && Date.parse(h.match.date);
        return d >= t0 && d < t1;
      });
    });
    D.clipCache.set(key, pr);
    return pr;
  }
  async function showClips(block, pid, w){
    const slot = block.querySelector('[data-clips]');
    const info = pname(pid);
    if (!slot || !info) return;
