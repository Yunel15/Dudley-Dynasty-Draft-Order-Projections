    return `<div class="tc-grid">${D.tc.cards.map(c => tcCard(c, false)).join('')}</div>`;
  }
  function tcProfileCard(key){
    if (!D.tc) { loadCards(); return ''; }
    if (D.tc.error || !D.tc.byKey.has(key)) return '';
    return `<div class="tc-pwrap">${tcCard(D.tc.byKey.get(key), true)}</div>`;
  }
  // Download: render the card front onto a 1080×1350 (Instagram portrait) canvas with the logo and site address.
  function loadH2C(){
    if (window.html2canvas) return Promise.resolve(window.html2canvas);
    if (!loadH2C.p) loadH2C.p = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.crossOrigin = 'anonymous'; s.referrerPolicy = 'no-referrer';
      s.onload = () => res(window.html2canvas); s.onerror = () => { loadH2C.p = null; rej(new Error('Couldn’t load the image tool. Check your connection and try again.')); }; document.head.appendChild(s); });
    return loadH2C.p;
  }
  async function tcDownload(key, btn){
    const c = D.tc && D.tc.byKey.get(key); if (!c) return;
    const label = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing…';
    const wrap = document.createElement('div'); wrap.className = 'tc-export'; wrap.setAttribute('aria-hidden', 'true');
    const logo = (document.querySelector('.logo') || {}).src || '';
    wrap.innerHTML = `<div class="tc-exp-card"></div><div class="tc-exp-foot">${logo ? `<img src="${logo}" alt="">` : ''}<span>dudleydynasty.com</span></div>`;
    const front = document.querySelector(`.tc[data-tc="${CSS.escape(key)}"] .tc-front`).cloneNode(true);
    const holder = document.createElement('div'); holder.className = `tc tc-${c.tier} tc-exp`; holder.appendChild(front);
    wrap.querySelector('.tc-exp-card').appendChild(holder);
    // Fresh cross-origin loads so Sleeper's images can be drawn into the PNG.
    wrap.querySelectorAll('img').forEach(im => { if (/^https?:/.test(im.src)) { im.crossOrigin = 'anonymous'; im.src = im.src + (im.src.includes('?') ? '&' : '?') + 'dl=' + Date.now(); } });
    document.body.appendChild(wrap);
    try {
      const h2c = await loadH2C();
      await Promise.all([...wrap.querySelectorAll('img')].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
      const canvas = await h2c(wrap, { width: 1080, height: 1350, scale: 1, useCORS: true, backgroundColor: '#141B2B', logging: false });
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `dudley-dynasty-${c.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}-card.png`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      btn.textContent = 'Saved ✓';
    } catch (e) {
      btn.textContent = 'Couldn’t save — try again';
    } finally {
      wrap.remove(); setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 2200);
    }
  }

  // ---------- Manager profiles ----------
  async function loadProfiles(){
    if (!D || D.profiles || D.profilesLoading) return;
    const myD = D;
    myD.profilesLoading = true;
    try {
      myD.profiles = computeProfiles(await loadHistory());
    } catch (e) {
      myD.profiles = { error: e.message || 'Couldn’t load league history from Sleeper.' };
    } finally {
      myD.profilesLoading = false;
      if (D === myD && opts.tab === 'mgr') render();
    }
  }

  function computeProfiles(hist){
    const M = new Map();
    const currentKeys = new Set();
    const get = k => {
      if (!M.has(k)) M.set(k, { key: k, seasons: new Set(), w: 0, l: 0, t: 0, pf: 0, pa: 0, pw: 0, pl: 0, weeklyTop: 0, trophies: [], latest: null });
      return M.get(k);
    };
    const highs = [], lows = [], seasonPts = [], blowouts = [], closes = [], hiLosses = [], loWins = [], streaks = [];

    hist.forEach(L => {
      const keyOf = new Map();
      const ub = new Map(L.users.map(u => [u.user_id, u]));
      L.rosters.forEach(r => {
        const k = r.owner_id || `${L.id}-${r.roster_id}`;
        keyOf.set(r.roster_id, k);
        if (L.current) currentKeys.add(k);
        const m = get(k), st = r.settings || {};
        m.seasons.add(L.season);
        m.w += st.wins || 0; m.l += st.losses || 0; m.t += st.ties || 0;
        m.pf += (st.fpts || 0) + (st.fpts_decimal || 0) / 100;
        m.pa += (st.fpts_against || 0) + (st.fpts_against_decimal || 0) / 100;
        if (!m.latest || L.season >= m.latest.season) {
          const t = L.teamOf(r.roster_id), u = ub.get(r.owner_id) || {};
          m.latest = { season: L.season, name: t.name, avatar: t.avatar, manager: u.display_name || t.manager || '' };
        }
      });
      const K = rid => keyOf.get(rid);
      const regDone = L.current ? seasonDone() : true;
      const award = (rid, type, detail) => { const k = K(rid); if (k) get(k).trophies.push({ type, season: L.season, detail }); };

      if (regDone && L.rosters.length) {
        const rs = L.rosters.map(r => {
          const st = r.settings || {}, g = (st.wins || 0) + (st.losses || 0) + (st.ties || 0);
          return { rid: r.roster_id, pct: g ? ((st.wins || 0) + 0.5 * (st.ties || 0)) / g : 0, pf: (st.fpts || 0) + (st.fpts_decimal || 0) / 100, rec: `${st.wins || 0}-${st.losses || 0}${st.ties ? '-' + st.ties : ''}` };
        });
        const best = rs.slice().sort((a, b) => b.pct - a.pct || b.pf - a.pf)[0];
        if (best && best.pct > 0) award(best.rid, 'reg', best.rec);
        const pts = rs.slice().sort((a, b) => b.pf - a.pf)[0];
        if (pts && pts.pf > 0) award(pts.rid, 'pts', `${pts.pf.toFixed(1)} pts`);
      }

      (L.bracket || []).forEach(b => {
        if (b.w == null || b.l == null) return;
        if (K(b.w)) get(K(b.w)).pw++;
        if (K(b.l)) get(K(b.l)).pl++;
        if (b.p === 1) { award(b.w, 'champ'); award(b.l, 'runner'); }
        if (b.p === 3) award(b.w, 'third');
      });

      const pf = new Map(), cur = new Map(), bestStreak = new Map();
      L.weeks.slice().sort((a, b) => a.week - b.week).forEach(({ week, list }) => {
        const valid = (list || []).filter(m => typeof m.points === 'number' && K(m.roster_id));
        if (!valid.some(m => m.points > 0)) return;
        const top = Math.max(...valid.map(m => m.points));
        valid.forEach(m => {
          if (m.points === top) get(K(m.roster_id)).weeklyTop++;
          if (m.points > 0) { const rcd = { k: K(m.roster_id), val: m.points, season: L.season, week }; highs.push(rcd); lows.push(rcd); }
          pf.set(m.roster_id, (pf.get(m.roster_id) || 0) + m.points);
        });
        const groups = new Map();
        valid.forEach(m => { if (m.matchup_id == null) return; if (!groups.has(m.matchup_id)) groups.set(m.matchup_id, []); groups.get(m.matchup_id).push(m); });
        groups.forEach(g => {
          if (g.length !== 2) return;
          const [a, b] = g[0].points >= g[1].points ? g : [g[1], g[0]];
          if (a.points === b.points) { cur.set(a.roster_id, 0); cur.set(b.roster_id, 0); return; }
          blowouts.push({ k: K(a.roster_id), val: a.points - b.points, season: L.season, week });
          closes.push({ k: K(a.roster_id), val: a.points - b.points, season: L.season, week });
          hiLosses.push({ k: K(b.roster_id), val: b.points, season: L.season, week });
          loWins.push({ k: K(a.roster_id), val: a.points, season: L.season, week });
          const c = (cur.get(a.roster_id) || 0) + 1;
          cur.set(a.roster_id, c);
          if (c > (bestStreak.get(a.roster_id) || 0)) bestStreak.set(a.roster_id, c);
          cur.set(b.roster_id, 0);
        });
      });
      pf.forEach((v, rid) => seasonPts.push({ k: K(rid), val: v, season: L.season }));
      bestStreak.forEach((v, rid) => streaks.push({ k: K(rid), val: v, season: L.season }));
    });

    const holder = (arr, title, fmt, lowest) => {
      if (!arr.length) return;
      const top = arr.slice().sort((a, b) => lowest ? a.val - b.val : b.val - a.val)[0];
      get(top.k).trophies.push({ type: 'record', title, detail: fmt(top) });
    };
    holder(highs, 'Highest single-week score', x => `${x.val.toFixed(2)}, ${x.season} week ${x.week}`);
    holder(seasonPts, 'Most points in a season', x => `${x.val.toFixed(2)}, ${x.season}`);
    holder(blowouts, 'Biggest blowout', x => `+${x.val.toFixed(2)}, ${x.season} week ${x.week}`);
    holder(streaks, 'Longest win streak', x => `${x.val} straight wins, ${x.season}`);
    holder(lows, 'Lowest single-week score', x => `${x.val.toFixed(2)}, ${x.season} week ${x.week}`, true);
    holder(closes, 'Closest game', x => `Won by ${x.val.toFixed(2)}, ${x.season} week ${x.week}`, true);
    holder(hiLosses, 'Highest score in a loss', x => `${x.val.toFixed(2)}, ${x.season} week ${x.week}`);
    holder(loWins, 'Lowest score in a win', x => `${x.val.toFixed(2)}, ${x.season} week ${x.week}`, true);

    const list = [...M.values()].filter(m => m.latest).map(m => ({ ...m, current: currentKeys.has(m.key),
      champs: m.trophies.filter(t => t.type === 'champ').length,
      pct: (m.w + m.l + m.t) ? (m.w + 0.5 * m.t) / (m.w + m.l + m.t) : 0 }));
    list.sort((a, b) => (b.current - a.current) || (b.champs - a.champs) || (b.pct - a.pct) || (b.pf - a.pf));
    return { list, seasons: hist.length };
  }

  const RECORD_ICONS = {
    'Highest single-week score': '🚀',
    'Most points in a season': '📈',
    'Biggest blowout': '💥',
    'Longest win streak': '⚡',
    'Closest game': '⏱️',
    'Highest score in a loss': '💔',
    'Lowest score in a win': '🍀',
    'Lowest single-week score': '🥶'
  };
  const TROPHIES = [
    ['champ', '🏆', 'League champion'],
    ['runner', '🥈', 'Runner-up'],
    ['third', '🥉', 'Third place'],
    ['reg', '⭐', 'Best regular-season record'],
    ['pts', '🔥', 'Points title']
  ];

  function renderProfiles(){
    if (!D.profiles) {
      loadProfiles();
      return '<p class="status">Loading league history from Sleeper…</p>';
    }
    if (D.profiles.error) return `<div class="error"><strong>${esc(D.profiles.error)}</strong><br>Try Refresh.</div>`;
    let html = `<div class="pgrid">`;
    D.profiles.list.forEach(m => {
      const n = m.seasons.size;
      const g = m.w + m.l + m.t;
      const pct = g ? m.pct.toFixed(3).replace(/^0/, '') : '.000';
      const meta = `${m.latest.manager ? esc(m.latest.manager) + ', ' : ''}${n} season${n === 1 ? '' : 's'}${m.current ? '' : ', former manager'}`;
      let trophies = '';
      TROPHIES.forEach(([type, icon, label]) => {
        const got = m.trophies.filter(t => t.type === type);
        if (!got.length) return;
        const years = got.map(t => t.detail ? `${t.season} (${t.detail})` : t.season).join(', ');
        trophies += `<li><span class="ticon" aria-hidden="true">${icon}</span><span><b>${label}${got.length > 1 ? ` ×${got.length}` : ''}</b><small>${esc(years)}</small></span></li>`;
      });
      m.trophies.filter(t => t.type === 'record').forEach(t => {
        trophies += `<li><span class="ticon" aria-hidden="true">${RECORD_ICONS[t.title] || '🎖️'}</span><span><b>League record: ${esc(t.title)}</b><small>${esc(t.detail)}</small></span></li>`;
      });
      html += `<article class="pcard">${m.current ? tcProfileCard(m.key) : ''}${teamBlock(m.latest, meta)}
        <div class="prec"><span class="pbig">${m.w}-${m.l}${m.t ? '-' + m.t : ''}</span><span class="psub">All-time record<br>${pct} win pct</span></div>
        <dl class="pstats">
          <div><dt>Playoffs</dt><dd>${m.pw}-${m.pl}</dd></div>
          <div><dt>Points for</dt><dd>${m.pf.toFixed(1)}</dd></div>
          <div><dt>Points against</dt><dd>${m.pa.toFixed(1)}</dd></div>
          <div><dt>Per game</dt><dd>${g ? (m.pf / g).toFixed(1) : '0.0'}</dd></div>
          <div><dt>Top score of the week</dt><dd>${m.weeklyTop}×</dd></div>
        </dl>
        <h3 class="tch">Trophy Case</h3>
        ${trophies ? `<ul class="trophies">${trophies}</ul>` : '<p class="tempty">Empty for now.</p>'}
        ${m.current ? rvProfileBlock(m.key) : ''}
      </article>`;
    });
    return html + '</div>';
  }

  // ---------- Trade history ----------
  async function playerNames(ids){
    let cache = {};
    try { cache = JSON.parse(store.get('playerNames') || '{}'); } catch (e) {}
    const missing = ids.filter(id => !cache[id]);
    if (missing.length) {
      try {
        const all = await getJSON('/players/nfl');
        missing.forEach(id => {
          const p = all[id];
          const name = p ? (p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || id) : id;
          cache[id] = [name, p ? (p.position || '') : '', p ? (p.team || '') : ''].join('|');
        });
        store.set('playerNames', JSON.stringify(cache));
      } catch (e) {}
    }
    return cache;
  }

  async function loadTrades(){
    if (!D || D.trades || D.tradesLoading) return;
    const myD = D;
    myD.tradesLoading = true;
    try {
      const leagues = await loadHistory();
      const list = [];
      for (const L of leagues) {
        const weeks = await Promise.all([...Array(19).keys()].map(w => getJSON(`/league/${L.id}/transactions/${w}`).catch(() => [])));
        const seen = new Set();
        weeks.flat().forEach(t => {
          if (!t || t.type !== 'trade' || t.status !== 'complete' || seen.has(t.transaction_id)) return;
          seen.add(t.transaction_id);
          list.push({ t, L });
        });
      }
      list.sort((a, b) => (b.t.status_updated || b.t.created || 0) - (a.t.status_updated || a.t.created || 0));
      const ids = new Set();
      list.forEach(({ t }) => Object.keys(t.adds || {}).forEach(id => ids.add(id)));
      const players = ids.size ? await playerNames([...ids]) : {};
      myD.trades = { list, players };
    } catch (e) {
      myD.trades = { error: e.message || 'Couldn’t load trades from Sleeper.' };
    } finally {
      myD.tradesLoading = false;
      if (D === myD && (opts.tab === 'trades' || opts.tab === 'tn')) render();
    }
  }

  function renderTrades(){
    if (!D.trades) {
      loadTrades();
      return '<p class="status">Loading trades from Sleeper…</p>';
    }
    if (D.trades.error) return `<div class="error"><strong>${esc(D.trades.error)}</strong><br>Try Refresh.</div>`;
    const sel = opts.tradeTeam || 0;
    const teamOpts = D.ids.slice().sort((a, b) => team(a).name.localeCompare(team(b).name))
      .map(r => `<option value="${r}" ${sel === r ? 'selected' : ''}>${esc(team(r).name)}</option>`).join('');
    let html = `<div class="controls"><label class="field">Show trades for<select data-opt="tradeTeam">
      <option value="0" ${!sel ? 'selected' : ''}>All teams</option>${teamOpts}</select></label></div>`;
    const list = D.trades.list.filter(({ t }) => !sel || (t.roster_ids || []).includes(sel));
    if (!list.length) {
      return html + `<p class="note">${sel ? `${esc(team(sel).name)} hasn’t made any trades yet.` : 'No trades have been made in this league yet.'}</p>`;
    }
    html += `<div class="tlist">`;
    const order = currentOrder();
    const { players } = D.trades;
    list.forEach(({ t, L }) => {
      const ts = t.status_updated || t.created;
      const date = ts ? new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : `${L.season} season`;
      html += `<article class="trade"><time>${esc(date)}</time><div class="sides">`;
      (t.roster_ids || []).forEach(rid => {
        const items = [];
        Object.entries(t.adds || {}).forEach(([pid, to]) => {
          if (to !== rid) return;
          const [nm, pos, tm] = (players[pid] || `${pid}||`).split('|');
          items.push(`<li><span class="asset-main">${PL(pid, nm, 'span')}</span>${pos || tm ? `<span class="asset-sub">${esc([pos, tm].filter(Boolean).join(', '))}</span>` : ''}</li>`);
        });
        (t.draft_picks || []).forEach(dp => {
          if (dp.owner_id !== rid) return;
          const parts = [];
          parts.push(dp.roster_id === rid ? 'Their own pick back' : `${L.teamOf(dp.roster_id).name}’s pick`);
          if (L.current && Number(dp.season) === D.draftSeason && D.ids.includes(dp.roster_id)) {
            parts.push(`${seasonDone() ? 'slot' : 'currently'} ${pickLabel(dp.round, slotOf(order, dp.round, dp.roster_id))}`);
          }
          items.push(`<li class="asset-pick"><span class="asset-main">${esc(dp.season)} ${ordinal(dp.round)}</span><span class="asset-sub">${esc(parts.join(', '))}</span></li>`);
        });
        (t.waiver_budget || []).forEach(w => {
          if (w.receiver === rid) items.push(`<li><span class="asset-main">$${esc(w.amount)} FAAB</span></li>`);
        });
        html += `<div class="side">${teamBlock(L.teamOf(rid), 'received')}<ul>${items.join('') || '<li class="asset-sub">Nothing</li>'}</ul></div>`;
      });
      html += '</div></article>';
    });
    return html + '</div>';
  }

  // ---------- Player card: header, game logs, career, news, depth chart, transactions ----------
  const SAPI = 'https://api.sleeper.com';
  const pcache = new Map();
  const getOnce = (k, url) => {
    if (!pcache.has(k)) pcache.set(k, fetch(url, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null));
    return pcache.get(k);
  };
  const statsFor = (pid, season, weekly) => getOnce(`s:${pid}:${season}:${weekly ? 'w' : 's'}`, `${SAPI}/stats/nfl/player/${encodeURIComponent(pid)}?season_type=regular&season=${season}${weekly ? '&grouping=week' : ''}`);
  const projFor = (pid, season) => getOnce(`p:${pid}:${season}`, `${SAPI}/projections/nfl/player/${encodeURIComponent(pid)}?season_type=regular&season=${season}&grouping=week`);
  const playerFor = pid => getOnce(`i:${pid}`, `${SAPI}/players/nfl/${encodeURIComponent(pid)}`);
  const newsFor = pid => getOnce(`n:${pid}`, `${SAPI}/players/nfl/${encodeURIComponent(pid)}/news?limit=5`);
  const schedFor = season => getOnce(`sch:${season}`, `${SAPI}/schedule/nfl/regular/${season}`);
  // Team depth charts come from Sleeper's full player list, which is large, so keep a compact copy for 12 hours.
  async function depthCharts(){
    try { const c = JSON.parse(store.get('depthCharts') || 'null'); if (c && Date.now() - c.ts < 43200000) return c.teams; } catch (e) {}
    const all = await getOnce('all', `${API}/players/nfl`);
    if (!all) return null;
    const teams = {};
    Object.values(all).forEach(p => {
      if (!p || !p.team || !p.depth_chart_position || p.depth_chart_order == null || !p.active) return;
      const t = teams[p.team] || (teams[p.team] = {});
      (t[p.depth_chart_position] || (t[p.depth_chart_position] = [])).push([p.depth_chart_order, p.full_name || `${p.first_name} ${p.last_name}`, p.player_id]);
    });
    Object.values(teams).forEach(t => Object.values(t).forEach(a => a.sort((x, y) => x[0] - y[0])));
    try { store.set('depthCharts', JSON.stringify({ ts: Date.now(), teams })); } catch (e) {}
    return teams;
  }
  // Fantasy points with this league's own scoring settings.
  const fpts = st => { const sc = (D.league && D.league.scoring_settings) || {}; let t = 0; for (const k in st || {}) if (sc[k] != null && typeof st[k] === 'number') t += st[k] * sc[k]; return Math.round(t * 100) / 100; };
  const TEAMS = { ARI: ['Cardinals', '#97233F'], ATL: ['Falcons', '#A71930'], BAL: ['Ravens', '#241773'], BUF: ['Bills', '#00338D'], CAR: ['Panthers', '#0076B6'], CHI: ['Bears', '#0B162A'],
    CIN: ['Bengals', '#C2410C'], CLE: ['Browns', '#311D00'], DAL: ['Cowboys', '#041E42'], DEN: ['Broncos', '#C2410C'], DET: ['Lions', '#0076B6'], GB: ['Packers', '#203731'], HOU: ['Texans', '#03202F'],
    IND: ['Colts', '#002C5F'], JAX: ['Jaguars', '#006778'], KC: ['Chiefs', '#C8102E'], LV: ['Raiders', '#2A2A2A'], LAC: ['Chargers', '#0067A6'], LAR: ['Rams', '#003594'], MIA: ['Dolphins', '#007C85'],
    MIN: ['Vikings', '#4F2683'], NE: ['Patriots', '#002244'], NO: ['Saints', '#7A6A45'], NYG: ['Giants', '#0B2265'], NYJ: ['Jets', '#125740'], PHI: ['Eagles', '#004C54'], PIT: ['Steelers', '#1F1F1F'],
    SF: ['49ers', '#AA0000'], SEA: ['Seahawks', '#002244'], TB: ['Buccaneers', '#B00A0A'], TEN: ['Titans', '#0C2340'], WAS: ['Commanders', '#5A1414'] };
  const n0 = v => (v == null || isNaN(v)) ? 0 : v;
  const dash = v => (v == null || v === 0) ? '-' : (Math.round(v * 100) / 100);
  const ratio = (a, b) => b ? Math.round(a / b * 100) / 100 : '-';
  // Column groups per position. Each column: [label, value fn, higherIsBetter (true/false/null = no shading)]
  const G = {

    const head1 = `<tr class="pc-gh"><th colspan="3"></th><th colspan="${cur ? 3 : 2}">Fantasy</th>${groups.map(g => `<th colspan="${g[1].length}">${g[0]}</th>`).join('')}</tr>`;
    const head2 = `<tr><th>Wk</th><th>Opp</th><th>Proj</th><th class="pc-fp">FPts</th>${cur ? '<th>Lineup</th>' : ''}<th>Snp%</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr>`;
    const body = rows.map(r => {
      if (r.bye && !r.playedIt) return `<tr class="pc-bye"><td>${r.w}</td><td>BYE</td><td></td><td class="pc-fp"></td>${cur ? '<td></td>' : ''}<td></td>${cols.map(() => '<td></td>').join('')}</tr>`;
      const luCell = cur ? `<td>${r.lu ? `<span class="pc-lu ${r.lu.started ? 'on' : ''}" title="${esc(team(r.lu.rid).name)}">${r.lu.started ? 'Start' : 'Bench'}</span>` : '-'}</td>` : '';
      if (!r.playedIt) return `<tr class="${r.done ? 'pc-dnp' : 'pc-fut'}"><td>${r.w}</td><td>${esc(r.opp || '-')}</td><td>${r.proj != null ? r.proj.toFixed(2) : '-'}</td><td class="pc-fp">${r.done ? '<span class="asset-sub">DNP</span>' : '-'}</td>${luCell}<td>-</td>${cols.map(() => '<td>-</td>').join('')}</tr>`;
      return `<tr><td>${r.w}</td><td>${esc(r.opp || '-')}</td><td>${r.proj != null ? r.proj.toFixed(2) : '-'}</td><td class="pc-fp"${ptsShade(r.pts)}><b>${r.pts.toFixed(2)}</b></td>${luCell}<td>${r.snp == null ? '-' : r.snp}</td>${cols.map((c, ci) => { const v = c[1](r.st); return `<td${shade(ci, v)}>${dash(v)}</td>`; }).join('')}</tr>`;

      // Played weeks newest first, then the rest of the schedule in order under "Upcoming".
      const past = rows.filter(r => r.done).reverse(), next = rows.filter(r => !r.done);

        if (!r.playedIt) return `<div class="pm-g ${r.done ? 'dnp' : 'fut'}"><div class="pm-gh"><span class="pm-wk">W${r.w}</span><span class="pm-opp">${esc(r.opp || '-')}</span>${luB}<span class="pm-line">${r.done ? 'Did not play' : 'Upcoming'}</span><span class="pm-pt"><b>${r.done ? '–' : (r.proj != null ? r.proj.toFixed(1) : '–')}</b><small>${r.done ? '' : 'proj'}</small></span></div></div>`;
        const det = groups.map(g => `<div class="pm-dg"><span class="pm-dgh">${g[0]}</span><div class="pm-dgc">${g[1].map(c => `<div><span>${c[0]}</span><b>${dash(c[1](r.st))}</b></div>`).join('')}</div></div>`).join('')
          + `<div class="pm-dg"><span class="pm-dgh">Usage</span><div class="pm-dgc"><div><span>Snap%</span><b>${r.snp == null ? '-' : r.snp}</b></div><div><span>Proj</span><b>${r.proj != null ? r.proj.toFixed(1) : '-'}</b></div></div></div>`;

      };
      const items = past.map(item).join('') + (next.length ? `<h4 class="pm-sub">Upcoming</h4>${next.map(item).join('')}` : '');
      box.innerHTML = (wk || pj) ? `${sumM}<div class="pm-glist">${items}</div>` : '<p class="pc-empty">Couldn’t load stats from Sleeper. Try again in a moment.</p>';

      : '<p class="pc-empty">Couldn’t load stats from Sleeper. Try again in a moment.</p>';
  }

  // ---------- Streak breakdown (week-by-week matchups in the current streak) ----------
  function openStreak(rid){
    const x = standingsData().get(rid); if (!x) return;
    const c = x.cur; if (!c.n) return;
    const games = x.gm.slice(-c.n).reverse(), t = team(rid);
    const word = c.t === 'W' ? 'win' : c.t === 'L' ? 'losing' : 'tie';
    const side = (rt, pts, win) => `<div class="sk-side${win ? ' win' : ''}">${teamBlock(rt, '')}<span class="sk-pts">${pts.toFixed(2)}</span></div>`;
    const rows = games.map(g => {
      const res = `<span class="sk-res ${g.res.toLowerCase()}">${g.res}</span>`;
      const body = g.med != null
        ? `${side(t, g.pts, g.res === 'W')}<div class="sk-side sk-med${g.res === 'L' ? ' win' : ''}"><div class="team"><div class="tx"><div class="tname">League median</div></div></div><span class="sk-pts">${g.med.toFixed(2)}</span></div>`
        : `${side(t, g.pts, g.pts > g.oppPts)}${side(team(g.opp), g.oppPts, g.oppPts > g.pts)}`;
      return `<button type="button" class="sk-row" data-goto-match="${g.w}:${g.mid}"><span class="sk-wk">Week ${g.w}</span>${res}<div class="sk-teams">${body}</div><span class="sk-go">›</span></button>`;
    }).join('');
    closeStreak();
    const el = document.createElement('div'); el.className = 'sk-overlay'; el.id = 'skov';
    el.innerHTML = `<div class="sk-modal" role="dialog" aria-modal="true" aria-label="${esc(t.name)} ${word} streak">
      <header>${teamBlock(t, `${c.n}-game ${word} streak`)}<button type="button" class="sk-x" data-sk-close aria-label="Close">×</button></header>
      <div class="sk-list">${rows}</div></div>`;
    document.body.appendChild(el); document.body.classList.add('sk-lock');
    el.addEventListener('click', e => {
      if (e.target === el || e.target.closest('[data-sk-close]')) return closeStreak();
      const row = e.target.closest('[data-goto-match]'); if (!row) return;
      closeStreak(); const [w, mid] = row.dataset.gotoMatch.split(':').map(Number);

    let left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), innerWidth - t.width - 8);
    let top = r.bottom + 8; if (top + t.height > innerHeight - 8) top = r.top - t.height - 8;

  // Trade Calculator search box: type to find a player or pick on the chosen team.
  function calcSuggest(input){
    const k = input.dataset.calcSearch, ul = document.querySelector(`[data-sug="${k}"]`);
    if (!ul || !D || !D.calc || !D.tf || D.tf.error) return;
    const t = finderModel().teams.get(D.calc[k].rid); if (!t) return;
    const q = input.value.trim().toLowerCase();
    const words = q.split(/\s+/).filter(Boolean);
    const list = t.assets.filter(a => !D.calc[k].items.includes(a.key))
      .filter(a => !words.length || words.every(w => `${a.label} ${a.sub}`.toLowerCase().includes(w))).slice(0, 8);
    ul.innerHTML = list.length ? list.map(a => `<li><button type="button" data-calc-pick="${k}" data-key="${esc(a.key)}">${a.kind === 'p' ? shot(a.id, a.pos, a.p.tm, a.label) : '<span class="hs pick" aria-hidden="true">PK</span>'}<span class="tfn2"><span class="asset-main">${esc(a.label)}</span><span class="asset-sub">${esc(a.sub)}</span></span><b class="tfv">${Math.round(a.v).toLocaleString()}</b></button></li>`).join('') : '<li class="asset-sub csnone">No match on this roster</li>';
    ul.hidden = false;
  }
  $('#app').addEventListener('input', e => { if (e.target.matches('[data-calc-search]')) calcSuggest(e.target); });
  $('#app').addEventListener('focusin', e => { if (e.target.matches('[data-calc-search]')) calcSuggest(e.target); });
  $('#app').addEventListener('keydown', e => {
    if (!e.target.matches('[data-calc-search]')) return;
    if (e.key === 'Enter') { e.preventDefault(); const b = document.querySelector(`[data-sug="${e.target.dataset.calcSearch}"] [data-calc-pick]`); if (b) b.click(); }
    if (e.key === 'Escape') { document.querySelectorAll('.csug').forEach(u => { u.hidden = true; }); }
  });
  $('#refresh').addEventListener('click', load);
  $('#leagueForm').addEventListener('submit', e => {
    e.preventDefault();
    const raw = $('#leagueInput').value.trim();
    const m = raw.match(/\d{8,}/);
    if (!m) { $('#leagueInput').focus(); return; }
    leagueId = m[0];
    store.set('leagueId', leagueId);
    const u = new URL(location.href); u.searchParams.set('league', leagueId); history.replaceState(null, '', u);
    D = null;
    load();
  });

  // ---------- Top banner: rotates draft timer / weekly scoreboard / biggest momentum swing (every minute) ----------
  const BN = { cur: 'timer', hover: false, label: { timer: 'draft countdown', score: 'weekly scoreboard', swing: 'biggest momentum swing' } };
  const bnAvail = () => ['timer', ...(D && D.bnScore ? ['score'] : []), ...(D && D.bsw && D.bsw.data ? ['swing'] : [])];
  function bnShow(k){
    const av = bnAvail(); if (!av.includes(k)) k = 'timer';
    BN.cur = k;
    document.querySelectorAll('#cd .cdp').forEach(el => { const on = el.dataset.panel === k; el.classList.toggle('on', on); if (on) el.removeAttribute('inert'); else el.setAttribute('inert', ''); });
    const dots = document.getElementById('cddots');
    if (dots) dots.innerHTML = av.length > 1 ? av.map(x => `<button type="button" data-bn-go="${x}" aria-label="Show the ${BN.label[x]}" aria-pressed="${x === k}"></button>`).join('') : '';
  }
  function gotoMatch(w, mid, chart){
    closeSheet(); opts.tab = 'match'; opts.mview = 'week'; opts.week = w; D.openMatch = { w, id: mid }; saveOpts(); render();
    const card = document.querySelector(`[data-card="${mid}"]`); window.scrollTo(0, card ? Math.max(0, window.scrollY + card.getBoundingClientRect().top - 80) : 0);
    if (chart) setTimeout(() => openWpChart(w, mid), 350);
  }
  function bnPairs(list){
    const g = new Map(); (list || []).forEach(m => { if (m.matchup_id == null) return; if (!g.has(m.matchup_id)) g.set(m.matchup_id, []); g.get(m.matchup_id).push(m); });
    return [...g.entries()].sort((x, y) => x[0] - y[0]).map(([mid, v]) => { v.mid = mid; return v; }).filter(v => v.length === 2);
  }
  function refreshBanner(){
    if (!D || !document.getElementById('cd')) return;
    const w = D.defWeek, list = D.weekData.get(w);
    if (!list && !D.weekLoading.has(w)) { fetchWeek(w).then(() => refreshBanner()); }
    const sc = document.getElementById('cdscore'), pairs = bnPairs(list);
    if (sc && pairs.length) {
      const ctx = D.wctx && D.wctx.get(w), anyPts = (list || []).some(m => (m.points || 0) > 0);
      const live = ctx && [...ctx.sched.values()].some(x => x.status === 'in_game');
      const allDone = ctx && ctx.sched.size && [...ctx.sched.values()].every(x => x.status === 'complete');
      const tiles = pairs.map(([a, b]) => {
        const ta = team(a.roster_id), tb = team(b.roster_id), pa = a.points || 0, pb = b.points || 0;
        const wp = ctx && !allDone && (ctx.hasProj || anyPts) ? Math.round(winProb(a, b, ctx, false).pA * 100) : null;
        return `<button type="button" class="cdm" data-bn-match="${pairs.indexOf(pairs.find(q => q.mid === a.matchup_id))}" data-bn-mid="${a.matchup_id}" aria-label="${esc(ta.name)} ${anyPts ? pa.toFixed(2) : ''} versus ${esc(tb.name)} ${anyPts ? pb.toFixed(2) : ''}. Open matchup">
          <span class="r${anyPts && pa > pb ? ' win' : ''}"><i>${esc(ta.name)}</i><b>${anyPts ? pa.toFixed(2) : '–'}</b></span><span class="r${anyPts && pb > pa ? ' win' : ''}"><i>${esc(tb.name)}</i><b>${anyPts ? pb.toFixed(2) : '–'}</b></span>${wp != null ? `<span class="wpm" title="${esc(ta.name)} ${wp}% to win"><i style="width:${wp}%"></i></span>` : ''}</button>`;
      }).join('');
      sc.innerHTML = `<div class="cdlabel">Week ${w} Scoreboard${live ? ' · Live' : allDone ? ' · Final' : ''}</div><div class="cdscore">${tiles}</div>`;
      D.bnScore = true;
    }
    const sw = document.getElementById('cdswing'), d = D.bsw && D.bsw.data;
    if (sw && d) {
      const ta = team(d.a), tb = team(d.b), helped = team(d.helped), pts = Math.abs(Math.round(d.d * 100));
      sw.innerHTML = `<div class="cdlabel">Biggest Momentum Swing · Week ${d.w}${d.final ? ' · Final' : ' · Live'}</div>
        <button type="button" class="cdsw" data-bn-swing aria-label="Open the momentum chart for ${esc(ta.name)} versus ${esc(tb.name)}"><span class="cdsw-d">+${pts}<small>win prob</small></span>
        <span class="cdsw-t"><b>${esc(helped.name)}</b><i>${esc(d.text)}</i><small>${esc(ta.name)} vs ${esc(tb.name)} · Q${d.per} ${esc(d.clk)}${d.who ? ` · ${esc(d.who)}` : ''}</small></span></button>`;
    }
    bnShow(BN.cur);
  }
  async function bannerSwingLoad(){
    if (!D) return;
    const myD = D, s = myD.bsw || (myD.bsw = { ts: 0, busy: false, data: null, final: false });
    if (s.busy || (s.ts && (s.final || Date.now() - s.ts < 120000))) return;
    s.busy = true;
    try {
      const wait = async (fn, ms) => { const t0 = Date.now(); while (!fn() && Date.now() - t0 < ms) await new Promise(r => setTimeout(r, 250)); return fn(); };
      let w = myD.defWeek;
      let list = await fetchWeek(w), ctx = (weekContext(w), null);
      await wait(() => myD.wctx.has(w), 20000); ctx = myD.wctx.get(w);
      if (!ctx) throw new Error('ctx');
      if (![...ctx.sched.values()].some(x => x.status !== 'pre_game') && w > myD.startWeek) {   // nothing has kicked off yet: show last week's
        w -= 1; list = await fetchWeek(w); weekContext(w); await wait(() => myD.wctx.has(w), 20000); ctx = myD.wctx.get(w); if (!ctx) throw new Error('ctx');
      }
      const sts = [...ctx.sched.values()], started = sts.some(x => x.status !== 'pre_game'), final = sts.length > 0 && sts.every(x => x.status === 'complete');
      if (!started) { s.data = null; s.ts = Date.now(); return; }
      const pairs = bnPairs(list), ids = pairs.flatMap(g => g.flatMap(m => m.starters || []));
      ensureNames(ids); await wait(() => ids.every(id => !id || id === '0' || myD.players[id]), 20000);
      await kickoffsFor(w); try { await loadEspnIds(); } catch (e) {}
      const games = myD.gmeta && myD.gmeta.get(w); if (!games) throw new Error('games');
      let best = null;
      for (const g of pairs) {
        let R = null; try { R = await momentumPBP(g[0], g[1], w, ctx, games); } catch (e) { R = null; }
        const r = R && R.swings[0]; if (!r || (best && Math.abs(r.d) <= Math.abs(best.d))) continue;
        const who = r.who.slice().sort((x, y) => y.pts - x.pts)[0];
        best = { w, mid: g.mid, a: g[0].roster_id, b: g[1].roster_id, helped: (r.d > 0 ? g[0] : g[1]).roster_id, d: r.d, text: playTxt(r.p.text).slice(0, 140), per: r.p.per, clk: r.p.clk, who: who ? `${who.nm} +${(r.who.length > 1 ? who.pts : r.pts).toFixed(1)} pts` : '' };
      }
      if (myD === D) { s.data = best ? { ...best, final } : null; s.final = final; s.ts = Date.now(); }
    } catch (e) { s.ts = Date.now() - 60000; }
    finally { s.busy = false; if (myD === D) refreshBanner(); }
  }
  // every minute: move to the next panel (paused while the pointer is over the banner) and refresh live data
  function bnTick(){
    if (document.hidden || !D) return;
    const w = D.defWeek, ctx = D.wctx && D.wctx.get(w), live = ctx && [...ctx.sched.values()].some(x => x.status === 'in_game');
    if (live) { D.wctx.delete(w); D.kick && D.kick.delete(w); D.gmeta && D.gmeta.delete(w); D.weekData.delete(w); weekContext(w); fetchWeek(w).then(() => refreshBanner()); if (D.bsw) D.bsw.ts = 0; }
    bannerSwingLoad();
    if (BN.hover) return;
    const av = bnAvail(); bnShow(av[(Math.max(0, av.indexOf(BN.cur)) + 1) % av.length]);
  }
  setInterval(bnTick, 60000);
  (() => { const cd = document.getElementById('cd'); if (!cd) return;
    cd.addEventListener('mouseenter', () => { BN.hover = true; }); cd.addEventListener('mouseleave', () => { BN.hover = false; });
    cd.addEventListener('click', e => {
      const go = e.target.closest('[data-bn-go]'); if (go) { bnShow(go.dataset.bnGo); return; }
      const m = e.target.closest('[data-bn-mid]'); if (m && D) { gotoMatch(D.defWeek, Number(m.dataset.bnMid), false); return; }
      if (e.target.closest('[data-bn-swing]') && D && D.bsw && D.bsw.data) gotoMatch(D.bsw.data.w, D.bsw.data.mid, true);
    }); })();

  // Countdown: April 29, 2027, 8:00 PM Eastern (EDT, UTC-4) = April 30, 2027 00:00 UTC
  const CD_TARGET = Date.UTC(2027, 3, 30, 0, 0, 0);
  function tickCountdown(){
    let ms = CD_TARGET - Date.now();
    if (ms <= 0) { $('#cdgrid').innerHTML = '<div class="cddone">It’s time!</div>'; return false; }
    const sec = Math.floor(ms / 1000);
    const set = (id, v, pad) => { const e = $(id); if (e) e.textContent = pad ? String(v).padStart(2, '0') : String(v); };
    set('#cdD', Math.floor(sec / 86400)); set('#cdH', Math.floor(sec % 86400 / 3600), true);
    set('#cdM', Math.floor(sec % 3600 / 60), true); set('#cdS', sec % 60, true);
    return true;
  }
  if (tickCountdown()) { const cdTimer = setInterval(() => { if (!tickCountdown()) clearInterval(cdTimer); }, 1000); }

  load();
  setTimeout(loadEspnIds, 1500);
})();
</script>
