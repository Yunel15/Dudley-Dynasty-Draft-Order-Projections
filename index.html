<style>
:root{
  --bg:#141B2B; --surface:#1E2638; --ink:#FFFFFF; --muted:#8C97AD; --line:#2C364B;
  --accent:#00CEB8; --accent-ink:#0B1F1D;
  --field:#00CEB8; --field-soft:#183A3F;
  --pylon:#FF6F7E; --pylon-soft:#3A2333; --pylon-ink:#FF9EA8;
  --heat:0,206,184;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:400 16px/1.5 "Barlow","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 56px}
button,select,input{font:inherit;color:inherit}
img{max-width:100%}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:4px solid var(--accent)}
h1{margin:0;font:700 clamp(2.3rem,8vw,3.8rem)/.92 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:-.01em}
.sub{margin:8px 0 0;color:var(--muted)}
.cd{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:0 0 16px;text-align:center}
.cdlabel{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.cdgrid{display:flex;justify-content:center;gap:clamp(14px,5vw,36px);margin-top:6px}
.cdgrid>div{display:flex;flex-direction:column;align-items:center;min-width:3rem}
.cdgrid b{font:700 2.2rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;color:var(--accent)}
.cdgrid span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.cddone{font:700 1.6rem/1 "Barlow Condensed",sans-serif;color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:progress}
:is(.btn,.tab,select,input,summary,.seg button):focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:18px 0 20px}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 12px;
  font:600 1.15rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted);cursor:pointer;text-align:center}
.tab:hover{color:var(--ink);border-color:var(--muted)}
.tabgroup{position:relative}
.tabgroup>.tab{width:100%;height:100%}
.tabmenu{display:none;position:absolute;z-index:30;top:100%;left:0;right:0;padding-top:6px}
.tabgroup:hover .tabmenu,.tabgroup:focus-within .tabmenu,.tabgroup.open .tabmenu{display:grid;gap:4px}
.tabopt{background:var(--surface);border:1px solid var(--muted);border-radius:6px;padding:9px 12px;font:600 1.05rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--ink);cursor:pointer;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.tabopt:hover,.tabopt[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:540px){.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
select,input[type="text"]{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:40px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 13px;cursor:pointer;color:var(--muted);font-weight:500;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
details.more{margin:10px 0 4px}
details.more summary{cursor:pointer;color:var(--muted);font-size:.9rem;width:max-content}
details.more .controls{margin-top:10px}
.note{color:var(--muted);font-size:.9rem;margin:10px 0 0;max-width:70ch}
.key{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--pylon);margin-right:6px;vertical-align:0}

/* Draft board */
.round h2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 8px;
  font:700 1.55rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
.round h2 small{font:500 .85rem "Barlow",sans-serif;color:var(--muted)}
ol.picks{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pick{display:grid;grid-template-columns:4.4rem minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.pick:first-child{border-top:0}
.pick.traded{box-shadow:inset 5px 0 0 var(--pylon)}
.pno{font:700 1.85rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.pick.future .pno{font-size:1.2rem;color:var(--muted)}
.team{display:flex;align-items:center;gap:10px;min-width:0}
.av{position:relative;width:34px;height:34px;flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  background:var(--field-soft);color:var(--field);font-weight:600;font-size:.78rem}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tx{min-width:0}
.tname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.owner{text-align:right;font-size:.85rem;color:var(--muted)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-weight:600;font-size:.82rem;background:var(--pylon-soft);color:var(--pylon-ink)}
@media (max-width:540px){
  .pick{grid-template-columns:3.4rem minmax(0,1fr);row-gap:4px}
  .owner{grid-column:2;text-align:left}
  .pno{font-size:1.55rem}
}

/* Projections */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;white-space:nowrap;border-top:1px solid var(--line)}
thead th{border-top:0;font-weight:600;color:var(--muted);font-size:.8rem}
th.tl,td.tl{text-align:left;position:sticky;left:0;background:var(--surface);padding-left:12px;z-index:1;max-width:180px}
td.tl .tname{max-width:150px}
td.heat{min-width:40px;font-size:.78rem;padding:8px 2px}
td.odds{font-weight:600;min-width:64px}
tr.cutline td{border-bottom:2px solid var(--accent)}
td.avgp{font:700 1.15rem "Barlow Condensed","Arial Narrow",sans-serif}

/* Ownership */
.owners{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:14px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.ocard header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font:700 1.4rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;flex:none}
.count small{font:500 .78rem "Barlow",sans-serif;color:var(--muted);margin-left:3px}
.yr{margin:12px 0 6px;font-weight:600;font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;flex-direction:column;padding:4px 9px;border:1px solid var(--line);border-radius:6px;font-size:.78rem;color:var(--muted);line-height:1.25}
.chip b{font:700 1.05rem "Barlow Condensed","Arial Narrow",sans-serif;color:var(--ink)}
.chip.acq{border-color:var(--pylon);background:var(--pylon-soft);color:var(--pylon-ink)}
.gave-h{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.chip.gone{border-style:dashed;background:none}
.chip.gone b{color:var(--muted)}

/* Records */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.rcard h3{margin:0 0 8px;font:600 1.1rem "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted)}
.rval{font:700 2.5rem/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--accent);font-variant-numeric:tabular-nums}
.rwho{font-weight:600;margin-top:6px;overflow-wrap:anywhere}
.rwhen{font-size:.85rem;color:var(--muted)}
.rlist{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.rlist li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.rlist li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;flex:none}
/* Matchups */
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);min-height:40px;padding:6px 14px;font-size:1.2rem;line-height:1}
.btn.ghost:disabled{opacity:.4;cursor:default}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 14px 10px;min-width:0}
.mteam{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mteam:first-child{border-top:0}
.mscore{font:700 1.7rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.mteam.win .mscore{color:var(--accent)}
.lineups summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding-top:6px}
.lwrap{overflow-x:auto;margin-top:8px}
.mteam[data-open-match]{cursor:pointer}
.lutoggle{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);margin-top:6px;padding:10px 0 4px;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;text-align:left}
.lutoggle:hover{color:var(--ink)}
.lutoggle:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.lucar{display:inline-block;transition:transform .3s}
.lutoggle.open .lucar{transform:rotate(90deg)}
.lutoggle.open{color:var(--ink)}
.mteam[data-open-match]:hover .tname{text-decoration:underline}
.mback{margin-bottom:10px}
.livewk{color:var(--pylon-ink)}
.livedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--pylon);margin-right:8px;animation:livep 1.4s infinite}
@keyframes livep{50%{opacity:.25}}
#toast{position:fixed;z-index:60;left:50%;bottom:18px;transform:translate(-50%,24px);opacity:0;pointer-events:none;width:min(440px,calc(100vw - 32px));text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);cursor:pointer;font:inherit;display:grid;gap:4px;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast b{color:var(--accent);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
#toast span{font-size:.9rem}
#toast em{font-style:normal;font-size:.72rem;color:var(--muted)}
.ccols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media (max-width:700px){.ccols{grid-template-columns:1fr}}
.ccol{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.ctitle{margin-bottom:8px}
.csearch{position:relative;margin:6px 0 10px}
.cadd{width:100%;padding:9px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit}
.cadd:focus{outline:2px solid var(--accent);outline-offset:1px}
.csug{position:absolute;z-index:20;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--muted);border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.4);max-height:340px;overflow:auto}
.csug[hidden]{display:none}
.csug button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;padding:6px 8px;background:none;border:0;border-radius:6px;color:inherit;font:inherit;font-size:.88rem;text-align:left;cursor:pointer}
.csug button:hover,.csug button:focus-visible{background:var(--line)}
.csnone{padding:8px}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.clist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;font-size:.88rem}
.cx{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:28px;height:28px;cursor:pointer}
.cx:hover{color:var(--pylon-ink);border-color:var(--pylon)}
.cverdict{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;text-align:center}
.cvt{font:700 2rem/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--accent)}
.cbar{height:12px;background:var(--pylon-soft);border-radius:999px;overflow:hidden;margin:12px auto;max-width:520px}
.cbar span{display:block;height:100%;background:var(--accent)}
.cnums{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 24px;font-size:.85rem;color:var(--muted)}
.cnums b{color:var(--ink)}
.cview{margin-top:8px;font-size:.85rem;color:var(--muted)}.cview b{color:var(--ink)}
.tfneeds{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.tfn{padding:5px 10px;border-radius:999px;font-size:.8rem;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.tfn b{color:var(--ink);margin-right:4px}
.tfn.need{border-color:var(--pylon);color:var(--pylon-ink)}
.tfn.surplus{border-color:var(--accent);color:var(--accent)}
.tflist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.tfcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tfhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tflab{font-size:.75rem;font-weight:700;padding:4px 8px;border-radius:6px;background:var(--line);white-space:nowrap}
.tflab.win{background:var(--accent);color:var(--accent-ink)}.tflab.lose{background:var(--pylon-soft);color:var(--pylon-ink)}
.tfcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfcap{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.tfcols ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.tfcols li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;font-size:.88rem}
.tfn2{display:flex;flex-direction:column;min-width:0}
.hs.pick{background:var(--pylon-soft);color:var(--pylon-ink)}
.tfv{color:var(--accent);font-variant-numeric:tabular-nums}
.tfsum{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.tfsum b{color:var(--ink)}
.hs{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:34px;height:34px;border-radius:50%;background:var(--line);color:var(--muted);font:700 .65rem/1 inherit;overflow:hidden}
.hs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;background:var(--line)}
.plbtn{display:inline-flex;align-items:center;gap:8px;max-width:100%}
.plbtn.plr{flex-direction:row-reverse;text-align:right}
.plt{display:block;min-width:0}
.bkwho{display:inline-flex;align-items:center;gap:8px}
.mlist.single .hs{width:42px;height:42px}
.lawbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin:10px 0 18px}
.lawdl{text-decoration:none;display:inline-block}
.lawmeta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:.8rem}
.lawmeta b{color:var(--ink)}
.lawh{margin:18px 0 8px;font-size:1rem;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.lawsum{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.9rem}
.law{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:0 14px}
.law summary{cursor:pointer;padding:12px 0;font-weight:700}
.lawn{color:var(--accent);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;margin-right:8px}
.law ol{margin:0 0 12px;padding-left:20px;display:grid;gap:8px;font-size:.9rem}
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0 16px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.scard .slabel{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.scard b{font:700 1.3rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
.scard.good b{color:var(--accent)}.scard.bad b{color:var(--pylon-ink)}
.stbl{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.stbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:center;padding:6px 6px;border-bottom:1px solid var(--line);font-weight:600}
.stbl td{padding:7px 6px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.stbl .tl{text-align:left}
.stk{font-weight:700}.stk.w{color:var(--accent)}.stk.l{color:var(--pylon-ink)}.stk.t{color:var(--muted)}
.l5{white-space:nowrap}
.stnotes{margin-top:10px}.stnotes summary{cursor:pointer;color:var(--muted);font-size:.8rem;width:max-content}.stnotes summary:hover{color:var(--accent)}
.tlink{all:unset;cursor:pointer;display:block;border-radius:8px}.tlink:hover .tname,.tlink:focus-visible .tname{color:var(--accent);text-decoration:underline}.tlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sos{display:inline-block;min-width:34px;padding:2px 7px;border-radius:999px;font-weight:700;font-size:.75rem;cursor:help}.sos.hard{background:var(--pylon-soft);color:var(--pylon-ink)}.sos.mid{background:var(--line);color:var(--ink)}.sos.easy{background:var(--accent);color:var(--accent-ink)}.sosd{display:block;font-size:.65rem;color:var(--muted);margin-top:2px}
.dot{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;font:700 .65rem/20px inherit;font-style:normal;margin:0 1px;text-align:center}
.dot.w{background:var(--accent);color:var(--accent-ink)}.dot.l{background:var(--pylon-soft);color:var(--pylon-ink)}.dot.t{background:var(--line);color:var(--ink)}
.msingle{max-width:860px;margin:0 auto}
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:12px 0 8px}
.mside{display:flex;flex-direction:column;gap:4px;min-width:0}
.mside.l{align-items:flex-start;text-align:left}
.mside.r{align-items:flex-end;text-align:right}
.mside .av,.mside .avatar{width:56px;height:56px}
.mname{font-weight:700;font-size:1.15rem;line-height:1.15;overflow-wrap:anywhere}
.mside .mscore{font-size:3.4rem;margin-top:4px}
.mside.win .mscore{color:var(--accent)}
.mvs{color:var(--muted);font-weight:600;padding-top:20px}
.mlist.single{display:block;margin-top:0}
.mlist.single .mcard{padding:12px 24px 18px}
.mlist.single .mscore{font-size:3.2rem}
.mlist.single .mteam{padding:14px 0}
.mlist.single .tname{font-size:1.15rem}
.mlist.single .ltable{table-layout:fixed;font-size:1rem}
.mlist.single .ltable td{padding:9px 6px}
.mlist.single .ltable .pl{width:34%}
.mlist.single .ltable .pp{width:11%;font-size:1.05rem}
.mlist.single .ltable .slot{width:10%;font-size:.85rem}
.mlist.single .ltable .pl small{font-size:.8rem}
.mlist.single .ltable td.pl{text-align:left}
.mlist.single .ltable td.pl:last-child{text-align:right}
.mlist.single .ltable td.pp:nth-child(2){text-align:right}
.mlist.single .ltable td.pp:nth-child(4){text-align:left}
.mlist.single .ltable th.lh{font-size:1rem;padding:10px 6px}
.mlist.single .ltable th.lh small{font-size:1.1rem}
.mlist.single .plbtn{text-align:inherit}
.mlist.single .ltable tr.bk td{text-align:left}
.ltable th.lh{text-align:left;padding:6px 4px;font-size:.8rem;font-weight:700;color:var(--ink);line-height:1.2}
.ltable th.lh.r{text-align:right}
.ltable th.lh small{display:block;color:var(--accent);font-size:.9rem}
.ltable th.lh.slot{text-align:center;color:var(--muted);font-weight:600;width:2.6rem}
.ltable{width:100%;border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums}
.ltable td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:middle}
.ltable .pl{width:40%;line-height:1.2}
.ltable .pl small{display:block;color:var(--muted);font-size:.72rem}
.ltable td.pl:last-child{text-align:right}
.ltable .pp{font-weight:600;white-space:nowrap}
.ltable .slot{text-align:center;color:var(--accent);font-weight:600;font-size:.72rem;width:2.6rem}
.ltable .empty{color:var(--muted)}
.plbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:inherit;line-height:inherit;cursor:pointer}
.plbtn:hover{text-decoration:underline dotted}
.plbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ltable tr.bk td{padding:4px 4px 10px;text-align:left;white-space:normal}
.bkblock{margin:6px 0 0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.bkhead{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
.bkhead span{color:var(--accent);font-weight:700}
.ltable .bkt{width:100%;margin-top:6px;font-size:.78rem}
.ltable .bkt td{padding:3px 2px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.ltable .bkt td:first-child{text-align:left;white-space:normal}

.bknote{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.bkvid{display:block;margin-top:6px;font-size:.8rem;color:var(--accent);font-weight:600}
.bkclipt{margin-top:8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* Bracket */
.bracket{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:16px;overflow-x:auto;margin-top:14px;padding-bottom:8px}
.bcol{display:flex;flex-direction:column;min-width:0}
.bcol h3{margin:0 0 10px;font:600 1.2rem "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted)}
.bgames{display:flex;flex-direction:column;justify-content:space-around;gap:14px;flex:1}
.bmatch{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.bmatch.final{border-color:var(--accent)}
.blabel{font-size:.75rem;color:var(--muted);padding:6px 10px 2px}
.bteam{display:grid;grid-template-columns:1.4rem minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-top:1px solid var(--line);font-size:.9rem}
.blabel + .bteam{border-top:0}
.bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seed{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.bscore{font-weight:600;font-variant-numeric:tabular-nums}
.bteam.win .bname{font-weight:700}
.bteam.win .bscore{color:var(--accent)}
.bteam.lose{color:var(--muted)}
.bteam.tbd .bname{color:var(--muted);font-style:italic;font-size:.85rem}
.seedlist{margin:14px 0 0;padding-left:1.4rem}
.seedlist li{padding:4px 0}

/* Payouts */
.pot{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:16px 18px}
.potnum{font:700 clamp(3rem,12vw,4.4rem)/.9 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--accent);font-variant-numeric:tabular-nums}
.pottxt{display:flex;flex-direction:column;gap:2px;max-width:52ch}
.pottxt b{font-size:1.05rem}
.pottxt span{color:var(--muted);font-size:.9rem}
.paygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:12px}
.paycard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.paycard.decided{border-color:var(--accent)}
.payhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.payamt{font:700 2.2rem/1 "Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.paypct{font-size:.8rem;color:var(--muted)}
.paycard h3{margin:4px 0 12px;font-size:.95rem;font-weight:600;color:var(--muted)}
.paywho{padding-top:10px;border-top:1px solid var(--line)}
.payodds{font-size:.82rem;color:var(--muted);margin-top:8px}
.sech{margin:30px 0 0;font:700 1.55rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
td.pos{color:var(--accent);font-weight:600}
td.neg{color:var(--pylon-ink);font-weight:600}
td.tags{white-space:normal;min-width:160px;text-align:left;color:var(--muted);font-size:.8rem}

/* News feed */
.feed{max-width:620px;margin:10px auto 0}
.feedwk{margin:22px 0 8px;font:700 1.3rem/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted)}
.post{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.pav{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:700 1rem "Barlow Condensed","Arial Narrow",sans-serif}
.pav.alt{background:var(--pylon);color:#fff}
.pav.c2{background:#F5C242;color:#2B2100}
.pav.c3{background:#8B7CF6;color:#fff}
.seg.wrap{flex-wrap:wrap}
.pbody{min-width:0;flex:1}
.phead{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:.92rem}
.ptag{display:inline-block;padding:1px 7px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:.7rem;font-weight:600}
.phandle{color:var(--muted)}
.ptext{margin:4px 0 10px;line-height:1.45;overflow-wrap:anywhere}
.ptext b{color:var(--ink)}
.pacts{display:flex;gap:26px;font-size:.82rem;color:var(--muted)}

/* Team construction */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px;margin-top:14px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.bcard header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btable{margin-top:12px}
.btable th:first-child,.btable td:first-child{text-align:left;padding-left:2px}
.btable tr.all td{font-weight:600;border-top:2px solid var(--line)}
.btable tr.prow td{border-top:2px solid var(--line);overflow:visible;white-space:normal}
.pickbtn{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;cursor:pointer;padding:4px 8px;border:1px solid var(--line);border-radius:6px;text-align:left}
.pickbtn b{color:var(--accent)}.pickbtn .pp-go{color:var(--muted);font-size:.78rem}
.pickbtn:hover,.pickbtn:focus-visible{border-color:var(--accent)}.pickbtn:hover .pp-go,.pickbtn:focus-visible .pp-go{color:var(--accent)}
.pickpop{display:none;position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);min-width:240px;max-height:320px;overflow:auto;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:6px 10px 10px;box-shadow:0 10px 28px rgba(0,0,0,.45);white-space:normal;cursor:default}
.pickbtn:hover .pickpop,.pickbtn:focus-visible .pickpop{display:block}
.posbtn{display:inline-flex;width:auto;min-width:34px;justify-content:center;padding:2px 10px}.posbtn[aria-pressed="true"]{background:var(--accent)}.posbtn[aria-pressed="true"] b{color:var(--accent-ink)}
.posbtn .pickpop{min-width:220px;right:auto}.pp-pl{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-top:1px solid var(--line);font-size:.8rem}.pp-pl b{color:var(--ink);font-weight:600}
.pp-yr{display:block;margin:8px 0 5px;font-weight:600;font-size:.8rem;color:var(--muted)}.pp-chips{display:flex;flex-wrap:wrap;gap:5px}
.ocard.flash{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);transition:box-shadow .4s,border-color .4s}
@media (hover:none){.pickbtn:hover .pickpop{display:none}}
.chip.stack{border-color:var(--accent)}
.chip.stack b{color:var(--accent)}
.chipbtn{background:none;font:inherit;font-size:.78rem;text-align:left;cursor:pointer;color:var(--muted)}
.chipbtn:hover{border-color:var(--muted)}
.chipbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chipbtn[aria-pressed="true"] b{color:var(--accent-ink)}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.tenure{line-height:1.35}
.bsplit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:12px;margin-top:14px;align-items:start}
.rtitle{margin:0 0 2px;font:700 1.5rem/1 "Barlow Condensed","Arial Narrow",sans-serif}
.rhead{margin:16px 0 4px;font:600 1.1rem "Barlow Condensed","Arial Narrow",sans-serif;color:var(--muted)}
.rhead small{margin-left:6px;font:500 .8rem "Barlow",sans-serif}
.rlist2{list-style:none;margin:0;padding:0}
.rrow{display:grid;grid-template-columns:3rem 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname.empty{color:var(--muted);font-weight:400}
.rsub{font-size:.8rem;color:var(--muted)}
.rten{font-size:.78rem;color:var(--muted);white-space:nowrap}
.pbadge{display:grid;place-items:center;padding:3px 0;border-radius:6px;font:700 .9rem/1.1 "Barlow Condensed","Arial Narrow",sans-serif;background:var(--line);color:var(--ink)}
.pb-QB{background:#FF2A6D;color:#fff}
.pb-RB{background:#00CEB8;color:#06211E}
.pb-WR{background:#FFAE58;color:#2B1A00}
.pb-TE{background:#58A7FF;color:#04182E}
.pb-K{background:#BD66FF;color:#fff}
.pb-DEF{background:#7988A1;color:#fff}
.tenure b{font-size:.95rem}

/* Manager profiles */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.prec{display:flex;align-items:flex-end;gap:12px;margin:14px 0 10px}
.pbig{font:700 2.8rem/.9 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--accent);font-variant-numeric:tabular-nums}
.psub{font-size:.8rem;color:var(--muted);line-height:1.3}
.pstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pstats div{display:flex;justify-content:space-between;gap:8px;font-size:.85rem}
.pstats dt{color:var(--muted)}
.pstats dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.tch{margin:12px 0 8px;font:600 1.1rem "Barlow Condensed","Arial Narrow",sans-serif}
.trophies{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.trophies li{display:flex;gap:10px;align-items:flex-start}
.ticon{font-size:1.35rem;line-height:1.1;flex:none}
.trophies b{display:block;font-size:.9rem}
.trophies small{display:block;color:var(--muted);font-size:.8rem}
.tempty{margin:0;color:var(--muted);font-size:.85rem}
/* Trades */
.tlist{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.trade{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.trade time{font-size:.85rem;color:var(--muted)}
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:10px}
.side ul{list-style:none;margin:10px 0 0;padding:0}
.side li{display:flex;flex-direction:column;padding:6px 0;border-top:1px solid var(--line);line-height:1.3}
.side li:first-child{border-top:0}
.asset-main{font-weight:600}
.asset-pick .asset-main{color:var(--accent)}
.asset-sub{font-size:.8rem;color:var(--muted)}
.status{padding:40px 0;color:var(--muted)}
.error{background:var(--pylon-soft);color:var(--pylon-ink);border-radius:8px;padding:14px 16px;margin-top:18px}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
footer form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
footer input{width:min(100%,260px)}

/* Mobile layout */
@media (max-width:600px){
  .wrap{padding-left:12px;padding-right:12px}
  .mcard{padding:6px 10px 10px}
  .mlist.single .mcard{padding:10px 10px 14px}
  .mhead{gap:6px;padding:8px 0 6px}
  .mside .av,.mside .avatar{width:44px;height:44px}
  .mname{font-size:1rem}
  .mside .mscore,.mlist.single .mscore{font-size:2.5rem}
  .mvs{padding-top:14px;font-size:.8rem}
  .ltable,.mlist.single .ltable{table-layout:fixed;width:100%;font-size:.78rem}
  .ltable td,.mlist.single .ltable td{padding:8px 2px}
  .ltable .pl,.mlist.single .ltable .pl{width:31%;overflow:hidden}
  .ltable .pp,.mlist.single .ltable .pp{width:12%;font-size:.85rem}
  .ltable .slot,.mlist.single .ltable .slot{width:14%;font-size:.7rem}
  .ltable td.pl,.mlist.single .ltable td.pl,.ltable td.pl:last-child,.mlist.single .ltable td.pl:last-child{text-align:center}
  .ltable .pp:nth-child(2),.mlist.single .ltable td.pp:nth-child(2){text-align:right;padding-right:4px}
  .ltable .pp:nth-child(4),.mlist.single .ltable td.pp:nth-child(4){text-align:left;padding-left:4px}
  .plbtn,.plbtn.plr,.mlist.single .plbtn{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;text-align:center}
  .plt{display:block;width:100%;min-width:0;white-space:normal;overflow-wrap:break-word;line-height:1.15;font-size:.78rem}
  .plbtn{white-space:normal;min-width:0}
  .ltable .pl small{font-size:.66rem}
  .hs,.mlist.single .hs{width:36px;height:36px}
  .ltable th.lh,.mlist.single .ltable th.lh{font-size:.8rem;padding:8px 2px}
  .ltable tr.bk td{padding:4px 0 10px}
  .bkt{font-size:.72rem}
  .ltable .bkt td{padding:3px 1px}
  .controls{gap:10px}
  .tflist,.rgrid{grid-template-columns:1fr}
  .tfcols{gap:8px}
  .tfcols li{grid-template-columns:auto minmax(0,1fr) auto;font-size:.8rem}
  .tfcols .hs{width:30px;height:30px}
  .cdgrid b{font-size:1.8rem}
  .stbl{font-size:.78rem}
  .stbl th,.stbl td{padding:6px 3px}
  .scards{grid-template-columns:1fr}
  .scard{min-width:0}
  .lawbar{gap:10px}
  .lawdl{width:100%;text-align:center}
}
.brand{display:flex;align-items:center;gap:14px;min-width:0}.logo{width:76px;height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
@media (max-width:520px){.logo{width:58px}.brand{gap:10px}}
</style>

  function standingsData(){
    const res = new Map(D.ids.map(r => [r, { g: [], pa: 0, hi: 0, lo: Infinity, opps: [] }]));
    const weeks = [...D.completedWeeks].sort((a, b) => a.week - b.week);
    weeks.forEach(({ list }) => {
      const groups = new Map();
      list.forEach(m => { if (m.matchup_id == null || !res.has(m.roster_id)) return; if (!groups.has(m.matchup_id)) groups.set(m.matchup_id, []); groups.get(m.matchup_id).push(m); });
      const scores = list.filter(m => res.has(m.roster_id) && (m.points || 0) > 0).map(m => m.points).sort((x, y) => x - y);
      const med = scores.length ? (scores[Math.floor((scores.length - 1) / 2)] + scores[Math.floor(scores.length / 2)]) / 2 : 0;
      groups.forEach(g => {
        if (g.length !== 2 || !(g[0].points > 0 || g[1].points > 0)) return;
        g.forEach((m, i) => {
          const o = g[1 - i], r = res.get(m.roster_id);
          r.g.push(m.points > o.points ? 'W' : m.points < o.points ? 'L' : 'T');
          r.pa += o.points || 0;
          r.opps.push(o.roster_id);
          r.hi = Math.max(r.hi, m.points || 0); r.lo = Math.min(r.lo, m.points || 0);
          if (D.median && med) r.g.push(m.points > med ? 'W' : m.points < med ? 'L' : 'T');
        });
      });
    });
    res.forEach(r => {
      let cur = { t: '', n: 0 }, bw = 0, bl = 0, run = 0, rt = '';
      r.g.forEach(x => {
        if (x === rt) run++; else { rt = x; run = 1; }
        if (x === 'W') bw = Math.max(bw, run);
        if (x === 'L') bl = Math.max(bl, run);
        cur = { t: x, n: run };
      });
      r.cur = cur; r.bestW = bw; r.bestL = bl;
    });
    return res;
  }
  // Strength of schedule: average season PPG of the opponents a team has faced (played) or still faces (remaining).
  function sosData(info){
    const ppg = new Map(D.ids.map(r => { const h = D.hist.get(r) || []; return [r, h.length ? avg(h) : null]; }));
    const known = [...ppg.values()].filter(v => v != null);
    const lg = known.length ? avg(known) : 0;
    const rem = new Map(D.ids.map(r => [r, []]));
    (D.remaining || []).forEach(w => (w.pairs || []).forEach(([a, b]) => { if (rem.has(a)) rem.get(a).push(b); if (rem.has(b)) rem.get(b).push(a); }));
    const score = list => { const v = list.map(o => ppg.get(o)).filter(x => x != null); return v.length ? avg(v) : null; };
    const build = getOpps => {
      const m = new Map(D.ids.map(r => { const opps = getOpps(r); return [r, { v: score(opps), n: opps.length }]; }));
      const ranked = D.ids.filter(r => m.get(r).v != null).sort((a, b) => m.get(b).v - m.get(a).v || a - b);
      ranked.forEach((r, i) => { m.get(r).rank = i + 1; });
      m.size_ = ranked.length;
      return m;
    };
    const played = build(r => info.get(r).opps), remaining = build(r => rem.get(r));
    return { lg, played, remaining, hasRem: remaining.size_ > 0 };
  }
  function sosCell(m, r, lg, label){
    const x = m.get(r);
    if (!x || x.v == null) return '–';
    const n = m.size_, third = Math.max(1, Math.round(n / 3));
    const cls = x.rank <= third ? 'hard' : x.rank > n - third ? 'easy' : 'mid';
    const d = x.v - lg;
    const tip = `${label}: ${ordinal(x.rank)} hardest of ${n}. Opponents average ${x.v.toFixed(1)} PPG (${d >= 0 ? '+' : ''}${d.toFixed(1)} vs league) over ${x.n} game${x.n === 1 ? '' : 's'}.`;
    return `<span class="sos ${cls}" title="${esc(tip)}">${ordinal(x.rank)}</span><small class="sosd">${d >= 0 ? '+' : ''}${d.toFixed(1)}</small>`;
  }
  function renderStandings(){
    const info = standingsData();
    const gp = t => t.wins + t.losses + t.ties;
    const pct = t => gp(t) ? (t.wins + 0.5 * t.ties) / gp(t) : 0;
    const order = D.ids.slice().sort((a, b) => (pct(team(b)) - pct(team(a))) || (team(b).pf - team(a).pf) || (a - b));
    const played = Math.max(0, ...D.ids.map(r => gp(team(r))));
    const any = played > 0;
    const sN = (r, t) => { const c = info.get(r).cur; return c.n && c.t === t ? c.n : 0; };
    const top = (arr, f) => arr.map(r => ({ r, v: f(r) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v || a.r - b.r)[0];
    const hot = top(D.ids, r => sN(r, 'W')), cold = top(D.ids, r => sN(r, 'L'));
    const bestW = top(D.ids, r => info.get(r).bestW), bestL = top(D.ids, r => info.get(r).bestL);
    const card = (label, x, unit, cls) => `<div class="scard ${cls}"><span class="slabel">${label}</span>${x ? `${teamBlock(team(x.r), '')}<b>${x.v} ${unit}</b>` : '<span class="asset-sub">None yet</span>'}</div>`;
    let html = `<h2 class="sech">League Standings</h2>`;
    const sos = sosData(info);
    if (!any) return html + '<p class="note">Standings appear once the season starts.</p>';
    html += `<div class="scards">${card('Longest active win streak', hot, 'wins', 'good')}${card('Longest active losing streak', cold, 'losses', 'bad')}${card('Best win streak this season', bestW, 'wins', 'good')}${card('Worst losing streak this season', bestL, 'losses', 'bad')}</div>`;
    html += `<div class="lwrap"><table class="stbl"><thead><tr><th>#</th><th class="tl">Team</th><th>Record</th><th>PF</th><th>PA</th><th>Streak</th><th>Last 5</th><th title="Strength of schedule so far: 1st = hardest">SOS</th>${sos.hasRem ? '<th title="Remaining regular-season strength of schedule: 1st = hardest">Rem. SOS</th>' : ''}</tr></thead><tbody>`;
    order.forEach((r, i) => {
      const t = team(r), x = info.get(r), c = x.cur;
      const streak = c.n ? `<span class="stk ${c.t === 'W' ? 'w' : c.t === 'L' ? 'l' : 't'}">${c.t}${c.n}</span>` : '–';
      const last5 = x.g.slice(-5).map(g => `<i class="dot ${g.toLowerCase()}" title="${g}">${g}</i>`).join('');
      html += `<tr><td>${i + 1}</td><td class="tl"><button type="button" class="tlink" data-build-team="${r}" title="View ${esc(t.name)} in Team Construction">${teamBlock(t, '')}</button></td><td>${record(t)}</td><td>${t.pf.toFixed(2)}</td><td>${x.pa ? x.pa.toFixed(2) : '–'}</td><td>${streak}</td><td class="l5">${last5}</td><td>${sosCell(sos.played, r, sos.lg, 'Played')}</td>${sos.hasRem ? `<td>${sosCell(sos.remaining, r, sos.lg, 'Remaining')}</td>` : ''}</tr>`;
    });
    html += '</tbody></table></div><details class="stnotes"><summary>How these are calculated</summary><p class="note">Ranked by record, then points for. Streaks count regular-season games' + (D.median ? ', including the weekly median game' : '') + '.</p><p class="note"><b>SOS</b> ranks each schedule by the average points per game of the opponents faced, 1st being the hardest. <span class="sos hard">Red</span> is the toughest third, <span class="sos easy">teal</span> the easiest.' + (sos.hasRem ? ' <b>Rem. SOS</b> does the same for the rest of the regular season.' : '') + ' The small number under each rating is how many points per game those opponents score above or below the league average.</p</details>';
    return html;
  }

  // ---------- Trade Finder (FantasyCalc dynasty values) ----------
  function fcSettings(){
    const rp = D.league.roster_positions || [], sc = D.league.scoring_settings || {};
    const sf = rp.includes('SUPER_FLEX');
    const rec = typeof sc.rec === 'number' ? sc.rec : 1;
    return { numQbs: sf ? 2 : 1, numTeams: D.ids.length, ppr: [0, 0.5, 1].reduce((a, b) => Math.abs(b - rec) < Math.abs(a - rec) ? b : a), sf };
  }
  async function loadFinder(){
    if (!D || D.tf || D.tfLoading) return;
    const myD = D; myD.tfLoading = true;
    const f = fcSettings();
    const qs = `isDynasty=true&numQbs=${f.numQbs}&numTeams=${f.numTeams}&ppr=${f.ppr}`;
    const urls = [VALUES_PROXY ? `${VALUES_PROXY}/values?${qs}` : null, `${VALUES_API}/values/current?${qs}`].filter(Boolean);
    let raw = null;
    for (const u of urls) { try { const r = await fetch(u); if (r.ok) { raw = await r.json(); if (Array.isArray(raw) && raw.length) break; } } catch (e) {} }
    if (!Array.isArray(raw) || !raw.length) { myD.tf = { error: 'Couldn’t load player values from FantasyCalc. Try Refresh in a minute.' }; }
    else {
      const players = new Map(), picks = new Map(), pickAgg = new Map();
      raw.forEach(x => {
        const pl = x.player || {}, v = Number(x.value) || 0;
        const pm = /^(\d{4}) (\d+)(?:st|nd|rd|th)(?: \((?:Early|Mid|Late)\))?$/i.exec(pl.name || '');
        if (pm) { const k = `${pm[1]}-${pm[2]}`; const a = pickAgg.get(k) || [0, 0]; a[0] += v; a[1]++; pickAgg.set(k, a); return; }
        if (pl.sleeperId != null && v > 0) players.set(String(pl.sleeperId), { id: String(pl.sleeperId), name: pl.name, pos: pl.position, tm: pl.maybeTeam || 'FA', age: pl.maybeAge, v, rank: x.overallRank, trend: x.trend30Day });
      });
      pickAgg.forEach((a, k) => picks.set(k, a[0] / a[1]));
      myD.tf = { players, picks, f };
    }
    myD.tfLoading = false;
    if (D === myD && (opts.tab === 'finder' || opts.tab === 'calc')) render();
  }

  function finderModel(){
    const { players, picks } = D.tf;
    const rp = D.league.roster_positions || [], cnt = k => rp.filter(x => x === k).length;
    const need = { QB: cnt('QB') + cnt('SUPER_FLEX'), RB: Math.ceil(cnt('RB') + 0.4 * cnt('FLEX')), WR: Math.ceil(cnt('WR') + 0.4 * cnt('FLEX')), TE: Math.ceil(cnt('TE') + 0.2 * cnt('FLEX')) };
    const POS = ['QB', 'RB', 'WR', 'TE'];
    const teams = new Map();
    (D.rosters || []).forEach(r => {
      if (r.roster_id == null) return;
      const assets = [];
      (r.players || []).forEach(id => { const p = players.get(String(id)); if (p) assets.push({ kind: 'p', key: 'p' + p.id, label: p.name, sub: `${p.pos}, ${p.tm}${p.age ? ', ' + Number(p.age).toFixed(0) : ''}`, pos: p.pos, v: p.v, id: p.id, p }); });
      D.seasons.forEach(se => { for (let rd = 1; rd <= (opts.rounds || 4); rd++) {
        const v = picks.get(`${se}-${rd}`); if (!v) continue;
        D.ids.forEach(orig => { if (ownerOf(se, rd, orig) !== r.roster_id) return;
          const own = orig === r.roster_id;
          assets.push({ kind: 'k', key: `k${se}-${rd}-${orig}`, label: `${se} Round ${rd} pick`, sub: own ? 'Own pick' : `From ${team(orig).name}`, pos: null, v }); });
      } });
      const strength = {}, depth = {};
      POS.forEach(pos => { const vs = assets.filter(a => a.pos === pos).map(a => a.v).sort((a, b) => b - a); strength[pos] = vs.slice(0, need[pos]).reduce((t, x) => t + x, 0); depth[pos] = vs.slice(need[pos]).reduce((t, x) => t + x, 0); });
      const total = assets.reduce((t, a) => t + a.v, 0);
      teams.set(r.roster_id, { rid: r.roster_id, assets: assets.sort((a, b) => b.v - a.v), strength, depth, total });
    });
    const mean = {}; POS.forEach(pos => { mean[pos] = [...teams.values()].reduce((t, x) => t + x.strength[pos], 0) / (teams.size || 1) || 1; });
    teams.forEach(t => { t.need = {}; POS.forEach(pos => { t.need[pos] = Math.max(-0.5, Math.min(0.5, (mean[pos] - t.strength[pos]) / mean[pos])); }); });
    return { teams, POS, need };
  }

  function stratAdj(a, st){
    if (a.kind === 'k') return a.v * (st === 'contend' ? 0.8 : st === 'rebuild' ? 1.2 : 1);
    const age = Number(a.p && a.p.age) || 26;
    const m = st === 'contend' ? (age >= 27 ? 1.1 : age <= 23 ? 0.9 : 1) : st === 'rebuild' ? (age <= 24 ? 1.15 : age >= 30 ? 0.65 : age >= 28 ? 0.8 : 1) : 1;
    return a.v * m;
  }
  const PKG_W = [1, 0.7, 0.55, 0.45];
  const pkgVal = (arr, f) => arr.map(a => f ? f(a) : a.v).sort((x, y) => y - x).reduce((t, v, i) => t + v * (PKG_W[i] ?? 0.35), 0);

  function findTrades(model, me, tol){
    const mine = model.teams.get(me); if (!mine) return [];
    const W = [1, 0.7];
    const pack = arr => pkgVal(arr);
    const fit = (t, get, give) => { const tot = get.concat(give).reduce((x, a) => x + a.v, 0) || 1; const f = a => a.pos ? t.need[a.pos] * a.v : 0; return (get.reduce((x, a) => x + f(a), 0) - give.reduce((x, a) => x + f(a), 0)) / tot; };
    const top = t => t.assets.filter(a => a.v >= 700 && !(noPicks && a.kind === 'k')).slice(0, 14);
    const combos = list => { const o = list.map(a => [a]); for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) o.push([list[i], list[j]]); return o; };
    const st = opts.tfStrat || 'balanced', tgt = opts.tfPos || '', noPicks = opts.tfPicks === 'no';
    const adj = a => stratAdj(a, st);
    const sv = arr => arr.reduce((t, a) => t + adj(a), 0);
    const myTop = top(mine), out = [];
    const mySingles = myTop.map(a => [a]), myPairs = combos(myTop).filter(c => c.length === 2);
    model.teams.forEach((them, rid) => {
      if (rid === me) return;
      const th = top(them), thSingles = th.map(a => [a]), thPairs = combos(th).filter(c => c.length === 2);
      const sets = [[mySingles, thSingles], [myPairs, thSingles], [mySingles, thPairs]];
      const found = [];
      sets.forEach(([giveSet, getSet]) => giveSet.forEach(give => getSet.forEach(get => {
        const a = pack(give), b = pack(get), gap = (b - a) / Math.max(a, b);
        if (Math.abs(gap) > tol) return;
        if (tgt && !get.some(x => x.pos === tgt)) return;
        const fm = fit(mine, get, give), ft = fit(them, give, get);
        if (ft <= 0.01) return;
        const sg = (sv(get) - sv(give)) / Math.max(sv(get), sv(give), 1);
        if (st !== 'balanced' && sg < 0.01) return;
        if (!tgt && fm <= 0.01) return;
        found.push({ rid, give, get, a, b, gap, fm, ft, sg, score: fm + ft + sg * 1.2 - Math.abs(gap) * 1.5 });
      })));
      found.sort((x, y) => y.score - x.score);
      const used = new Set();
      found.filter(f => { const ks = f.give.concat(f.get).map(x => x.key); if (ks.some(k => used.has(k))) return false; ks.forEach(k => used.add(k)); return true; }).slice(0, 2).forEach(f => out.push(f));
    });
    return out.sort((x, y) => y.score - x.score).slice(0, 12);
  }

  function renderFinder(){
    if (!D.tf) { loadFinder(); return '<h2 class="sech">Trade Finder</h2><p class="status">Loading dynasty values from FantasyCalc…</p>'; }
    if (D.tf.error) return `<h2 class="sech">Trade Finder</h2><div class="error"><strong>${esc(D.tf.error)}</strong></div>`;
    const model = finderModel();
    const ids = [...model.teams.keys()];
    if (!ids.length) return '<h2 class="sech">Trade Finder</h2><p class="note">Rosters are empty so far.</p>';
    const me = ids.includes(opts.tfTeam) ? opts.tfTeam : ids[0];
    const tolPct = opts.tfTol || 10, tol = tolPct / 100;
    const f = D.tf.f;
    const teamOpts = ids.map(r => `<option value="${r}" ${r === me ? 'selected' : ''}>${esc(team(r).name)}</option>`).join('');
    const tolOpts = [[5, 'Very even (5%)'], [10, 'Close (10%)'], [20, 'Loose (20%)']].map(([v, l]) => `<option value="${v}" ${v === tolPct ? 'selected' : ''}>${l}</option>`).join('');
    let html = `<h2 class="sech">Trade Finder</h2>
      <div class="controls"><label class="field">Your team<select data-opt="tfTeam">${teamOpts}</select></label><label class="field">Fairness<select data-opt="tfTol">${tolOpts}</select></label>
        <label class="field">Strategy<select data-opt="tfStrat">${[['balanced', 'Balanced'], ['contend', 'Contend now'], ['rebuild', 'Rebuild']].map(([v, l]) => `<option value="${v}" ${(opts.tfStrat || 'balanced') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="field">Target position<select data-opt="tfPos">${[['', 'Any'], ...model.POS.map(x => [x, x])].map(([v, l]) => `<option value="${v}" ${(opts.tfPos || '') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="field">Picks<select data-opt="tfPicks"><option value="yes" ${opts.tfPicks !== 'no' ? 'selected' : ''}>Include</option><option value="no" ${opts.tfPicks === 'no' ? 'selected' : ''}>Players only</option></select></label></div>
      <p class="note">Values from <a href="https://www.fantasycalc.com" target="_blank" rel="noopener noreferrer">FantasyCalc</a>, tuned to this league: ${f.sf ? 'superflex' : '1 QB'}, ${f.numTeams} teams, ${f.ppr === 1 ? 'full' : f.ppr === 0.5 ? 'half' : 'no'} PPR, dynasty. Suggestions pair teams that each fill a position of need and stay within the fairness range. ${({ contend: 'Contend now favors proven veterans and values picks less.', rebuild: 'Rebuild favors young players and picks and values older players less.', balanced: '' })[opts.tfStrat || 'balanced']} They are estimates, not verdicts.</p>`;
    const mt = model.teams.get(me);
    html += `<div class="tfneeds">${model.POS.map(pos => { const n = mt.need[pos]; const lab = n > 0.12 ? 'Need' : n < -0.12 ? 'Surplus' : 'Balanced'; return `<span class="tfn ${lab.toLowerCase()}"><b>${pos}</b> ${lab}</span>`; }).join('')}</div>`;
    const trades = findTrades(model, me, tol);
    if (!trades.length) return html + '<p class="note">No trades fit those settings. Try a looser fairness range.</p>';
    const side = (arr, total) => `<ul>${arr.map(a => `<li>${a.kind === 'p' ? shot(a.id, a.pos, a.p.tm, a.label) : '<span class="hs pick" aria-hidden="true">PK</span>'}<span class="tfn2"><span class="asset-main">${esc(a.label)}</span><span class="asset-sub">${esc(a.sub)}</span></span><b class="tfv">${Math.round(a.v).toLocaleString()}</b></li>`).join('')}</ul><div class="tfsum">Package value <b>${Math.round(total).toLocaleString()}</b></div>`;
    html += '<div class="tflist">' + trades.map(t => {
      const g = t.gap, lab = Math.abs(g) <= 0.03 ? 'Even swap' : g > 0 ? `You gain ~${Math.round(g * 100)}% in value` : `You give ~${Math.round(-g * 100)}% extra value`;
      return `<article class="tfcard"><div class="tfhead">${teamBlock(team(t.rid), 'Trade partner')}<span class="tflab ${Math.abs(g) <= 0.03 ? 'even' : g > 0 ? 'win' : 'lose'}">${lab}</span></div>
        <div class="tfcols"><div><div class="tfcap">You send</div>${side(t.give, t.a)}</div><div><div class="tfcap">You get</div>${side(t.get, t.b)}</div></div></article>`;
    }).join('') + '</div>';
    return html;
  }

  // ---------- Trade Calculator ----------
  function renderCalc(){
    if (!D.tf) { loadFinder(); return '<h2 class="sech">Trade Calculator</h2><p class="status">Loading dynasty values from FantasyCalc…</p>'; }
    if (D.tf.error) return `<h2 class="sech">Trade Calculator</h2><div class="error"><strong>${esc(D.tf.error)}</strong></div>`;
    const model = finderModel(), ids = [...model.teams.keys()];
    if (ids.length < 2) return '<h2 class="sech">Trade Calculator</h2><p class="note">Rosters are empty so far.</p>';
    if (!D.calc) D.calc = { a: { rid: ids[0], items: [], st: 'balanced' }, b: { rid: ids[1], items: [], st: 'balanced' } };
    const C = D.calc;
    ['a', 'b'].forEach(k => { if (!model.teams.has(C[k].rid)) C[k] = { rid: ids[k === 'a' ? 0 : 1], items: [], st: 'balanced' }; });
    const get = k => { const t = model.teams.get(C[k].rid); return C[k].items.map(key => t.assets.find(x => x.key === key)).filter(Boolean); };
    const A = get('a'), B = get('b');
    const f = D.tf.f;
    const stOpts = cur => [['balanced', 'Balanced'], ['contend', 'Contend now'], ['rebuild', 'Rebuild']].map(([v, l]) => `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`).join('');
    const sideHtml = (k, list, other) => {
      const t = model.teams.get(C[k].rid);
            const teamOpts = ids.map(r => `<option value="${r}" ${r === C[k].rid ? 'selected' : ''}>${esc(team(r).name)}</option>`).join('');
      const items = list.length ? list.map(a => `<li>${a.kind === 'p' ? shot(a.id, a.pos, a.p.tm, a.label) : '<span class="hs pick" aria-hidden="true">PK</span>'}<span class="tfn2"><span class="asset-main">${esc(a.label)}</span><span class="asset-sub">${esc(a.sub)}</span></span><b class="tfv">${Math.round(a.v).toLocaleString()}</b><button type="button" class="cx" data-calc-rm="${k}" data-key="${esc(a.key)}" aria-label="Remove ${esc(a.label)}">✕</button></li>`).join('') : '<li class="asset-sub">Nothing added yet</li>';
      return `<div class="ccol"><div class="ctitle">${teamBlock(team(C[k].rid), k === 'a' ? 'Team A sends' : 'Team B sends')}</div>
        <div class="controls"><label class="field">Team<select data-calc-team="${k}">${teamOpts}</select></label><label class="field">Strategy<select data-calc-st="${k}">${stOpts(C[k].st)}</select></label></div>
        <div class="csearch"><input type="search" class="cadd" data-calc-search="${k}" placeholder="Search ${esc(team(C[k].rid).name)}’s players or picks…" aria-label="Search players or picks" autocomplete="off"><ul class="csug" data-sug="${k}" hidden></ul></div>
        <ul class="clist">${items}</ul><div class="tfsum">Raw value <b>${Math.round(list.reduce((x, a) => x + a.v, 0)).toLocaleString()}</b></div></div>`;
    };
    let html = `<h2 class="sech">Trade Calculator</h2>
      <p class="note">Pick two teams, add what each side sends, and see who wins. Values from <a href="https://www.fantasycalc.com" target="_blank" rel="noopener noreferrer">FantasyCalc</a>, tuned to this league (${f.sf ? 'superflex' : '1 QB'}, ${f.numTeams} teams, ${f.ppr === 1 ? 'full' : f.ppr === 0.5 ? 'half' : 'no'} PPR, dynasty). Extra players in a package count for less than their full value, since they cost a roster spot.</p>
      <div class="ccols">${sideHtml('a', A)}${sideHtml('b', B)}</div>`;
    if (D.calcFocus) { const k = D.calcFocus; D.calcFocus = null; setTimeout(() => { const i = document.querySelector(`[data-calc-search="${k}"]`); if (i) i.focus(); }, 0); }
    if (!A.length && !B.length) return html + '<p class="note">Add players or picks to either side to see the verdict.</p>';
    const send = pkgVal(A), recv = pkgVal(B);
    const gap = (recv - send) / (Math.max(send, recv) || 1);
    const verdict = Math.abs(gap) <= 0.03 ? 'Even trade' : gap > 0 ? `Team A wins by ${Math.round(gap * 100)}%` : `Team B wins by ${Math.round(-gap * 100)}%`;
    const pctA = Math.round(100 * recv / ((send + recv) || 1));
    const view = (k, mine, theirs) => { const st = C[k].st; const g = pkgVal(theirs, a => stratAdj(a, st)), l = pkgVal(mine, a => stratAdj(a, st)); const d = (g - l) / (Math.max(g, l) || 1);
      return `<div class="cview"><b>${esc(team(C[k].rid).name)}</b> (${st === 'contend' ? 'contending' : st === 'rebuild' ? 'rebuilding' : 'balanced'}): ${Math.abs(d) <= 0.03 ? 'sees this as even' : d > 0 ? `comes out ahead by ~${Math.round(d * 100)}%` : `gives up ~${Math.round(-d * 100)}% extra value`}</div>`; };
    html += `<div class="cverdict"><div class="cvt">${verdict}</div>
      <div class="cbar" role="img" aria-label="Value received: Team A ${pctA}%, Team B ${100 - pctA}%"><span style="width:${pctA}%"></span></div>
      <div class="cnums"><span>Team A receives <b>${Math.round(recv).toLocaleString()}</b></span><span>Team B receives <b>${Math.round(send).toLocaleString()}</b></span></div>
      ${view('a', A, B)}${view('b', B, A)}</div>`;
    return html;
  }

  function renderProj(){

  function projectedOrderSafe(){ return projectedOrder(); }

  function renderOwn(){
    const own = new Map(D.ids.map(r => [r, []]));
    const gave = new Map(D.ids.map(r => [r, []]));
    const order = currentOrder();
    D.seasons.forEach(y => {
      for (let r = 1; r <= opts.rounds; r++) {
        D.ids.forEach(orig => {
          const owner = ownerOf(y, r, orig);
          const item = { y, r, orig, owner, slot: y === D.draftSeason ? slotOf(order, r, orig) : null };
          if (!own.has(owner)) own.set(owner, []);
          own.get(owner).push(item);
          if (owner !== orig) gave.get(orig).push(item);
        });
      }
    });
    const per = opts.rounds * D.seasons.length;
    let html = `<div class="controls">${D.seasons.length ? basisToggle() : ''}</div>${settingsBlock()}
      <p class="note">Every pick each team holds across the next ${D.seasons.length} drafts. ${D.draftSeason} picks show their ${seasonDone() ? 'final' : opts.basis === 'projected' ? 'projected' : 'current'} slot; later years show the round.
      <span class="key"></span>Highlighted picks were acquired in a trade.</p><div class="owners">`;
    const cards = D.ids.slice().sort((a, b) => team(a).name.localeCompare(team(b).name));
    cards.forEach(rid => {
      const items = (own.get(rid) || []).sort((a, b) => a.y - b.y || a.r - b.r || (a.slot ?? 0) - (b.slot ?? 0) || team(a.orig).name.localeCompare(team(b.orig).name));
      html += `<article class="ocard" id="own-${rid}"><header>${teamBlock(team(rid), esc(team(rid).manager))}<span class="count">${items.length}<small>picks</small></span></header>`;
      D.seasons.forEach(y => {
        const yi = items.filter(it => it.y === y);
        html += `<div class="yr">${y}</div><div class="chips">`;
        html += yi.length ? yi.map(it => {
          const acq = it.orig !== rid;
          const main = it.slot ? pickLabel(it.r, it.slot) : ordinal(it.r);
          return `<span class="chip${acq ? ' acq' : ''}"><b>${main}</b>${acq ? `from ${esc(team(it.orig).name)}` : ''}</span>`;
        }).join('') : '<span class="note" style="margin:0">No picks</span>';
        html += '</div>';
      });
      const g = gave.get(rid) || [];
      if (g.length) {
        const gs = g.slice().sort((a, b) => a.y - b.y || a.r - b.r);
        html += `<div class="yr gave-h">Traded away</div><div class="chips">${gs.map(it =>
          `<span class="chip gone"><b>${it.y} ${ordinal(it.r)}</b>to ${esc(team(it.owner).name)}</span>`).join('')}</div>`;

  // ---------- League records ----------
  async function loadRecords(){
    if (!D || D.records || D.recordsLoading) return;
    const myD = D;
    myD.recordsLoading = true;
    try {
      const hist = await loadHistory();
      const seasons = hist.map(L => ({ season: L.season, current: L.current, name: rid => L.teamOf(rid).name, weeks: L.weeks }));
      myD.records = computeRecords(seasons);
    } catch (e) {
      myD.records = { error: e.message || 'Couldn’t load league history from Sleeper.' };
    } finally {
      myD.recordsLoading = false;
      if (D === myD && opts.tab === 'rec') render();
    }
  }

  function computeRecords(seasons){
    const scores = [], games = [], seasonPF = [], streaks = [];
    const usedSeasons = [];
    seasons.forEach(s => {
      const pf = new Map(), gp = new Map(), cur = new Map(), best = new Map();
      let any = false;
      s.weeks.slice().sort((a, b) => a.week - b.week).forEach(({ week, list }) => {
        const valid = (list || []).filter(m => typeof m.points === 'number');
        if (!valid.some(m => m.points > 0)) return;
        any = true;
        valid.forEach(m => {
          if (m.points > 0) scores.push({ season: s.season, week, name: s.name(m.roster_id), pts: m.points });
          pf.set(m.roster_id, (pf.get(m.roster_id) || 0) + m.points);
          gp.set(m.roster_id, (gp.get(m.roster_id) || 0) + 1);
        });
        const groups = new Map();
        valid.forEach(m => { if (m.matchup_id == null) return; if (!groups.has(m.matchup_id)) groups.set(m.matchup_id, []); groups.get(m.matchup_id).push(m); });
        groups.forEach(g => {
          if (g.length !== 2) return;
          const [a, b] = g[0].points >= g[1].points ? g : [g[1], g[0]];
          const tie = a.points === b.points;
          games.push({ season: s.season, week, tie, margin: a.points - b.points,
            w: { name: s.name(a.roster_id), pts: a.points }, l: { name: s.name(b.roster_id), pts: b.points } });
          if (tie) { cur.set(a.roster_id, 0); cur.set(b.roster_id, 0); return; }
          const c = (cur.get(a.roster_id) || 0) + 1;
          cur.set(a.roster_id, c);
          if (c > (best.get(a.roster_id) || 0)) best.set(a.roster_id, c);
          cur.set(b.roster_id, 0);
        });
      });
      if (!any) return;
      usedSeasons.push(s.season);
      pf.forEach((v, rid) => seasonPF.push({ season: s.season, current: s.current, name: s.name(rid), pts: v, gp: gp.get(rid) }));
      best.forEach((v, rid) => streaks.push({ season: s.season, name: s.name(rid), len: v }));
    });
    const top = (arr, f) => arr.slice().sort(f).slice(0, 5);
    const pts = x => x.toFixed(2);
    const when = x => `${x.season}, week ${x.week}`;
    const real = games.filter(g => !g.tie);
    return {
      seasons: usedSeasons.sort((a, b) => a - b),
      cards: [
        { title: 'Highest single-week score', rows: top(scores, (a, b) => b.pts - a.pts).map(x => ({ val: pts(x.pts), who: x.name, when: when(x) })) },
        { title: 'Lowest single-week score', rows: top(scores, (a, b) => a.pts - b.pts).map(x => ({ val: pts(x.pts), who: x.name, when: when(x) })) },
        { title: 'Biggest blowout', rows: top(real, (a, b) => b.margin - a.margin).map(g => ({ val: '+' + pts(g.margin), who: `${g.w.name} over ${g.l.name}`, when: `${when(g)}, ${pts(g.w.pts)} to ${pts(g.l.pts)}` })) },
        { title: 'Closest game', rows: top(real, (a, b) => a.margin - b.margin).map(g => ({ val: '+' + pts(g.margin), who: `${g.w.name} over ${g.l.name}`, when: `${when(g)}, ${pts(g.w.pts)} to ${pts(g.l.pts)}` })) },
        { title: 'Highest score in a loss', rows: top(real, (a, b) => b.l.pts - a.l.pts).map(g => ({ val: pts(g.l.pts), who: g.l.name, when: `${when(g)}, lost to ${g.w.name}` })) },
        { title: 'Lowest score in a win', rows: top(real, (a, b) => a.w.pts - b.w.pts).map(g => ({ val: pts(g.w.pts), who: g.w.name, when: `${when(g)}, beat ${g.l.name}` })) },
        { title: 'Most points in a season', rows: top(seasonPF, (a, b) => b.pts - a.pts).map(x => ({ val: pts(x.pts), who: x.name, when: `${x.season}${x.current && !seasonDone() ? `, in progress (${x.gp} games)` : ''}` })) },
        { title: 'Longest win streak', rows: top(streaks, (a, b) => b.len - a.len).map(x => ({ val: `${x.len} W`, who: x.name, when: `${x.season} season` })) }
      ]
    };
  }

  function renderRecords(){
    if (!D.records) {
      loadRecords();
      return '<p class="status">Loading league history from Sleeper…</p>';
    }
    if (D.records.error) return `<div class="error"><strong>${esc(D.records.error)}</strong><br>Try Refresh.</div>`;
    const { seasons, cards } = D.records;
    if (!seasons.length) return '<p class="note">No games have been played yet. Records fill in after week 1 is final.</p>';
    const span = seasons.length > 1 ? `${seasons.length} seasons (${seasons[0]} to ${seasons[seasons.length - 1]})` : `the ${seasons[0]} season`;
    let html = `<p class="note">All-time records from completed regular-season games across ${span}. Each card shows the current record holder.</p><div class="rgrid">`;
    cards.forEach(c => {
      if (!c.rows.length) return;
      const first = c.rows[0];
      html += `<article class="rcard"><h3>${esc(c.title)}</h3><div class="rval">${esc(first.val)}</div>
        <div class="rwho">${esc(first.who)}</div><div class="rwhen">${esc(first.when)}</div>
      </article>`;
    });
    return html + '</div>';
  }

  // ---------- Playoff odds ----------
  function renderOdds(){
    const S = D.sim, n = D.ids.length, k = S.pTeams;
    const idx = new Map(D.ids.map((r, i) => [r, i]));
    const fmt = p => p >= 0.9995 ? '100%' : p >= 0.995 ? '>99%' : p === 0 ? '0%' : p < 0.005 ? '<1%' : Math.round(p * 100) + '%';
    const heat = p => `background:rgba(var(--heat),${Math.min(1, p * 1.15).toFixed(3)});${p * 1.15 > .55 ? 'color:var(--accent-ink);font-weight:600' : ''}`;
    const hasBye = k === 6;
    const playoffsStarted = seasonDone() && (D.firstOpen > D.lastReg);
    let html = '';
    if (!seasonDone()) {
      html += `<p class="note">Odds from ${S.sims.toLocaleString()} simulations of the remaining ${D.remaining.length} weeks and a ${k}-team playoff. Each team’s weekly score is modeled from its scoring so far, pulled slightly toward the league average. Seeds go by record, then points for${D.median ? ', and the median-win game is included' : ''}. Division winners aren’t accounted for.${D.schedUnknown ? ' Some remaining matchups aren’t published yet, so those weeks use random pairings.' : ''}</p>`;
    } else {
      html += `<p class="note">The regular season is over, so the seeds are set. Title odds come from ${S.sims.toLocaleString()} simulations of the bracket${playoffsStarted ? ' and don’t account for playoff games already played; see Playoff Bracket for results' : ''}.</p>`;
    }
    if (!S.bracketOK) html += `<p class="note">Title odds aren’t available for a ${k}-team playoff yet, so only playoff and seed odds are shown.</p>`;
