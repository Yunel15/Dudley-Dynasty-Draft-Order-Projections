    return getJSON(`/stats/nfl/regular/${D.season}/${w}`)
      .then(r => (r && typeof r === 'object') ? r : null).catch(() => null)
      .then(r => { if (r) D.statsCache.set(w, r); return r; });
  }

  function breakdownHtml(pid, w, reported, stats){
    const info = pname(pid) || { nm: 'Player', pos: '', tm: '' };
    const link = '<div class="bkclips" data-clips></div>';
    const head = `<div class="bkhead"><span class="bkwho">${shot(pid, info.pos, info.tm, info.nm)}${PL(pid, info.nm)}</span><span>${reported.toFixed(2)} pts</span></div>`;
    const st = stats && stats[pid];
    const sc = D.league.scoring_settings || {};
    if (!st) return head + '<p class="bknote">Scoring details aren’t available for this week yet.</p>' + link;
    const rows = Object.keys(st).filter(k => typeof st[k] === 'number' && st[k] !== 0 && typeof sc[k] === 'number' && sc[k] !== 0)
      .map(k => ({ k, v: st[k], m: sc[k], p: st[k] * sc[k] })).sort((a, b) => Math.abs(b.p) - Math.abs(a.p));
    const rest = reported - rows.reduce((t, r) => t + r.p, 0);
    const pt = x => `<td class="${x < 0 ? 'neg' : ''}">${x > 0 ? '+' : x < 0 ? '−' : ''}${Math.abs(x).toFixed(2)}</td>`;
    let body = rows.map(r => `<tr><td>${esc(statLabel(r.k))}</td><td>${Number.isInteger(r.v) ? r.v : r.v.toFixed(2)}</td><td>×${Number(r.m.toFixed(4))}</td>${pt(r.p)}</tr>`).join('');
    if (Math.abs(rest) > 0.005) body += `<tr><td>Bonuses and other</td><td></td><td></td>${pt(rest)}</tr>`;
    if (!body) return head + '<p class="bknote">No points scored this week.</p>' + link;
    return head + `<table class="bkt"><tbody>${body}<tr class="tot"><td colspan="3">Total</td><td>${reported.toFixed(2)}</td></tr></tbody></table>` + link;
  }

  // ---------- Highlight clips ----------
  const CLIP_ABBR = { WAS: 'WSH', JAC: 'JAX', LA: 'LAR' };
  function fetchClips(info, w){
    if (!CLIP_API || !D.seasonStart || !info || !info.tm || !info.nm) return Promise.resolve([]);
    const ab = CLIP_ABBR[info.tm] || info.tm;
    const key = ab + '|' + w;
    if (!D.clipCache) D.clipCache = new Map();
    if (D.clipCache.has(key)) return D.clipCache.get(key);
    const t0 = Date.parse(D.seasonStart + 'T00:00:00Z') + (w - 1) * 7 * 864e5 - 864e5;
    const t1 = t0 + 7 * 864e5;
    const q = side => fetch(`${CLIP_API}/highlights?season=${D.season}&${side}TeamAbbreviation=${encodeURIComponent(ab)}&limit=100`)
      .then(r => r.ok ? r.json() : { data: [] }).then(j => j.data || []).catch(() => []);
    const pr = Promise.all([q('home'), q('away')]).then(([a, b]) => {
      const seen = new Set();
      return a.concat(b).filter(h => {
        if (!h || seen.has(h.id)) return false; seen.add(h.id);
        const d = h.match && Date.parse(h.match.date);
        return d >= t0 && d < t1;
      });
    });
    D.clipCache.set(key, pr);
    return pr;
  }
  async function showClips(block, pid, w){
    const slot = block.querySelector('[data-clips]');
    const info = pname(pid);
    if (!slot || !info) return;
    const last = String(info.nm).trim().split(/\s+/).slice(-1)[0].replace(/[^A-Za-z'’-]/g, '').toLowerCase();
    if (last.length < 3 || /^(jr|sr|ii|iii|iv)$/.test(last)) return;
    const all = await fetchClips(info, w);
    const hits = all.filter(h => ((h.title || '') + ' ' + (h.description || '')).toLowerCase().includes(last))
      .sort((a, b) => (a.type === 'VERIFIED' ? 0 : 1) - (b.type === 'VERIFIED' ? 0 : 1)).slice(0, 4);
    if (!hits.length || !block.isConnected) return;
    slot.innerHTML = '<div class="bkclipt">Clips</div>' + hits.map(h => {
      const u = /^https:\/\//.test(h.url || '') ? h.url : (/^https:\/\//.test(h.embedUrl || '') ? h.embedUrl : '');
      return u ? `<a class="bkvid" href="${esc(u)}" target="_blank" rel="noopener noreferrer">▶ ${esc(h.title || 'Watch clip')}</a>` : '';
    }).join('');
  }

  async function toggleBreakdown(btn){
    const pid = btn.dataset.pid, w = Number(btn.dataset.w), pts = Number(btn.dataset.pts) || 0;
    const row = btn.closest('tr') && btn.closest('tr').nextElementSibling;
    if (!row || !row.classList.contains('bk')) return;
    const holder = row.firstElementChild;
    const existing = [...holder.children].find(c => c.dataset.bk === pid);
    if (existing) { existing.remove(); row.hidden = !holder.children.length; return; }
    const block = document.createElement('div');
    block.className = 'bkblock';
    block.dataset.bk = pid;
    block.innerHTML = '<p class="bknote">Loading scoring…</p>';
    holder.appendChild(block);
    row.hidden = false;
    const stats = await fetchStats(w);
    block.innerHTML = breakdownHtml(pid, w, pts, stats);
    showClips(block, pid, w);
  }

  // ---------- Matchups: NFL opponents, projections and win probability ----------
  // Per week: each NFL team's game (opponent, home/away, status) and every player's projection in this league's scoring.
  function weekContext(w){
    D.wctx = D.wctx || new Map(); D.wctxLoading = D.wctxLoading || new Set();
    if (D.wctx.has(w)) return D.wctx.get(w);
    if (!D.wctxLoading.has(w)) {
      D.wctxLoading.add(w);
      const myD = D;
      Promise.all([schedFor(D.season), getJSON(`/projections/nfl/regular/${D.season}/${w}`).catch(() => null), kickoffsFor(w).catch(() => null)]).then(([sch, pr]) => {
        const sched = new Map();
        (Array.isArray(sch) ? sch : []).filter(g => Number(g.week) === w).forEach(g => {
          sched.set(g.home, { opp: g.away, home: true, status: g.status, date: g.date });
          sched.set(g.away, { opp: g.home, home: false, status: g.status, date: g.date });
        });
        const proj = {};
        if (pr && typeof pr === 'object') for (const pid in pr) proj[pid] = fpts(pr[pid]);
        const prog = new Map(), gmeta = myD.gmeta && myD.gmeta.get(w); if (gmeta) gmeta.forEach((v, t) => prog.set(t, v.f));
        myD.wctx.set(w, { sched, proj, prog, hasSched: sched.size > 0, hasProj: Object.keys(proj).length > 0 });
        myD.wctxLoading.delete(w);
        if (D === myD && opts.tab === 'match') render();
      });
    }
    return null;
  }
  const gameOf = (pid, ctx) => { const i = pname(pid); const tm = i && i.tm; if (!ctx || !tm) return null; return ctx.sched.get(tm) || (ctx.hasSched ? { bye: true } : null); };
  const gameTxt = g => {
    if (!g) return '';
    if (g.bye) return 'BYE';
    const when = g.status === 'complete' ? 'Final' : g.status === 'in_game' ? 'Live' : (g.date ? new Date(g.date + 'T12:00:00').toLocaleDateString([], { weekday: 'short' }) : '');
    return `${g.home ? 'vs' : '@'} ${g.opp}${when ? ` · ${when}` : ''}`;
  };
  // Expected final points for one starter: finished games count as scored; live games add half of what is left of
  // the projection; games not started use the projection. The spread reflects how uncertain each one still is.
  function expectPts(pid, actual, ctx, final){
    if (final) return { mu: actual, v: 0 };
    const p = (ctx && ctx.proj[pid]) || 0, g = gameOf(pid, ctx);
    if (g && (g.bye || g.status === 'complete')) return { mu: actual, v: 0 };
    if (g && g.status === 'in_game') {
      const i = pname(pid), f = ctx.prog && i ? ctx.prog.get(i.tm) : null;
      if (f != null) { const left = 1 - f; return { mu: actual + p * left, v: Math.pow((0.45 * p + 1.5) * left, 2) }; }
      const rem = Math.max(0, p - actual) * 0.5; return { mu: actual + rem, v: Math.pow(0.6 * rem + 1, 2) };
    }
    return { mu: Math.max(p, actual), v: Math.pow(0.45 * p + 1.5, 2) };
  }
  const erf = x => { const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; };
  function winProb(a, b, ctx, final){
    const side = m => (m.starters || []).reduce((acc, id, i) => { if (!id || id === '0') return acc; const e = expectPts(id, ((m.starters_points || [])[i]) || 0, ctx, final); acc.mu += e.mu; acc.v += e.v; return acc; }, { mu: 0, v: 0 });
    const A = side(a), B = side(b), sd = Math.sqrt(A.v + B.v);
    const pA = sd < 0.01 ? (A.mu > B.mu ? 1 : A.mu < B.mu ? 0 : 0.5) : 0.5 * (1 + erf((A.mu - B.mu) / (sd * Math.SQRT2)));
    return { pA, projA: A.mu, projB: B.mu };
  }
  function wpBar(wp, ta, tb, w, mid){
    const a = Math.round(wp.pA * 100), b = 100 - a;
    return `<div class="wpb" role="button" tabindex="0" data-wp-chart data-wp-w="${w}" data-wp-mid="${mid}" title="Win probability, from live scores and projections. Click for the momentum chart.">
      <div class="wpb-top"><span><b>${a}%</b><em class="wpn"> ${esc(ta.name)}</em></span><span class="wpb-lab">Win probability</span><span><em class="wpn">${esc(tb.name)} </em><b>${b}%</b></span></div>
      <div class="wpb-bar"><i class="wpb-a" style="width:${Math.max(a, 0)}%"></i><i class="wpb-b" style="width:${Math.max(b, 0)}%"></i></div>
      <div class="wpb-proj"><span>Proj ${wp.projA.toFixed(1)}</span><span class="wpb-hint">Momentum chart ›</span><span>Proj ${wp.projB.toFixed(1)}</span></div></div>`;
  }

  // ---------- Win probability momentum chart ----------
  // Sleeper gives no play-by-play, so the line is rebuilt from the NFL's kickoff windows: it starts from the projections,
  // then steps each time a whole window of games finishes and those players' final points replace their projections.
  // The last point is the live win probability.
  const ESPN_ABBR = { WSH: 'WAS' };
  async function kickoffsFor(w){
    const myD = D;
    D.kick = D.kick || new Map(); D.gmeta = D.gmeta || new Map();
    if (D.kick.has(w)) return D.kick.get(w);
    let out = null;
    try {
      const j = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${w}&dates=${D.season}`).then(r => r.ok ? r.json() : null);
      const m = new Map(), meta = new Map();
      ((j && j.events) || []).forEach(ev => {
        const t = Date.parse(ev.date); if (!t) return;
        const st = (ev.status && ev.status.type && ev.status.type.name) || '', per = (ev.status && ev.status.period) || 0, clk = (ev.status && ev.status.clock) || 0;
        const f = st === 'STATUS_FINAL' ? 1 : st === 'STATUS_SCHEDULED' ? 0 : st === 'STATUS_HALFTIME' ? 0.5 : Math.min(1, Math.max(0, ((per - 1) * 900 + (900 - clk)) / 3600));
        ((ev.competitions[0] || {}).competitors || []).forEach(c => { const ab = ESPN_ABBR[c.team.abbreviation] || c.team.abbreviation; m.set(ab, t); meta.set(ab, { id: ev.id, t, f, final: st === 'STATUS_FINAL' }); });
      });
      if (m.size) { out = m; myD.gmeta.set(w, meta); }
    } catch (e) {}
    myD.kick.set(w, out);
    return out;
  }
  function momentum(a, b, w, ctx, kick){
    const starters = m => (m.starters || []).map((id, i) => ({ id, pts: ((m.starters_points || [])[i]) || 0 })).filter(x => x.id && x.id !== '0');
    const SA = starters(a), SB = starters(b), exact = !!kick;
    const gm = id => gameOf(id, ctx);
    const when = id => { const i = pname(id), g = gm(id); if (!g || g.bye || !i) return null; const k = kick && kick.get(i.tm); if (k) return k; return g.date ? Date.parse(g.date + 'T17:00:00Z') : null; };
    const times = [...new Set([...SA, ...SB].map(x => when(x.id)).filter(t => t != null))].sort((x, y) => x - y);
    const slots = [];
    times.forEach(t => { const sl = slots[slots.length - 1]; if (sl && t - sl.t0 < 3600000) sl.ts.push(t); else slots.push({ t0: t, ts: [t] }); });
    const slotOf = id => { const t = when(id); return t == null ? -1 : slots.findIndex(sl => sl.ts.includes(t)); };
    const lab = sl => { const d = new Date(sl.t0), day = d.toLocaleDateString([], { weekday: 'short' }); return exact ? `${day} ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(':00', '').replace(/\s/g, '').toLowerCase()}` : day; };
    const players = [...SA.map(x => ({ ...x, side: 'A' })), ...SB.map(x => ({ ...x, side: 'B' }))];
    const slotDone = slots.map((sl, k) => players.every(x => slotOf(x.id) !== k || (gm(x.id) || {}).status === 'complete'));
    const wpAt = k => {
      const acc = { A: { mu: 0, v: 0 }, B: { mu: 0, v: 0 } };
      players.forEach(x => {
        const g = gm(x.id), s2 = slotOf(x.id), p = ctx.proj[x.id] || 0;
        const fin = !g || g.bye || (s2 >= 0 && s2 <= k && g.status === 'complete');
        acc[x.side].mu += fin ? x.pts : p; acc[x.side].v += fin ? 0 : Math.pow(0.45 * p + 1.5, 2);
      });
      const sd = Math.sqrt(acc.A.v + acc.B.v), d = acc.A.mu - acc.B.mu;
      return sd < 0.01 ? (d > 0 ? 1 : d < 0 ? 0 : 0.5) : 0.5 * (1 + erf(d / (sd * Math.SQRT2)));
    };
    const pts = [{ label: 'Start', p: wpAt(-1), note: 'Projections only' }];
    let lastDone = -1;
    slots.forEach((sl, k) => {
      if (k !== lastDone + 1 || !slotDone[k]) return;
      lastDone = k;
      const inSlot = players.filter(x => slotOf(x.id) === k).sort((x, y) => y.pts - x.pts)[0];
      const info = inSlot && pname(inSlot.id);
      pts.push({ label: lab(sl), p: wpAt(k), top: inSlot && info ? { nm: info.nm, pts: inSlot.pts, side: inSlot.side } : null });
    });
    const allDone = slots.length > 0 && lastDone === slots.length - 1;
    const now = winProb(a, b, ctx, false).pA;
    const started = slots.some((sl, k) => k > lastDone && players.some(x => slotOf(x.id) === k && ['in_game', 'complete'].includes((gm(x.id) || {}).status)));
    if (allDone) pts[pts.length - 1] = { ...pts[pts.length - 1], label: 'Final', p: now };
    else if (started) pts.push({ label: 'Now', p: now, note: 'Live scores plus remaining projections' });
    return { pts, exact };
  }
  function wpChartSvg(pts, ta, tb){
    const W = 640, H = 250, L = 16, R = 16, T = 14, B = 34, n = pts.length;
    const x = i => n === 1 ? W / 2 : L + (W - L - R) * i / (n - 1), y = p => T + (1 - p) * (H - T - B), ym = y(0.5);
    const xy = pts.map((q, i) => [x(i), y(q.p)]);
    const line = xy.map((c, i) => `${i ? 'L' : 'M'}${c[0].toFixed(1)},${c[1].toFixed(1)}`).join('');
    const area = `M${xy[0][0].toFixed(1)},${ym}${xy.map(c => `L${c[0].toFixed(1)},${c[1].toFixed(1)}`).join('')}L${xy[n - 1][0].toFixed(1)},${ym}Z`;
    const shape = col => `<path d="${area}" fill="${col}" opacity=".22"/><path d="${line}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    const nm = t => esc(t.name.length > 26 ? t.name.slice(0, 25) + '…' : t.name);
    return `<svg class="wpc-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Win probability over the week">
      <defs><clipPath id="wpcUp"><rect x="0" y="0" width="${W}" height="${ym}"/></clipPath><clipPath id="wpcDn"><rect x="0" y="${ym}" width="${W}" height="${H - ym}"/></clipPath></defs>
      <line x1="${L}" x2="${W - R}" y1="${y(1)}" y2="${y(1)}" class="wpc-g"/><line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" class="wpc-g"/><line x1="${L}" x2="${W - R}" y1="${ym}" y2="${ym}" class="wpc-mid"/>
      <g clip-path="url(#wpcUp)">${shape('#00CEB8')}</g><g clip-path="url(#wpcDn)">${shape('#5AA6FF')}</g>
      <text x="${L + 2}" y="${y(1) + 12}" class="wpc-t a">${nm(ta)} 100%</text><text x="${L + 2}" y="${y(0) - 5}" class="wpc-t b">${nm(tb)} 100%</text><text x="${W - R - 2}" y="${ym - 5}" text-anchor="end" class="wpc-t">50%</text>
      ${xy.map((c, i) => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="${i === n - 1 ? 5.5 : 4}" class="wpc-dot ${pts[i].p >= .5 ? 'a' : 'b'}"><title>${esc(pts[i].label)}: ${esc(ta.name)} ${Math.round(pts[i].p * 100)}%</title></circle>
        <text x="${c[0].toFixed(1)}" y="${H - 14}" text-anchor="middle" class="wpc-x">${esc(pts[i].label)}</text>`).join('')}
      <text x="${xy[n - 1][0].toFixed(1)}" y="${Math.max(T + 10, xy[n - 1][1] - 11).toFixed(1)}" text-anchor="${n === 1 ? 'middle' : 'end'}" class="wpc-val">${Math.round(pts[n - 1].p * 100)}%</text></svg>`;
  }
  // ---- Play-by-play momentum (ESPN's free play feed) ----
  // Each starter's fantasy points are placed on the plays that produced them (yards, touchdowns, catches, field goals),
  // then scaled so they add up to exactly what Sleeper credited. Players ESPN can't place (defenses, unmatched ids) are
  // spread evenly across their game. Win probability at any moment = points so far + the unplayed share of the projection.
  async function playsFor(id, final){
    D.playsC = D.playsC || new Map();

        <div><span>Streak</span><b class="${c.t === 'W' ? 'tsw' : c.t === 'L' ? 'tsl' : ''}">${c.n ? c.t + c.n : '–'}</b></div><div><span>Rem. SOS</span><b>${remS.replace(/<small class="sosd">[^<]*<\/small>/, '')}</b></div></div></div>`;
    const teamOpts = ids.map(r => `<option value="${r}" ${r === rid ? 'selected' : ''}>${esc(team(r).name)}</option>`).join('');
    const body = rows.map(r => {
      const wk = `<span class="ts-wk"><b>Week ${r.w}</b><small>${ranges && ranges[r.w] ? esc(ranges[r.w]) : ''}</small></span>`;
      if (r.opp == null) {
        if (r.po) return `<button type="button" class="ts-row po" data-tab="bracket">${wk}<span class="ts-res po">P</span><span class="ts-opp"><b>${r.w === lastWeek ? 'Championship week' : 'Playoffs'}</b><small>Opponent set by the bracket</small></span><span class="ts-sc"><small>View bracket</small></span><span class="ts-go">›</span></button>`;
        return `<div class="ts-row bye">${wk}<span class="ts-res">–</span><span class="ts-opp"><b>No game</b></span><span class="ts-sc"></span><span class="ts-go"></span></div>`;
      }
      const o = team(r.opp), op = ppg(r.opp);
      const res = r.res ? `<span class="ts-res ${r.res.toLowerCase()}">${r.res}</span>` : r.live ? '<span class="ts-res live">Live</span>' : `<span class="ts-res">${r.w === D.defWeek ? 'Next' : '–'}</span>`;
      const sc = r.res || r.live ? `<span class="ts-sc${r.res === 'W' ? ' w' : ''}"><b>${r.a.toFixed(2)}</b><small>${r.b.toFixed(2)}</small></span>`
        : `<span class="ts-sc"><small>${op != null ? `Opp ${op.toFixed(1)} PPG` : ''}</small></span>`;
      return `<button type="button" class="ts-row${r.res ? ' done' : ''}${r.po ? ' po' : ''}" data-team-match="${r.w}:${rid}">${wk}${res}<span class="ts-opp">${teamBlock(o, `${r.po ? 'Playoffs · ' : ''}${record(o)}`)}</span>${sc}<span class="ts-go">›</span></button>`;
    }).join('');
    const rec = played.length ? `${wl.W}-${wl.L}${wl.T ? `-${wl.T}` : ''} in ${played.length} game${played.length === 1 ? '' : 's'}` : 'No games played yet';
    return `<div class="controls"><label class="field">Team<select data-opt="mteam">${teamOpts}</select></label></div>${head}
      <div class="ts-list">${body}</div>`;
  }

  // ---------- Matchups ----------
  function renderMatchups(){
    const w = opts.week || D.defWeek;
    const { start, lastWeek } = D.playoff;
    const ranges = weekRanges();
    const items = [];
    for (let i = D.startWeek; i <= lastWeek; i++) {
      const tag = i >= start ? (i === lastWeek ? 'Championship' : 'Playoffs') : i === D.defWeek ? 'This week' : '';
      items.push(`<button type="button" class="wk${i === w ? ' on' : ''}${i >= start ? ' po' : ''}" data-week-go="${i}" aria-current="${i === w}" aria-label="Week ${i}${ranges && ranges[i] ? `, ${ranges[i]}` : ''}${tag ? `, ${tag}` : ''}">
        <span class="wk-n">Week ${i}</span><span class="wk-d">${ranges && ranges[i] ? esc(ranges[i]) : '&nbsp;'}</span>${tag ? `<span class="wk-t">${tag}</span>` : ''}</button>`);
    }
    const seg = `<div class="mseg" role="tablist" aria-label="Matchups view"><button type="button" role="tab" data-mview="week" aria-selected="${opts.mview !== 'team'}">By week</button><button type="button" role="tab" data-mview="team" aria-selected="${opts.mview === 'team'}">Team schedule</button></div>`;
    if (opts.mview === 'team') return seg + renderTeamSched(ranges);
    let html = `${seg}
      <div class="wkstrip"><button class="wkarrow" type="button" data-week-step="-1" ${w <= D.startWeek ? 'disabled' : ''} aria-label="Previous week">‹</button>
        <div class="wkscroll" id="wkscroll" role="tablist" aria-label="Weeks">${items.join('')}</div>
        <button class="wkarrow" type="button" data-week-step="1" ${w >= lastWeek ? 'disabled' : ''} aria-label="Next week">›</button></div>`;
    if (!D.weekData.has(w)) {
      if (!D.weekLoading.has(w)) fetchWeek(w).then(() => { if (opts.tab === 'match') render(); });
      return html + '<p class="status">Loading matchups…</p>';
    }
    const list = D.weekData.get(w);
    const groups = new Map();
    list.forEach(m => { if (m.matchup_id == null) return; if (!groups.has(m.matchup_id)) groups.set(m.matchup_id, []); groups.get(m.matchup_id).push(m); });
    const pairs = [...groups.entries()].sort((a, b) => a[0] - b[0]).map(e => { e[1].mid = e[0]; return e[1]; }).filter(g => g.length === 2);
    if (!pairs.length) {
      return html + `<p class="note">${w >= start ? 'Playoff matchups for this week aren’t set yet.' : 'No matchups are scheduled for this week.'}</p>`;
    }
    const anyPts = list.some(m => (m.points || 0) > 0);
    const done = w < D.firstOpen;
    const ctx = weekContext(w);
    if (D.openMatch && D.openMatch.rid != null && D.openMatch.w === w) { const pr = pairs.find(g => g.some(m => m.roster_id === D.openMatch.rid)); D.openMatch = pr ? { w, id: pr.mid } : null; }
    const open = D.openMatch && D.openMatch.w === w ? pairs.find(g => g.mid === D.openMatch.id) : null;
    if (open) html += `<div class="msingle"><button class="btn ghost mback" type="button" data-close-match>‹ All matchups</button>`;
    else html += ``;
    html += open ? '<div class="mlist single">' : '<div class="mlist">';
    const slots = (D.league.roster_positions || []).filter(p => !['BN', 'IR', 'TAXI'].includes(p));
    const ids = [];
    pairs.forEach(g => g.forEach(m => (m.starters || []).forEach(id => ids.push(id))));
    (open ? [open] : pairs).forEach(g => {
      const [a, b] = g;
      const pa = a.points || 0, pb = b.points || 0;
      const winA = anyPts && pa > pb, winB = anyPts && pb > pa;
      const row = (m, pts, win) => {
        const t = team(m.roster_id);
        return `<div class="mteam${win ? ' win' : ''}"${open ? '' : ` data-open-match="${g.mid}" role="button" tabindex="0"`}>${teamBlock(t, `${record(t)}`)}<span class="mscore">${anyPts ? pts.toFixed(2) : '–'}</span></div>`;
      };
      let lineup = '';
      const n = Math.max(slots.length, (a.starters || []).length, (b.starters || []).length);
      for (let i = 0; i < n; i++) {
        const cell = (m, side) => {
          const id = (m.starters || [])[i];
          const pts = ((m.starters_points || [])[i]) || 0;
          if (!id || id === '0') return side === 'l' ? '<td class="pl empty">Empty</td><td class="pp">0.00</td>' : '<td class="pp">0.00</td><td class="pl empty">Empty</td>';
          const info = pname(id);
          const gm = gameOf(id, ctx), gt = gameTxt(gm);
          const inner = info ? `${shot(id, info.pos, info.tm, info.nm)}<span class="plt">${esc(info.nm)}<small>${esc([info.pos, info.tm].filter(Boolean).join(', '))}</small>${gt ? `<small class="popp${gm.status === 'in_game' ? ' live' : ''}">${esc(gt)}</small>` : ''}</span>` : '<span class="asset-sub">Loading…</span>';
          const pj = ctx && !done && ctx.proj[id] != null && !(gm && (gm.bye || gm.status === 'complete')) ? `<small class="pjt">${ctx.proj[id].toFixed(1)} proj</small>` : '';
          const label = `<button type="button" class="plbtn${side === 'r' ? ' plr' : ''}" data-player="${esc(id)}" title="Player profile">${inner}</button>`;
          const ptsB = `<button type="button" class="ppbtn" data-pid="${esc(id)}" data-pts="${pts}" data-w="${w}" title="How these points were scored">${pts.toFixed(2)}</button>${pj}`;
          return side === 'l' ? `<td class="pl">${label}</td><td class="pp">${ptsB}</td>` : `<td class="pp">${ptsB}</td><td class="pl">${label}</td>`;
        };
        lineup += `<tr>${cell(a, 'l')}<td class="slot">${esc(SLOT[slots[i]] || slots[i] || '')}</td>${cell(b, 'r')}</tr><tr class="bk" hidden><td colspan="5"></td></tr>`;
      }
      const ta = team(a.roster_id), tb = team(b.roster_id);
      const thead = `<thead><tr><th class="lh" colspan="2">${esc(ta.name)}<small>${anyPts ? pa.toFixed(2) : '–'}</small></th><th class="lh slot">vs</th><th class="lh r" colspan="2">${esc(tb.name)}<small>${anyPts ? pb.toFixed(2) : '–'}</small></th></tr></thead>`;
      const table = `<div class="lwrap"><table class="ltable">${thead}<tbody>${lineup}</tbody></table></div>`;
      const side = (t, pts, win, cls) => `<div class="mside ${cls}${win ? ' win' : ''}">${avatar(t)}<div class="mname">${esc(t.name)}</div><div class="tmeta">${record(t)}</div><div class="mscore">${anyPts ? pts.toFixed(2) : '–'}</div></div>`;
      const bigHead = `<div class="mhead">${side(ta, pa, winA, 'l')}<div class="mvs">vs</div>${side(tb, pb, winB, 'r')}</div>`;
      const tableOpen = `<div class="lwrap"><table class="ltable"><tbody>${lineup}</tbody></table></div>`;
      const wp = ctx && !done && (ctx.hasProj || anyPts) ? wpBar(winProb(a, b, ctx, false), ta, tb, w, g.mid) : '';
      html += `<article class="mcard" data-card="${g.mid}">${open ? bigHead : row(a, pa, winA) + row(b, pb, winB)}${wp}
        ${open ? `<button type="button" class="lutoggle open" data-close-match aria-expanded="true"><span class="lucar">▸</span> Lineups</button>${tableOpen}` : `<button type="button" class="lutoggle" data-open-match="${g.mid}" aria-expanded="false"><span class="lucar">▸</span> Lineups</button>`}</article>`;
    });
    html += open ? '</div></div>' : '</div>';
    ensureNames(ids);
    return html;
  }

  // Smoothly grow a matchup card into the centered full-screen view (and shrink it back).
  function morphMatch(id, opening){
    const card = document.querySelector(`[data-card="${id}"]`);
    const r0 = card ? card.getBoundingClientRect() : null;
    D.openMatch = opening ? { w: opts.week || D.defWeek, id } : null;
    render();
    const to = document.querySelector(`[data-card="${id}"]`);
    if (!to) { window.scrollTo(0, 0); return; }
    const pre = to.getBoundingClientRect();
    const top = opening ? window.scrollY + pre.top - 80 : window.scrollY + pre.top - Math.max(40, (window.innerHeight - pre.height) / 2);
    window.scrollTo(0, Math.max(0, top));
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!r0 || reduce || !to.animate) return;
    const r1 = to.getBoundingClientRect();
    const ease = 'cubic-bezier(.22,.9,.3,1)', dur = 460;
    to.style.overflow = 'hidden';
    const a = to.animate([
      { transform: `translate(${r0.left - r1.left}px, ${r0.top - r1.top}px)`, width: r0.width + 'px', height: r0.height + 'px' },
      { transform: 'translate(0, 0)', width: r1.width + 'px', height: r1.height + 'px' }
    ], { duration: dur, easing: ease });
    a.onfinish = a.oncancel = () => { to.style.overflow = ''; };
    const inner = to.querySelector('.lwrap, .mhead');
    if (opening && inner) to.querySelectorAll('.lwrap, .mhead').forEach(el => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur * 0.8, delay: dur * 0.2, easing: 'ease-out', fill: 'backwards' }));
    const car = to.querySelector('.lucar');
    if (car) car.animate(opening ? [{ transform: 'rotate(0deg)' }, { transform: 'rotate(90deg)' }] : [{ transform: 'rotate(90deg)' }, { transform: 'rotate(0deg)' }], { duration: dur * 0.8, easing: ease });
  }

  // ---------- Playoff bracket ----------
  function seedOrder(){
    const pct = r => { const t = team(r), g = t.wins + t.losses + t.ties; return g ? (t.wins + 0.5 * t.ties) / g : 0; };
    return D.ids.slice().sort((a, b) => (pct(b) - pct(a)) || (team(b).pf - team(a).pf) || (a - b));
  }
  function projectedBracket(seeds, n){
    const s = i => seeds[i - 1];
    if (n === 4) return [
      { r: 1, m: 1, t1: s(1), t2: s(4) }, { r: 1, m: 2, t1: s(2), t2: s(3) },
      { r: 2, m: 3, t1_from: { w: 1 }, t2_from: { w: 2 }, p: 1 }, { r: 2, m: 4, t1_from: { l: 1 }, t2_from: { l: 2 }, p: 3 }];
    if (n === 6) return [
      { r: 1, m: 1, t1: s(3), t2: s(6) }, { r: 1, m: 2, t1: s(4), t2: s(5) },
      { r: 2, m: 3, t1: s(1), t2_from: { w: 2 } }, { r: 2, m: 4, t1: s(2), t2_from: { w: 1 } },
      { r: 3, m: 5, t1_from: { w: 3 }, t2_from: { w: 4 }, p: 1 }, { r: 3, m: 6, t1_from: { l: 3 }, t2_from: { l: 4 }, p: 3 }];
    if (n === 8) return [
      { r: 1, m: 1, t1: s(1), t2: s(8) }, { r: 1, m: 2, t1: s(4), t2: s(5) }, { r: 1, m: 3, t1: s(2), t2: s(7) }, { r: 1, m: 4, t1: s(3), t2: s(6) },
      { r: 2, m: 5, t1_from: { w: 1 }, t2_from: { w: 2 } }, { r: 2, m: 6, t1_from: { w: 3 }, t2_from: { w: 4 } },
      { r: 3, m: 7, t1_from: { w: 5 }, t2_from: { w: 6 }, p: 1 }, { r: 3, m: 8, t1_from: { l: 5 }, t2_from: { l: 6 }, p: 3 }];
    return null;
  }
  function roundWeeks(r, finalR){
    const { start, type } = D.playoff;
    if (type === 2) return [start + 2 * (r - 1), start + 2 * (r - 1) + 1];
    if (type === 1 && r === finalR) return [start + r - 1, start + r];
    return [start + r - 1];
  }
  async function loadBracket(){
    if (!D || D.bracket || D.bracketLoading) return;
    const myD = D;
    myD.bracketLoading = true;
    try {
      const [winners, losers] = await Promise.all([
        getJSON(`/league/${leagueId}/winners_bracket`).catch(() => []),
        getJSON(`/league/${leagueId}/losers_bracket`).catch(() => [])
      ]);
      const all = [...(winners || []), ...(losers || [])];
      const finalR = Math.max(0, ...all.map(b => b.r || 0));
      const scores = new Map();
      for (let r = 1; r <= finalR; r++) {
        const lists = await Promise.all(roundWeeks(r, finalR).filter(w => w <= 18).map(w => fetchWeek(w)));
        const m = new Map();
        lists.flat().forEach(x => m.set(x.roster_id, (m.get(x.roster_id) || 0) + (x.points || 0)));
        scores.set(r, m);
      }
      myD.bracket = { winners: winners || [], losers: losers || [], scores };
    } catch (e) {
      myD.bracket = { error: e.message || 'Couldn’t load the bracket from Sleeper.' };
    } finally {
      myD.bracketLoading = false;
      if (D === myD && opts.tab === 'bracket') render();
    }
  }
  function renderBracket(){
    if (!D.bracket) { loadBracket(); return '<p class="status">Loading bracket…</p>'; }
    if (D.bracket.error) return `<div class="error"><strong>${esc(D.bracket.error)}</strong><br>Try Refresh.</div>`;
    const side = opts.bracketSide || 'winners';
    const seeds = seedOrder();
    const seedOf = new Map(seeds.map((r, i) => [r, i + 1]));
    let html = `<div class="controls"><div class="seg" role="group">
      <button type="button" data-side="winners" aria-pressed="${side === 'winners'}">Playoffs</button>
      <button type="button" data-side="losers" aria-pressed="${side === 'losers'}">Consolation</button></div></div>`;
    let games = side === 'winners' ? D.bracket.winners : D.bracket.losers;
    let projected = false;
    if (!games.length) {
      if (side === 'losers') return html + '<p class="note">The consolation bracket appears here once the playoffs start.</p>';
      games = projectedBracket(seeds, D.playoff.teams) || [];
      projected = true;
      const n = D.playoff.teams;
      html += ``;
      if (!games.length) {
        return html + `<ol class="seedlist">${seeds.slice(0, n).map(r => `<li>${teamBlock(team(r), record(team(r)))}</li>`).join('')}</ol>`;
      }
      const out = seeds[n];
      if (out) html += `<p class="note">First team out: ${esc(team(out).name)} (${record(team(out))}).</p>`;
    } else if (side === 'winners') {
      html += '';
    }
    const finalR = Math.max(...games.map(g => g.r));
    const sc = D.bracket.scores;
    const roundName = r => side === 'losers' ? `Consolation round ${r}` : r === finalR ? 'Finals' : r === finalR - 1 ? 'Semifinals' : r === 1 ? 'First round' : `Round ${r}`;
    const gameName = g => g.p === 1 ? (side === 'losers' ? 'Consolation final' : 'Championship') : g.p ? `${ordinal(g.p)} place game` : `Game ${g.m}`;
    html += '<div class="bracket">';
    for (let r = 1; r <= finalR; r++) {
      const inRound = games.filter(g => g.r === r).sort((a, b) => (a.p || 0) - (b.p || 0) || a.m - b.m);
      const rs = !projected && sc.get(r);
      const showScores = rs && [...rs.values()].some(v => v > 0);
      html += `<section class="bcol"><h3>${roundName(r)}</h3><div class="bgames">`;
      inRound.forEach(g => {
        const slot = (rid, from) => {
          if (rid == null) {
            const txt = from ? `${from.w != null ? 'Winner' : 'Loser'} of game ${from.w ?? from.l}` : 'To be decided';
            return `<div class="bteam tbd"><span class="seed"></span><span class="bname">${txt}</span><span class="bscore"></span></div>`;
          }
          const cls = g.w === rid ? ' win' : g.l === rid ? ' lose' : '';
          const pts = showScores ? (rs.get(rid) || 0).toFixed(2) : '';
          return `<div class="bteam${cls}"><span class="seed">${seedOf.get(rid) || ''}</span><span class="bname">${esc(team(rid).name)}</span><span class="bscore">${pts}</span></div>`;
        };
        html += `<div class="bmatch${g.p === 1 ? ' final' : ''}"><div class="blabel">${gameName(g)}</div>${slot(g.t1, g.t1_from)}${slot(g.t2, g.t2_from)}</div>`;
      });
      html += '</div></section>';
    }
    return html + '</div>';
  }

  // ---------- Payouts ----------
  const usd = (x, cents) => (x < 0 ? '−$' : '$') + Math.abs(x).toFixed(cents ? 2 : 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  async function loadMoney(){
    if (!D || D.money || D.moneyLoading) return;
    const myD = D;
    myD.moneyLoading = true;
    try {
      const hist = await loadHistory();
      const M = new Map();
      const current = {};
      hist.forEach(L => {
        const keyOf = new Map();
        const ub = new Map(L.users.map(u => [u.user_id, u]));
        L.rosters.forEach(r => {
          const k = r.owner_id || `${L.id}-${r.roster_id}`;
          keyOf.set(r.roster_id, k);
          if (!M.has(k)) M.set(k, { seasons: new Set(), won: 0, wins: {}, latest: null, current: false });
          const m = M.get(k);
          m.seasons.add(L.season);
          if (L.current) m.current = true;
          if (!m.latest || L.season >= m.latest.season) {
            const t = L.teamOf(r.roster_id), u = ub.get(r.owner_id) || {};
            m.latest = { season: L.season, name: t.name, avatar: t.avatar, manager: u.display_name || t.manager || '' };
          }
        });
        const pay = (rid, key) => {
          const k = keyOf.get(rid), p = PAYOUTS.find(x => x.key === key);
          if (!k || !p) return;
          const m = M.get(k);
          m.won += p.amount;
          m.wins[key] = (m.wins[key] || 0) + 1;
          if (L.current) current[key] = rid;
        };
        (L.bracket || []).forEach(b => {
          if (b.w == null || b.l == null) return;
          if (b.p === 1) { pay(b.w, 'champ'); pay(b.l, 'runner'); }
          if (b.p === 3) pay(b.w, 'third');
        });
        const regDone = L.current ? seasonDone() : true;
        if (regDone && L.rosters.length) {
          const pf = r => { const st = r.settings || {}; return (st.fpts || 0) + (st.fpts_decimal || 0) / 100; };
          const top = L.rosters.slice().sort((a, b) => pf(b) - pf(a))[0];
          if (top && pf(top) > 0) pay(top.roster_id, 'pts');
        }
      });
      const list = [...M.values()].filter(m => m.latest).map(m => ({ ...m, paid: m.seasons.size * BUY_IN }))
        .sort((a, b) => (b.won - b.paid) - (a.won - a.paid) || (b.current - a.current));
      myD.money = { list, current, seasons: hist.length };
    } catch (e) {
      myD.money = { error: e.message || 'Couldn’t load league history from Sleeper.' };
    } finally {
      myD.moneyLoading = false;
      if (D === myD && opts.tab === 'pay') render();
    }
  }

  function renderPayouts(){
    const n = D.ids.length;
    const pot = BUY_IN * n;
    const S = D.sim;
    const idx = new Map(D.ids.map((r, i) => [r, i]));
    if (!D.money) loadMoney();
    const money = D.money && !D.money.error ? D.money : null;
    const cur = money ? money.current : {};
    const pct = p => p >= 0.995 ? '>99%' : p < 0.005 ? '<1%' : Math.round(p * 100) + '%';
    const oddsKey = { champ: 'champ', runner: 'runner', third: 'third', pts: 'ptsLead' };

    let html = `<section class="pot"><div class="potnum">${usd(pot)}</div><div class="pottxt">
      <b>${D.season} prize pool</b><span>${usd(BUY_IN)} buy-in per team × ${n} teams, due by the start of each season. All funds are collected and held by the Commissioner.</span></div></section>`;

    html += '<div class="paygrid">';
    PAYOUTS.forEach(p => {
      let status;
      if (cur[p.key] != null) {
        status = `<div class="paywho won">${teamBlock(team(cur[p.key]), `${D.season} winner`)}</div>`;
      } else if (p.key === 'pts' && !seasonDone()) {
        const leader = D.ids.slice().sort((a, b) => team(b).pf - team(a).pf)[0];
        const fav = D.ids.slice().sort((a, b) => S.ptsLead[idx.get(b)] - S.ptsLead[idx.get(a)])[0];
        status = `<div class="paywho">${teamBlock(team(leader), `Leading now with ${pfTxt(team(leader))} PF`)}</div>
          ${fav !== leader ? `<div class="payodds">Most likely to finish first: ${esc(team(fav).name)} (${pct(S.ptsLead[idx.get(fav)])})</div>` : `<div class="payodds">${pct(S.ptsLead[idx.get(leader)])} chance to hold on</div>`}`;
      } else if (S.bracketOK || p.key === 'pts') {
        const arr = S[oddsKey[p.key]];
        const fav = D.ids.slice().sort((a, b) => arr[idx.get(b)] - arr[idx.get(a)])[0];
        status = `<div class="paywho">${teamBlock(team(fav), `Favorite, ${pct(arr[idx.get(fav)])}`)}</div>`;
      } else {
        status = '<div class="payodds">To be decided</div>';
      }
      html += `<article class="paycard${cur[p.key] != null ? ' decided' : ''}"><div class="payhead"><span class="payamt">${usd(p.amount)}</span><span class="paypct">${p.pct}% of pot</span></div>
        <h3>${titleCase(p.label)}</h3>${status}</article>`;
    });
    html += '</div>';

    // Projected winnings for the current season
    if (S.bracketOK) {
      const decided = k => cur[k] != null;
      const ev = D.ids.map(rid => {
        const i = idx.get(rid);
        let e = 0, cash = 0;
        PAYOUTS.forEach(p => {
          const prob = decided(p.key) ? (cur[p.key] === rid ? 1 : 0) : S[oddsKey[p.key]][i];
          e += prob * p.amount;
        });
        const champish = decided('champ') ? (cur.champ === rid || cur.runner === rid ? 1 : 0) : S.finals[i];
        const thirdP = decided('third') ? (cur.third === rid ? 1 : 0) : S.third[i];
        const ptsP = decided('pts') ? (cur.pts === rid ? 1 : 0) : S.ptsLead[i];
        cash = 1 - (1 - champish) * (1 - thirdP) * (1 - ptsP);
        return { rid, e, cash: Math.min(1, cash) };
      }).sort((a, b) => b.e - a.e);
      html += `<h3 class="sh3">Projected ${D.season} Winnings</h3>
        
        <div class="tablewrap"><table><thead><tr><th class="tl" scope="col">Team</th><th scope="col">Record</th><th scope="col">Chance to cash</th><th scope="col">Expected payout</th><th scope="col">Expected net</th></tr></thead><tbody>
        ${ev.map(x => `<tr><td class="tl">${teamBlock(team(x.rid), '')}</td><td>${record(team(x.rid))}</td><td>${pct(x.cash)}</td>
          <td class="avgp">${usd(x.e, true)}</td><td class="${x.e - BUY_IN >= 0 ? 'pos' : 'neg'}">${usd(x.e - BUY_IN, true)}</td></tr>`).join('')}
        </tbody></table></div>`;
    }

    // All-time money list
    html += `<h3 class="sh3">All-Time Money List</h3>`;
    if (!D.money) return html + '<p class="status">Loading league history…</p>';
    if (D.money.error) return html + `<div class="error"><strong>${esc(D.money.error)}</strong><br>Try Refresh.</div>`;
    html += `
      <div class="tablewrap"><table><thead><tr><th class="tl" scope="col">Manager</th><th scope="col">Seasons</th><th scope="col">Won</th><th scope="col">Buy-ins paid</th><th scope="col">Net</th><th scope="col">Payouts</th></tr></thead><tbody>`;
    money.list.forEach(m => {
      const net = m.won - m.paid;
      const tags = PAYOUTS.filter(p => m.wins[p.key]).map(p => `${p.label}${m.wins[p.key] > 1 ? ' ×' + m.wins[p.key] : ''}`).join(', ') || '–';
      html += `<tr><td class="tl">${teamBlock(m.latest, esc(m.latest.manager) + (m.current ? '' : ', former'))}</td><td>${m.seasons.size}</td><td>${usd(m.won)}</td><td>${usd(m.paid)}</td>
        <td class="avgp ${net >= 0 ? 'pos' : 'neg'}">${usd(net)}</td><td class="tags">${esc(tags)}</td></tr>`;
    });
    return html + '</tbody></table></div>';
  }

  // ---------- Team construction ----------
  const POS_ORDER = ['QB', 'RB', 'WR', 'TE', 'K', 'DL', 'LB', 'DB'];

  async function playerInfoFor(ids){
    let cache = {};
    try { cache = JSON.parse(store.get('playerInfo') || '{}'); } catch (e) {}
    const missing = ids.filter(id => !cache[id] || cache[id].ye === undefined);
    if (missing.length) {
      const all = await getJSON('/players/nfl');
      missing.forEach(id => {
        const p = all[id];
        if (!p) return;
        cache[id] = {
          n: p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || id,
          pos: p.position || '', t: p.team || '', b: p.birth_date || '',
          a: typeof p.age === 'number' ? p.age : null,
          ry: Number(p.rookie_year) || null, ye: typeof p.years_exp === 'number' ? p.years_exp : null
        };
      });
      store.set('playerInfo', JSON.stringify(cache));
    }
    return cache;
  }
  const ageOf = p => {
    if (p.b) { const t = Date.parse(p.b); if (!isNaN(t)) return (Date.now() - t) / 31557600000; }
    return p.a;
  };
  const durTxt = ms => {
    const d = Math.max(0, Math.floor(ms / 86400000));
    if (d < 14) return `${d} day${d === 1 ? '' : 's'}`;
    if (d < 60) return `${Math.floor(d / 7)} weeks`;
    if (d < 730) return `${Math.round(d / 30.4)} months`;
    return `${(d / 365.25).toFixed(1)} years`;
  };

  // Who has held each player the longest, from draft picks and transactions across every season
  async function loadAcquisitions(hist){
    const holder = new Map(), log = new Map(), trades = [];
    const oldest = hist.length ? hist[hist.length - 1].season : null;
    const note = (pid, e) => { if (!log.has(pid)) log.set(pid, []); log.get(pid).push(e); };
    for (const L of hist.slice().reverse()) {
      const ownerOfRid = new Map(L.rosters.map(r => [r.roster_id, r.owner_id || `${L.id}-${r.roster_id}`]));
      const ev = [];
      const drafts = await getJSON(`/league/${L.id}/drafts`).catch(() => []);
      for (const d of (Array.isArray(drafts) ? drafts : [])) {
        const picks = await getJSON(`/draft/${d.draft_id}/picks`).catch(() => []);
        const ts = d.last_picked || d.start_time || 0;
        const dName = `${d.season || L.season} ${String(d.season || L.season) === String(oldest) ? 'startup' : 'rookie'} draft`;
        const teamsN = (d.settings && d.settings.teams) || L.rosters.length || 12;
        (Array.isArray(picks) ? picks : []).forEach(pk => {
          if (!pk.player_id || !ownerOfRid.has(pk.roster_id)) return;
          const owner = ownerOfRid.get(pk.roster_id);
          ev.push({ ts, ord: pk.pick_no || 0, kind: 'add', pid: pk.player_id, owner });
          const slot = pk.draft_slot || (((pk.pick_no || 1) - 1) % teamsN) + 1;
          note(pk.player_id, { ts, ord: pk.pick_no || 0, how: 'draft', to: owner, draft: dName, round: pk.round, slot, no: pk.pick_no });
        });
      }
      const weeks = await Promise.all([...Array(19).keys()].map(w => getJSON(`/league/${L.id}/transactions/${w}`).catch(() => [])));
      weeks.forEach(list => (Array.isArray(list) ? list : []).forEach(t => {
        if (!t || t.status !== 'complete') return;
        const ts = t.status_updated || t.created || 0;
        Object.entries(t.adds || {}).forEach(([pid, rid]) => { if (ownerOfRid.has(rid)) ev.push({ ts, ord: 0, kind: 'add', pid, owner: ownerOfRid.get(rid) }); });
        const how = t.type === 'trade' ? 'trade' : t.type === 'waiver' ? 'waiver' : t.type === 'free_agent' ? 'fa' : 'commish';
        if (how === 'trade') trades.push({ ts, season: L.season, week: t.leg, id: t.transaction_id, owners: [...new Set((t.roster_ids || []).map(r => ownerOfRid.get(r)).filter(Boolean))] });
        Object.entries(t.adds || {}).forEach(([pid, rid]) => {
          if (!ownerOfRid.has(rid)) return;
          const fromRid = (t.drops || {})[pid];
          // For trades, keep what the old team got back from the new team in the same deal.
          let ret = null;
          if (how === 'trade' && fromRid != null) ret = {
            players: Object.entries(t.adds || {}).filter(([p, r]) => r === fromRid && (t.drops || {})[p] === rid).map(([p]) => p),
            picks: (t.draft_picks || []).filter(dp => dp.owner_id === fromRid && dp.previous_owner_id === rid).map(dp => ({ season: dp.season, round: dp.round, orig: ownerOfRid.get(dp.roster_id) || null })),
            faab: (t.waiver_budget || []).filter(w => w.sender === rid && w.receiver === fromRid).reduce((a, w) => a + (Number(w.amount) || 0), 0)
          };
          note(pid, { ts, ord: 1, how, to: ownerOfRid.get(rid), from: fromRid != null && ownerOfRid.has(fromRid) ? ownerOfRid.get(fromRid) : null, bid: Number((t.settings || {}).waiver_bid) || 0, week: t.leg, season: L.season, ret, tx: t.transaction_id });
        });
        if (t.type !== 'trade') Object.entries(t.drops || {}).forEach(([pid, rid]) => {
          if (ownerOfRid.has(rid)) note(pid, { ts, ord: 0, how: 'drop', from: ownerOfRid.get(rid), week: t.leg, season: L.season });
        });
        Object.entries(t.drops || {}).forEach(([pid, rid]) => { if (ownerOfRid.has(rid)) ev.push({ ts, ord: 0, kind: 'drop', pid, owner: ownerOfRid.get(rid) }); });
      }));
      ev.sort((a, b) => (a.ts - b.ts) || (a.kind === b.kind ? 0 : a.kind === 'drop' ? -1 : 1) || (a.ord - b.ord));
      ev.forEach(e => {
        if (e.kind === 'add') holder.set(e.pid, { owner: e.owner, ts: e.ts, ord: e.ord });
        else { const h = holder.get(e.pid); if (h && h.owner === e.owner) holder.delete(e.pid); }
      });
    }
    log.forEach(list => list.sort((a, b) => (a.ts - b.ts) || (a.ord - b.ord)));
    holder.log = log;
    holder.trades = trades;
    return holder;
  }

  async function loadBuild(){
    if (!D || D.build || D.buildLoading) return;
    const myD = D;
    myD.buildLoading = true;
    try {
      const hist = await loadHistory();
      const rosters = (myD.rosters || []).filter(r => r.roster_id != null);
      const ids = [...new Set(rosters.flatMap(r => r.players || []))];
      const [info, holder] = await Promise.all([playerInfoFor(ids), loadAcquisitions(hist).catch(() => new Map())]);
      myD.build = { info, holder, rosters };
    } catch (e) {
      myD.build = { error: e.message || 'Couldn’t load player data from Sleeper.' };
    } finally {
      myD.buildLoading = false;
      if (D === myD && opts.tab === 'build') render();
    }
  }

  function renderBuild(){
    if (!D.build) { loadBuild(); return '<p class="status">Loading rosters and player ages…</p>'; }
    if (D.build.error) return `<div class="error"><strong>${esc(D.build.error)}</strong><br>Try Refresh.</div>`;
    const { info, holder, rosters } = D.build;
    if (!rosters.some(r => (r.players || []).length)) return '<p class="note">Rosters are empty so far. Team construction shows up once teams have players.</p>';

    const teams = rosters.map(r => {
      const players = (r.players || []).map(id => info[id] ? { id, ...info[id] } : null).filter(Boolean);
      const byPos = {};
      let ageSum = 0, ageN = 0;
      players.forEach(p => {
        if (!p.pos || p.pos === 'DEF') return;
        const a = ageOf(p);
        const b = byPos[p.pos] || (byPos[p.pos] = { n: 0, ages: [] });
        b.n++;
        if (a != null) { b.ages.push(a); ageSum += a; ageN++; }
      });
      const nfl = {};
      players.forEach(p => { if (p.pos === 'DEF') return; const k = p.t || 'FA'; nfl[k] = (nfl[k] || 0) + 1; });
      const key = r.owner_id || `${leagueId}-${r.roster_id}`;
      let tenured = null;
      players.forEach(p => {
        const h = holder.get(p.id);
        if (!h || h.owner !== key) return;
        if (!tenured || h.ts < tenured.ts || (h.ts === tenured.ts && h.ord < tenured.ord)) tenured = { p, ts: h.ts, ord: h.ord };
      });
      return { rid: r.roster_id, r, players, byPos, avg: ageN ? ageSum / ageN : null, nfl, tenured };
    }).sort((a, b) => team(a.rid).name.localeCompare(team(b.rid).name));

    const posList = POS_ORDER.filter(pos => teams.some(t => t.byPos[pos] && t.byPos[pos].ages.length));
    const posAvg = (t, pos) => { const b = t.byPos[pos]; return b && b.ages.length ? avg(b.ages) : null; };
    const cmp = {};
    posList.forEach(pos => { cmp[pos] = teams.map(t => posAvg(t, pos)).filter(v => v != null); });
    const allVals = teams.map(t => t.avg).filter(v => v != null);
    const cell = (val, vals) => {
      if (val == null) return '<td>–</td><td>–</td>';
      const r = 1 + vals.filter(v => v < val - 1e-9).length, n = vals.length;
      const cls = n >= 6 ? (r <= 3 ? ' class="pos"' : r > n - 3 ? ' class="neg"' : '') : '';
      return `<td>${val.toFixed(1)}</td><td${cls}>#${r} of ${n}</td>`;
    };

    const sel = teams.some(x => x.rid === opts.buildTeam) ? opts.buildTeam : teams[0].rid;
    const t = teams.find(x => x.rid === sel);
    const tm = team(sel);
    const pmap = new Map(t.players.map(p => [p.id, p]));
    const slots = (D.league.roster_positions || []).filter(x => !['BN', 'IR', 'TAXI'].includes(x));
    const starters = t.r.starters || [];
    const inStart = new Set(starters), inIR = new Set(t.r.reserve || []), inTaxi = new Set(t.r.taxi || []);
    const ownerKey = t.r.owner_id || `${leagueId}-${t.r.roster_id}`;
    const since = id => { const h = holder.get(id); return h && h.owner === ownerKey ? h.ts : null; };
    const posIdx = p => { const i = POS_ORDER.indexOf(p.pos); return i < 0 ? 99 : i; };
    const row = (p, label) => {
      const ts = since(p.id), a = ageOf(p);
      return `<li class="rrow prow-click" role="button" tabindex="0" data-player="${esc(p.id)}" aria-label="Open ${esc(p.n)} game log and history"><span class="pbadge pb-${esc(p.pos || 'X')}">${esc(label)}</span>${shot(p.id, p.pos, p.t, p.n)}
        <div class="rtx"><div class="rname">${esc(p.n)}</div><div class="rsub">${esc([p.pos, p.t || 'FA'].filter(Boolean).join(' · '))} · Age ${a == null ? '–' : a.toFixed(1)}</div></div>
        <span class="rten">${ts ? durTxt(Date.now() - ts) : ''}</span></li>`;
    };
    const group = (title, rowsHtml, n) => n ? `<h3 class="rhead">${title}<small>${n}</small></h3><ul class="rlist2">${rowsHtml}</ul>` : '';

    const nflF = opts.nflFilter && t.nfl[opts.nflFilter] ? opts.nflFilter : null;
    const posF = opts.posFilter && t.byPos[opts.posFilter] ? opts.posFilter : null;
    const matches = p => (!nflF || (p.pos !== 'DEF' && (p.t || 'FA') === nflF)) && (!posF || p.pos === posF);
    const startItems = starters.map((id, i) => ({ id, label: SLOT[slots[i]] || slots[i] || '', p: pmap.get(id) }))
      .filter(x => (nflF || posF) ? (x.p && matches(x.p)) : true);
    const startRows = startItems.map(x => (!x.id || x.id === '0')
      ? `<li class="rrow"><span class="pbadge">${esc(x.label)}</span><span></span><div class="rtx"><div class="rname empty">Empty slot</div></div><span></span></li>`
      : (x.p ? row(x.p, x.label) : '')).join('');
    const bench = t.players.filter(p => !inStart.has(p.id) && !inIR.has(p.id) && !inTaxi.has(p.id) && matches(p))
      .sort((x, y) => posIdx(x) - posIdx(y) || (ageOf(y) ?? 0) - (ageOf(x) ?? 0));
    const irList = t.players.filter(p => inIR.has(p.id) && matches(p)), taxiList = t.players.filter(p => inTaxi.has(p.id) && matches(p));

    const pickOrder = currentOrder(), myPicks = [];
    D.seasons.forEach(y => { for (let rd = 1; rd <= opts.rounds; rd++) D.ids.forEach(orig => { if (ownerOf(y, rd, orig) === sel) myPicks.push({ y, r: rd, orig, slot: y === D.draftSeason ? slotOf(pickOrder, rd, orig) : null }); }); });
    myPicks.sort((a, b) => a.y - b.y || a.r - b.r || (a.slot ?? 0) - (b.slot ?? 0));
    const acqN = myPicks.filter(p => p.orig !== sel).length;
    const pickPop = D.seasons.map(y => { const yi = myPicks.filter(p => p.y === y);
      return `<span class="pp-yr">${y}</span><span class="pp-chips">${yi.length ? yi.map(p => `<span class="chip${p.orig !== sel ? ' acq' : ''}"><b>${p.slot ? pickLabel(p.r, p.slot) : ordinal(p.r)}</b>${p.orig !== sel ? `from ${esc(team(p.orig).name)}` : ''}</span>`).join('') : '<span class="asset-sub">No picks</span>'}</span>`; }).join('');
    const teamOpts = teams.map(x => `<option value="${x.rid}" ${x.rid === sel ? 'selected' : ''}>${esc(team(x.rid).name)}</option>`).join('');
    let html = `<div class="controls"><label class="field">Team<select data-opt="buildTeam">${teamOpts}</select></label></div>
      
      <div class="bsplit">
      <article class="bcard"><header>${teamBlock(tm, `${esc(tm.manager)}${tm.manager ? ', ' : ''}${record(tm)}`)}<span class="count">${t.players.length}<small>players</small></span></header>
        <table class="btable"><thead><tr><th scope="col">Pos</th><th scope="col">Players</th><th scope="col">Avg age</th><th scope="col">Age rank</th></tr></thead><tbody>
        ${posList.map(pos => { const ps = t.players.filter(p => p.pos === pos).sort((a, b) => (ageOf(a) ?? 99) - (ageOf(b) ?? 99));
          const pop = ps.length ? `<span class="pickpop" role="tooltip"><span class="pp-yr">${pos} (${ps.length})</span>${ps.map(p => { const a = ageOf(p); return `<span class="pp-pl"><b>${esc(p.n)}</b><span class="asset-sub">${esc(p.t || 'FA')} · ${a == null ? '–' : a.toFixed(1)}</span></span>`; }).join('')}</span>` : '';
          return `<tr><td>${pos}</td><td>${ps.length ? `<button type="button" class="pickbtn posbtn" data-pos-filter="${pos}" aria-pressed="${posF === pos}" aria-label="Show only ${pos}s on the roster"><b>${ps.length}</b>${pop}</button>` : 0}</td>${cell(posAvg(t, pos), cmp[pos])}</tr>`; }).join('')}
        <tr class="all"><td>All</td><td>${t.players.filter(p => p.pos !== 'DEF').length}</td>${cell(t.avg, allVals)}</tr>
        <tr class="prow"><td>Picks</td><td colspan="3"><button type="button" class="pickbtn" data-own-team="${sel}" aria-label="${myPicks.length} draft picks. Open Pick Ownership"><span><b>${myPicks.length}</b> draft pick${myPicks.length === 1 ? '' : 's'}${acqN ? ` <span class="asset-sub">(${acqN} acquired)</span>` : ''}</span><span class="pp-go">View ›</span><span class="pickpop" role="tooltip">${pickPop}</span></button></td></tr></tbody></table>
        <div class="yr">Players per NFL team</div><div class="chips">
        ${Object.entries(t.nfl).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([k, n]) =>
          `<button type="button" class="chip chipbtn${n >= 3 ? ' stack' : ''}" data-nfl="${esc(k)}" aria-pressed="${nflF === k}"><b>${esc(k)}</b>${n} player${n === 1 ? '' : 's'}</button>`).join('') || '<span class="tempty">No players</span>'}</div>
        <div class="yr">Longest tenured</div>
        ${t.tenured ? `<div class="tenure"><b>${esc(t.tenured.p.n)}</b> <span class="asset-sub">${esc([t.tenured.p.pos, t.tenured.p.t].filter(Boolean).join(', '))}</span>
          <div class="asset-sub">On this roster since ${new Date(t.tenured.ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })} (${durTxt(Date.now() - t.tenured.ts)})</div></div>`
          : '<div class="tempty">Not available yet</div>'}
      </article>
      <article class="bcard"><h3 class="rtitle">Current Roster</h3>${nflF ? `<div class="fbar">Showing <b>${esc(nflF)}</b> players only <button type="button" class="linkbtn" data-nfl="${esc(nflF)}">Clear filter</button></div>` : ''}${posF ? `<div class="fbar">Showing <b>${esc(posF)}</b>s only <button type="button" class="linkbtn" data-pos-filter="${esc(posF)}">Clear filter</button></div>` : ''}
        ${group('Starters', startRows, startItems.length)}${group('Bench', bench.map(p => row(p, p.pos || '')).join(''), bench.length)}
        ${group('Injured Reserve', irList.map(p => row(p, p.pos || '')).join(''), irList.length)}${group('Taxi Squad', taxiList.map(p => row(p, p.pos || '')).join(''), taxiList.length)}
      </article></div>`;
    return html;
  }

  // ---------- League history (shared) ----------
  function loadHistory(){
    if (D.historyPromise) return D.historyPromise;
    const myD = D;
    const avatarOf = u => {
      const md = (u && u.metadata) || {};
      if (md.avatar && /^https?:\/\//.test(md.avatar)) return md.avatar;
      return u && u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : null;
    };
    myD.historyPromise = (async () => {
      const out = [];
      const curBracket = await getJSON(`/league/${leagueId}/winners_bracket`).catch(() => null);
      out.push({ id: leagueId, season: myD.season, current: true, league: myD.league, rosters: myD.rosters || [], users: myD.users || [],
        weeks: myD.completedWeeks, bracket: curBracket || [], teamOf: rid => team(rid) });
      let prev = myD.league.previous_league_id, guard = 0;
      while (prev && prev !== '0' && guard++ < 15) {
        const [lg, ros, us, br] = await Promise.all([
          getJSON(`/league/${prev}`), getJSON(`/league/${prev}/rosters`), getJSON(`/league/${prev}/users`),
          getJSON(`/league/${prev}/winners_bracket`).catch(() => null)
        ]);
        if (!lg) break;
        const ub = new Map((us || []).map(u => [u.user_id, u]));
        const tm = new Map((ros || []).map(r => {
          const u = ub.get(r.owner_id) || {};
          return [r.roster_id, { rid: r.roster_id, name: (u.metadata && u.metadata.team_name) || u.display_name || `Team ${r.roster_id}`, manager: u.display_name || '', avatar: avatarOf(u) }];
        }));
        const st = lg.settings || {};
        const sw = st.start_week || 1, last = (st.playoff_week_start || 15) - 1;
        const ws = [];
        for (let w = sw; w <= last; w++) ws.push(w);

  // ---------- Rivalries: all-time head-to-head records between managers ----------
  // Managers are tracked by Sleeper user_id (owner_id), so a record follows the person across seasons, not the roster slot.
  const rvPair = (a, b) => a < b ? `${a}|${b}` : `${b}|${a}`;
  // Which NFL weeks a winners-bracket round was played in (1 week per round, or 2-week rounds / 2-week final).
  function rvRoundWeeks(lg, round, lastRound){
    const st = lg.settings || {}, pws = st.playoff_week_start || 15, type = st.playoff_round_type || 0;

  async function loadRivals(){
    if (!D || D.rv || D.rvLoading) return;

      for (const L of hist) {
        const keyOf = new Map(L.rosters.map(r => [r.roster_id, r.owner_id || `${L.id}-${r.roster_id}`]));
        // Regular season: every head-to-head pairing in a completed week (the current season only includes finished weeks).
        L.weeks.forEach(({ week, list }) => {
          const by = new Map();
          (list || []).forEach(m => { if (m.matchup_id == null) return; if (!by.has(m.matchup_id)) by.set(m.matchup_id, []); by.get(m.matchup_id).push(m); });
          by.forEach(g => {
            if (g.length !== 2) return;
            const [x, y] = g, px = x.points || 0, py = y.points || 0;
            if (!px && !py) return;
            const a = keyOf.get(x.roster_id), b = keyOf.get(y.roster_id);
            if (a && b && a !== b) games.push({ season: L.season, week, a, b, pa: px, pb: py, po: false });

  async function loadInj(){

      const [lists, all] = await Promise.all([
        Promise.all(ws.map(w => getJSON(`/league/${leagueId}/transactions/${w}`).then(l => Array.isArray(l) ? l : [], () => null))),

    const ranked = [...act.values()].map(x => ({ ...x, n: x.trade + x.waiver + x.fa })).filter(x => x.n).sort((a, b) => b.n - a.n || b.trade - a.trade || team(a.rid).name.localeCompare(team(b.rid).name));

    const ptsReady = !!tx.pts;
    const scored = ptsReady ? tx.pts.filter(x => x.pts != null) : [];
    const ptsNote = '<p class="note">Counts points scored for the adding team from the week of the pickup until he was dropped. Finished weeks only.</p>';

  // ---------- Trade Network ----------
  function tnBuild(){
    if (D.tn) return D.tn;
    const byOwner = new Map();
    (D.rosters || []).forEach(r => { if (r.owner_id && r.roster_id != null) byOwner.set(r.owner_id, r.roster_id); });
    const cur = new Set(D.ids);
    const stat = new Map(D.ids.map(r => [r, { rid: r, n: 0, former: 0, partners: new Map(), formerP: new Set(), sentP: 0, sentK: 0, recvP: 0, recvK: 0, sentF: 0, recvF: 0 }]));
    const pair = new Map(), key = (a, b) => a < b ? a + '|' + b : b + '|' + a;
    let total = 0;
    D.trades.list.forEach(({ t, L }) => {
      const ownerOf = rid => (L.rosters.find(r => r.roster_id === rid) || {}).owner_id || `${L.id}-${rid}`;
      const map = rid => L.current ? (cur.has(rid) ? rid : null) : (byOwner.has(ownerOf(rid)) ? byOwner.get(ownerOf(rid)) : null);
      const parts = (t.roster_ids || []).map(r => ({ o: ownerOf(r), m: map(r) }));
      const cs = [...new Set(parts.map(x => x.m).filter(m => m != null && stat.has(m)))];
      if (!cs.length) return;
      total++;
      cs.forEach(c => {
        const s = stat.get(c); s.n++;
        parts.forEach(x => {
          if (x.m === c) return;
          if (x.m != null && stat.has(x.m)) s.partners.set(x.m, (s.partners.get(x.m) || 0) + 1);
          else { s.formerP.add(x.o); }
        });
        if (parts.some(x => x.m == null || !stat.has(x.m))) s.former++;
      });
      for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) { const k = key(cs[i], cs[j]); pair.set(k, (pair.get(k) || 0) + 1); }
      const bump = (rid, f) => { const m = map(Number(rid)); if (m != null && stat.has(m)) stat.get(m)[f]++; };
      Object.values(t.adds || {}).forEach(to => bump(to, 'recvP'));
      Object.values(t.drops || {}).forEach(from => bump(from, 'sentP'));
      (t.draft_picks || []).forEach(dp => { bump(dp.owner_id, 'recvK'); bump(dp.previous_owner_id, 'sentK'); });
      (t.waiver_budget || []).forEach(w => {
        const a = map(Number(w.receiver)), b = map(Number(w.sender));
        if (a != null && stat.has(a)) stat.get(a).recvF += Number(w.amount) || 0;
        if (b != null && stat.has(b)) stat.get(b).sentF += Number(w.amount) || 0;
      });
    });
    D.tn = { stat, pair, total, get: (a, b) => pair.get(key(a, b)) || 0, pk: (s) => s.partners.size + s.formerP.size };
    return D.tn;
  }
  // Suggest one trade partner: past trade frequency blended with complementary roster needs (thin at a position vs. deep there).
  function tnSuggest(me, tn, model){
    const others = D.ids.filter(r => r !== me);
    const maxF = Math.max(1, ...others.map(r => tn.get(me, r)));
    const A = team(me).name;
    let best = null;
    others.forEach(pid => {
      const f = tn.get(me, pid);
      let comp = 0, get = { v: 0, pos: null }, give = { v: 0, pos: null };
      const a = model && model.teams.get(me), b = model && model.teams.get(pid);
      if (a && b) model.POS.forEach(ps => {
        const x = Math.max(0, a.need[ps]) * Math.max(0, -b.need[ps]), y = Math.max(0, b.need[ps]) * Math.max(0, -a.need[ps]);
        comp += x + y;
        if (x > get.v) get = { v: x, pos: ps };
        if (y > give.v) give = { v: y, pos: ps };
      });
      const compN = Math.min(1, comp / 0.2);
      const score = model ? 0.6 * compN + 0.4 * (f / maxF) : f / maxF;
      if (!best || score > best.score) best = { pid, f, score, get, give };
    });
    if (!best || best.score <= 0) return null;
    const B = team(best.pid).name, f = best.f, g = best.get, v = best.give;
    const freq = f ? `, and they’ve traded ${f} time${f === 1 ? '' : 's'} before` : '';
    let reason, pos = '';
    if (g.v >= 0.01 && g.v >= v.v) { reason = `${A} is thin at ${g.pos} and ${B} is deep there${freq}.`; pos = g.pos; }
    else if (v.v >= 0.01) { reason = `${A} is deep at ${v.pos} where ${B} is thin${freq}.`; }
    else if (f) reason = `${A} and ${B} have traded ${f} time${f === 1 ? '' : 's'} before.`;
    else reason = `${B} is the closest roster fit for ${A}.`;
    return { pid: best.pid, reason, pos, score: best.score };
  }
  function tnGraph(tn, sel){
    const W = 800, H = 660, cx = 400, cy = 330, R = 235, nr = 26;
    const ids = D.ids.slice().sort((a, b) => team(a).name.localeCompare(team(b).name));
    const at = new Map(ids.map((r, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / ids.length; return [r, { x: cx + R * Math.cos(a), y: cy + R * Math.sin(a), a }]; }));
    let maxN = 0; tn.pair.forEach(v => { maxN = Math.max(maxN, v); });
    let edges = '', badges = '';
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = ids[i], b = ids[j], n = tn.get(a, b); if (!n) continue;
      const pa = at.get(a), pb = at.get(b), inc = sel && (a === sel || b === sel);
      edges += `<line class="tn-e${inc ? ' on' : sel ? ' off' : ''}" x1="${pa.x.toFixed(1)}" y1="${pa.y.toFixed(1)}" x2="${pb.x.toFixed(1)}" y2="${pb.y.toFixed(1)}" stroke-width="${Math.min(16, 1.5 + n * 2.5)}"><title>${esc(team(a).name)} and ${esc(team(b).name)}: ${n} trade${n === 1 ? '' : 's'}</title></line>`;
      if (inc) { const from = a === sel ? pa : pb, to = a === sel ? pb : pa, bx = from.x + (to.x - from.x) * 0.45, by = from.y + (to.y - from.y) * 0.45; badges += `<g class="tn-bd"><circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="11"/><text x="${bx.toFixed(1)}" y="${(by + 4).toFixed(1)}" text-anchor="middle">${n}</text></g>`; }
    }
    const linked = new Set(sel ? [...tn.stat.get(sel).partners.keys(), sel] : []);
    const nodes = ids.map(r => {
      const q = at.get(r), t = team(r), cs = Math.cos(q.a), sn = Math.sin(q.a);
      const lx = cx + (R + nr + 9) * cs, ly = cy + (R + nr + 9) * sn + (sn > 0.3 ? 12 : sn < -0.3 ? -3 : 4);
      const anchor = cs > 0.3 ? 'start' : cs < -0.3 ? 'end' : 'middle';

      return `<g class="tn-node${r === sel ? ' sel' : ''}${sel && !linked.has(r) ? ' dim' : ''}" data-tn-pick="${r}" role="button" tabindex="0" aria-label="${esc(t.name)}, ${tn.stat.get(r).n} trades" aria-pressed="${r === sel}">
        <clipPath id="tnc${r}"><circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${nr}"/></clipPath>
        <circle class="tn-nc" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${nr}"/><text class="tn-ini" x="${q.x.toFixed(1)}" y="${(q.y + 4).toFixed(1)}" text-anchor="middle">${ini}</text>
        ${t.avatar ? `<image href="${esc(t.avatar)}" x="${(q.x - nr).toFixed(1)}" y="${(q.y - nr).toFixed(1)}" width="${nr * 2}" height="${nr * 2}" clip-path="url(#tnc${r})" preserveAspectRatio="xMidYMid slice" onerror="this.remove()"/>` : ''}
        <circle class="tn-ring" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${nr}"/>
        <text class="tn-lab" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}">${esc(nm)}</text></g>`;
    }).join('');
    return `<svg class="tn-svg" viewBox="55 30 690 600" role="group" aria-label="Trade network graph. Select a manager to see their trades.">${edges}${badges}${nodes}</svg>`;
  }
  function tnMatrix(tn, sel){
    const ids = D.ids.slice().sort((a, b) => team(a).name.localeCompare(team(b).name));

  function tnList(tn, sel){
    const ids = D.ids.slice().sort((a, b) => tn.stat.get(b).n - tn.stat.get(a).n || team(a).name.localeCompare(team(b).name));

  async function loadJourney(){

  // One player's stops in order, plus drop markers, from his event log.
  function jmPath(pid){
    const evs = (D.jm.holder.log.get(pid) || []).slice().sort((a, b) => (a.ts - b.ts) || (a.ord - b.ord));
    const stops = [], items = [];
    let cur = null;
    evs.forEach(e => {
      if (e.how === 'drop') {
        if (cur && !cur.end && cur.owner === e.from) { cur.end = e.ts; items.push({ kind: 'drop', from: e.from, ts: e.ts, week: e.week, season: e.season }); }
        return;

      if (cur && !cur.end) cur.end = e.ts;

    });
