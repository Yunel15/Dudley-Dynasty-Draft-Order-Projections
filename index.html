    const last = String(info.nm).trim().split(/\s+/).slice(-1)[0].replace(/[^A-Za-z'’-]/g, '').toLowerCase();
    if (last.length < 3 || /^(jr|sr|ii|iii|iv)$/.test(last)) return;
    const all = await fetchClips(info, w);
    const hits = all.filter(h => ((h.title || '') + ' ' + (h.description || '')).toLowerCase().includes(last))
      .sort((a, b) => (a.type === 'VERIFIED' ? 0 : 1) - (b.type === 'VERIFIED' ? 0 : 1)).slice(0, 4);
    if (!hits.length || !block.isConnected) return;
    slot.innerHTML = '<div class="bkclipt">Clips</div>' + hits.map(h => {
      const u = /^https:\/\//.test(h.url || '') ? h.url : (/^https:\/\//.test(h.embedUrl || '') ? h.embedUrl : '');
      return u ? `<a class="bkvid" href="${esc(u)}" target="_blank" rel="noopener noreferrer">▶ ${esc(h.title || 'Watch clip')}</a>` : '';
    }).join('');
  }

  async function toggleBreakdown(btn){
    const pid = btn.dataset.pid, w = Number(btn.dataset.w), pts = Number(btn.dataset.pts) || 0;
    const row = btn.closest('tr') && btn.closest('tr').nextElementSibling;
    if (!row || !row.classList.contains('bk')) return;
    const holder = row.firstElementChild;
    const existing = [...holder.children].find(c => c.dataset.bk === pid);
    if (existing) { existing.remove(); row.hidden = !holder.children.length; return; }
    const block = document.createElement('div');
    block.className = 'bkblock';
    block.dataset.bk = pid;
    block.innerHTML = '<p class="bknote">Loading scoring…</p>';
    holder.appendChild(block);
    row.hidden = false;
    const stats = await fetchStats(w);
    block.innerHTML = breakdownHtml(pid, w, pts, stats);
    showClips(block, pid, w);
  }

  // ---------- Matchups ----------
  function renderMatchups(){
    const w = opts.week || D.defWeek;
    const { start, lastWeek } = D.playoff;
    const weekOpts = [];
    for (let i = D.startWeek; i <= lastWeek; i++) weekOpts.push(`<option value="${i}" ${i === w ? 'selected' : ''}>Week ${i}${i >= start ? ' (playoffs)' : ''}</option>`);
    let html = `<div class="controls">
      <button class="btn ghost" type="button" data-week-step="-1" ${w <= D.startWeek ? 'disabled' : ''} aria-label="Previous week">‹</button>
      <label class="field">Week<select data-opt="week">${weekOpts.join('')}</select></label>
      <button class="btn ghost" type="button" data-week-step="1" ${w >= lastWeek ? 'disabled' : ''} aria-label="Next week">›</button>
    </div>`;
    if (!D.weekData.has(w)) {
      if (!D.weekLoading.has(w)) fetchWeek(w).then(() => { if (opts.tab === 'match') render(); });
      return html + '<p class="status">Loading matchups…</p>';
    }
    const list = D.weekData.get(w);
    const groups = new Map();
    list.forEach(m => { if (m.matchup_id == null) return; if (!groups.has(m.matchup_id)) groups.set(m.matchup_id, []); groups.get(m.matchup_id).push(m); });
    const pairs = [...groups.entries()].sort((a, b) => a[0] - b[0]).map(e => { e[1].mid = e[0]; return e[1]; }).filter(g => g.length === 2);
    if (!pairs.length) {
      return html + `<p class="note">${w >= start ? 'Playoff matchups for this week aren’t set yet.' : 'No matchups are scheduled for this week.'}</p>`;
    }
    const anyPts = list.some(m => (m.points || 0) > 0);
    const done = w < D.firstOpen;
    const open = D.openMatch && D.openMatch.w === w ? pairs.find(g => g.mid === D.openMatch.id) : null;
    if (open) html += `<div class="msingle"><button class="btn ghost mback" type="button" data-close-match>‹ All matchups</button>`;
    else html += `<p class="note">${done ? 'Final scores.' : anyPts ? 'Live scores. Tap Refresh to update.' : 'Upcoming. Scores appear once games start.'} Tap a matchup to open it full screen. Tap a player’s name for his profile, or his points to see how they were scored.</p>`;
    html += open ? '<div class="mlist single">' : '<div class="mlist">';
    const slots = (D.league.roster_positions || []).filter(p => !['BN', 'IR', 'TAXI'].includes(p));
    const ids = [];
    pairs.forEach(g => g.forEach(m => (m.starters || []).forEach(id => ids.push(id))));
    (open ? [open] : pairs).forEach(g => {
      const [a, b] = g;
      const pa = a.points || 0, pb = b.points || 0;
      const winA = anyPts && pa > pb, winB = anyPts && pb > pa;
      const row = (m, pts, win) => {
        const t = team(m.roster_id);
        return `<div class="mteam${win ? ' win' : ''}"${open ? '' : ` data-open-match="${g.mid}" role="button" tabindex="0"`}>${teamBlock(t, `${record(t)}`)}<span class="mscore">${anyPts ? pts.toFixed(2) : '–'}</span></div>`;
      };
      let lineup = '';
      const n = Math.max(slots.length, (a.starters || []).length, (b.starters || []).length);
      for (let i = 0; i < n; i++) {
        const cell = (m, side) => {
          const id = (m.starters || [])[i];
          const pts = ((m.starters_points || [])[i]) || 0;
          if (!id || id === '0') return side === 'l' ? '<td class="pl empty">Empty</td><td class="pp">0.00</td>' : '<td class="pp">0.00</td><td class="pl empty">Empty</td>';
          const info = pname(id);
          const inner = info ? `${shot(id, info.pos, info.tm, info.nm)}<span class="plt">${esc(info.nm)}<small>${esc([info.pos, info.tm].filter(Boolean).join(', '))}</small></span>` : '<span class="asset-sub">Loading…</span>';
          const label = `<button type="button" class="plbtn${side === 'r' ? ' plr' : ''}" data-player="${esc(id)}" title="Player profile">${inner}</button>`;
          const ptsB = `<button type="button" class="ppbtn" data-pid="${esc(id)}" data-pts="${pts}" data-w="${w}" title="How these points were scored">${pts.toFixed(2)}</button>`;
          return side === 'l' ? `<td class="pl">${label}</td><td class="pp">${ptsB}</td>` : `<td class="pp">${ptsB}</td><td class="pl">${label}</td>`;
        };
        lineup += `<tr>${cell(a, 'l')}<td class="slot">${esc(SLOT[slots[i]] || slots[i] || '')}</td>${cell(b, 'r')}</tr><tr class="bk" hidden><td colspan="5"></td></tr>`;
      }
      const ta = team(a.roster_id), tb = team(b.roster_id);
      const thead = `<thead><tr><th class="lh" colspan="2">${esc(ta.name)}<small>${anyPts ? pa.toFixed(2) : '–'}</small></th><th class="lh slot">vs</th><th class="lh r" colspan="2">${esc(tb.name)}<small>${anyPts ? pb.toFixed(2) : '–'}</small></th></tr></thead>`;
      const table = `<div class="lwrap"><table class="ltable">${thead}<tbody>${lineup}</tbody></table></div>`;
      const side = (t, pts, win, cls) => `<div class="mside ${cls}${win ? ' win' : ''}">${avatar(t)}<div class="mname">${esc(t.name)}</div><div class="tmeta">${record(t)}</div><div class="mscore">${anyPts ? pts.toFixed(2) : '–'}</div></div>`;
      const bigHead = `<div class="mhead">${side(ta, pa, winA, 'l')}<div class="mvs">vs</div>${side(tb, pb, winB, 'r')}</div>`;
      const tableOpen = `<div class="lwrap"><table class="ltable"><tbody>${lineup}</tbody></table></div>`;
      html += `<article class="mcard" data-card="${g.mid}">${open ? bigHead : row(a, pa, winA) + row(b, pb, winB)}
        ${open ? `<button type="button" class="lutoggle open" data-close-match aria-expanded="true"><span class="lucar">▸</span> Lineups</button>${tableOpen}` : `<button type="button" class="lutoggle" data-open-match="${g.mid}" aria-expanded="false"><span class="lucar">▸</span> Lineups</button>`}</article>`;
    });
    html += open ? '</div></div>' : '</div>';
    ensureNames(ids);
    return html;
  }

  // Smoothly grow a matchup card into the centered full-screen view (and shrink it back).
  function morphMatch(id, opening){
    const card = document.querySelector(`[data-card="${id}"]`);
    const r0 = card ? card.getBoundingClientRect() : null;
    D.openMatch = opening ? { w: opts.week || D.defWeek, id } : null;
    render();
    const to = document.querySelector(`[data-card="${id}"]`);
    if (!to) { window.scrollTo(0, 0); return; }
    const pre = to.getBoundingClientRect();
    const top = opening ? window.scrollY + pre.top - 80 : window.scrollY + pre.top - Math.max(40, (window.innerHeight - pre.height) / 2);
    window.scrollTo(0, Math.max(0, top));
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!r0 || reduce || !to.animate) return;
    const r1 = to.getBoundingClientRect();
    const ease = 'cubic-bezier(.22,.9,.3,1)', dur = 460;
    to.style.overflow = 'hidden';
    const a = to.animate([
      { transform: `translate(${r0.left - r1.left}px, ${r0.top - r1.top}px)`, width: r0.width + 'px', height: r0.height + 'px' },
      { transform: 'translate(0, 0)', width: r1.width + 'px', height: r1.height + 'px' }
    ], { duration: dur, easing: ease });
    a.onfinish = a.oncancel = () => { to.style.overflow = ''; };
    const inner = to.querySelector('.lwrap, .mhead');
    if (opening && inner) to.querySelectorAll('.lwrap, .mhead').forEach(el => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur * 0.8, delay: dur * 0.2, easing: 'ease-out', fill: 'backwards' }));
    const car = to.querySelector('.lucar');
    if (car) car.animate(opening ? [{ transform: 'rotate(0deg)' }, { transform: 'rotate(90deg)' }] : [{ transform: 'rotate(90deg)' }, { transform: 'rotate(0deg)' }], { duration: dur * 0.8, easing: ease });
  }

  // ---------- Playoff bracket ----------
  function seedOrder(){
    const pct = r => { const t = team(r), g = t.wins + t.losses + t.ties; return g ? (t.wins + 0.5 * t.ties) / g : 0; };
    return D.ids.slice().sort((a, b) => (pct(b) - pct(a)) || (team(b).pf - team(a).pf) || (a - b));
  }
  function projectedBracket(seeds, n){
    const s = i => seeds[i - 1];
    if (n === 4) return [
      { r: 1, m: 1, t1: s(1), t2: s(4) }, { r: 1, m: 2, t1: s(2), t2: s(3) },
      { r: 2, m: 3, t1_from: { w: 1 }, t2_from: { w: 2 }, p: 1 }, { r: 2, m: 4, t1_from: { l: 1 }, t2_from: { l: 2 }, p: 3 }];
    if (n === 6) return [
      { r: 1, m: 1, t1: s(3), t2: s(6) }, { r: 1, m: 2, t1: s(4), t2: s(5) },
      { r: 2, m: 3, t1: s(1), t2_from: { w: 2 } }, { r: 2, m: 4, t1: s(2), t2_from: { w: 1 } },
      { r: 3, m: 5, t1_from: { w: 3 }, t2_from: { w: 4 }, p: 1 }, { r: 3, m: 6, t1_from: { l: 3 }, t2_from: { l: 4 }, p: 3 }];
    if (n === 8) return [
      { r: 1, m: 1, t1: s(1), t2: s(8) }, { r: 1, m: 2, t1: s(4), t2: s(5) }, { r: 1, m: 3, t1: s(2), t2: s(7) }, { r: 1, m: 4, t1: s(3), t2: s(6) },
      { r: 2, m: 5, t1_from: { w: 1 }, t2_from: { w: 2 } }, { r: 2, m: 6, t1_from: { w: 3 }, t2_from: { w: 4 } },
      { r: 3, m: 7, t1_from: { w: 5 }, t2_from: { w: 6 }, p: 1 }, { r: 3, m: 8, t1_from: { l: 5 }, t2_from: { l: 6 }, p: 3 }];
    return null;
  }
  function roundWeeks(r, finalR){
    const { start, type } = D.playoff;
    if (type === 2) return [start + 2 * (r - 1), start + 2 * (r - 1) + 1];
    if (type === 1 && r === finalR) return [start + r - 1, start + r];
    return [start + r - 1];
  }
  async function loadBracket(){
    if (!D || D.bracket || D.bracketLoading) return;
    const myD = D;
    myD.bracketLoading = true;
    try {
      const [winners, losers] = await Promise.all([
        getJSON(`/league/${leagueId}/winners_bracket`).catch(() => []),
        getJSON(`/league/${leagueId}/losers_bracket`).catch(() => [])
      ]);
      const all = [...(winners || []), ...(losers || [])];
      const finalR = Math.max(0, ...all.map(b => b.r || 0));
      const scores = new Map();
      for (let r = 1; r <= finalR; r++) {
        const lists = await Promise.all(roundWeeks(r, finalR).filter(w => w <= 18).map(w => fetchWeek(w)));
        const m = new Map();
        lists.flat().forEach(x => m.set(x.roster_id, (m.get(x.roster_id) || 0) + (x.points || 0)));
        scores.set(r, m);
      }
      myD.bracket = { winners: winners || [], losers: losers || [], scores };
    } catch (e) {
      myD.bracket = { error: e.message || 'Couldn’t load the bracket from Sleeper.' };
    } finally {
      myD.bracketLoading = false;
      if (D === myD && opts.tab === 'bracket') render();
    }
  }
  function renderBracket(){
    if (!D.bracket) { loadBracket(); return '<p class="status">Loading bracket…</p>'; }
    if (D.bracket.error) return `<div class="error"><strong>${esc(D.bracket.error)}</strong><br>Try Refresh.</div>`;
    const side = opts.bracketSide || 'winners';
    const seeds = seedOrder();
    const seedOf = new Map(seeds.map((r, i) => [r, i + 1]));
    let html = `<div class="controls"><div class="seg" role="group">
      <button type="button" data-side="winners" aria-pressed="${side === 'winners'}">Playoffs</button>
      <button type="button" data-side="losers" aria-pressed="${side === 'losers'}">Consolation</button></div></div>`;
    let games = side === 'winners' ? D.bracket.winners : D.bracket.losers;
    let projected = false;
    if (!games.length) {
      if (side === 'losers') return html + '<p class="note">The consolation bracket appears here once the playoffs start.</p>';
      games = projectedBracket(seeds, D.playoff.teams) || [];
      projected = true;
      const n = D.playoff.teams;
      html += `<p class="note">The playoffs haven’t started, so this is the bracket if the season ended today: the top ${n} teams by record, with points for as the tiebreaker. Division winners aren’t accounted for.</p>`;
      if (!games.length) {
        return html + `<ol class="seedlist">${seeds.slice(0, n).map(r => `<li>${teamBlock(team(r), record(team(r)))}</li>`).join('')}</ol>`;
      }
      const out = seeds[n];
      if (out) html += `<p class="note">First team out: ${esc(team(out).name)} (${record(team(out))}).</p>`;
    } else if (side === 'winners') {
      html += '<p class="note">Seeds are based on final regular-season standings.</p>';
    }
    const finalR = Math.max(...games.map(g => g.r));
    const sc = D.bracket.scores;
    const roundName = r => side === 'losers' ? `Consolation round ${r}` : r === finalR ? 'Finals' : r === finalR - 1 ? 'Semifinals' : r === 1 ? 'First round' : `Round ${r}`;
    const gameName = g => g.p === 1 ? (side === 'losers' ? 'Consolation final' : 'Championship') : g.p ? `${ordinal(g.p)} place game` : `Game ${g.m}`;
    html += '<div class="bracket">';
    for (let r = 1; r <= finalR; r++) {
      const inRound = games.filter(g => g.r === r).sort((a, b) => (a.p || 0) - (b.p || 0) || a.m - b.m);
      const rs = !projected && sc.get(r);
      const showScores = rs && [...rs.values()].some(v => v > 0);
      html += `<section class="bcol"><h3>${roundName(r)}</h3><div class="bgames">`;
      inRound.forEach(g => {
        const slot = (rid, from) => {
          if (rid == null) {
            const txt = from ? `${from.w != null ? 'Winner' : 'Loser'} of game ${from.w ?? from.l}` : 'To be decided';
            return `<div class="bteam tbd"><span class="seed"></span><span class="bname">${txt}</span><span class="bscore"></span></div>`;
          }
          const cls = g.w === rid ? ' win' : g.l === rid ? ' lose' : '';
          const pts = showScores ? (rs.get(rid) || 0).toFixed(2) : '';
          return `<div class="bteam${cls}"><span class="seed">${seedOf.get(rid) || ''}</span><span class="bname">${esc(team(rid).name)}</span><span class="bscore">${pts}</span></div>`;
        };
        html += `<div class="bmatch${g.p === 1 ? ' final' : ''}"><div class="blabel">${gameName(g)}</div>${slot(g.t1, g.t1_from)}${slot(g.t2, g.t2_from)}</div>`;
      });
      html += '</div></section>';
    }
    return html + '</div>';
  }

  // ---------- Payouts ----------
  const usd = (x, cents) => (x < 0 ? '−$' : '$') + Math.abs(x).toFixed(cents ? 2 : 0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  async function loadMoney(){
    if (!D || D.money || D.moneyLoading) return;
    const myD = D;
    myD.moneyLoading = true;
    try {
      const hist = await loadHistory();
      const M = new Map();
      const current = {};
      hist.forEach(L => {
        const keyOf = new Map();
        const ub = new Map(L.users.map(u => [u.user_id, u]));
        L.rosters.forEach(r => {
          const k = r.owner_id || `${L.id}-${r.roster_id}`;
          keyOf.set(r.roster_id, k);
          if (!M.has(k)) M.set(k, { seasons: new Set(), won: 0, wins: {}, latest: null, current: false });
          const m = M.get(k);
          m.seasons.add(L.season);
          if (L.current) m.current = true;
          if (!m.latest || L.season >= m.latest.season) {
            const t = L.teamOf(r.roster_id), u = ub.get(r.owner_id) || {};
            m.latest = { season: L.season, name: t.name, avatar: t.avatar, manager: u.display_name || t.manager || '' };
          }
        });
        const pay = (rid, key) => {
          const k = keyOf.get(rid), p = PAYOUTS.find(x => x.key === key);
          if (!k || !p) return;
          const m = M.get(k);
          m.won += p.amount;
          m.wins[key] = (m.wins[key] || 0) + 1;
          if (L.current) current[key] = rid;
        };
        (L.bracket || []).forEach(b => {
          if (b.w == null || b.l == null) return;
          if (b.p === 1) { pay(b.w, 'champ'); pay(b.l, 'runner'); }
          if (b.p === 3) pay(b.w, 'third');
        });
        const regDone = L.current ? seasonDone() : true;
        if (regDone && L.rosters.length) {
          const pf = r => { const st = r.settings || {}; return (st.fpts || 0) + (st.fpts_decimal || 0) / 100; };
          const top = L.rosters.slice().sort((a, b) => pf(b) - pf(a))[0];
          if (top && pf(top) > 0) pay(top.roster_id, 'pts');
        }
      });
      const list = [...M.values()].filter(m => m.latest).map(m => ({ ...m, paid: m.seasons.size * BUY_IN }))
        .sort((a, b) => (b.won - b.paid) - (a.won - a.paid) || (b.current - a.current));
      myD.money = { list, current, seasons: hist.length };
    } catch (e) {
      myD.money = { error: e.message || 'Couldn’t load league history from Sleeper.' };
    } finally {
      myD.moneyLoading = false;
      if (D === myD && opts.tab === 'pay') render();
    }
  }

  function renderPayouts(){
    const n = D.ids.length;
    const pot = BUY_IN * n;
    const S = D.sim;
    const idx = new Map(D.ids.map((r, i) => [r, i]));
    if (!D.money) loadMoney();
    const money = D.money && !D.money.error ? D.money : null;
    const cur = money ? money.current : {};
    const pct = p => p >= 0.995 ? '>99%' : p < 0.005 ? '<1%' : Math.round(p * 100) + '%';
    const oddsKey = { champ: 'champ', runner: 'runner', third: 'third', pts: 'ptsLead' };

    let html = `<section class="pot"><div class="potnum">${usd(pot)}</div><div class="pottxt">
      <b>${D.season} prize pool</b><span>${usd(BUY_IN)} buy-in per team × ${n} teams, due by the start of each season. All funds are collected and held by the Commissioner.</span></div></section>`;

    html += '<div class="paygrid">';
    PAYOUTS.forEach(p => {
      let status;
      if (cur[p.key] != null) {
        status = `<div class="paywho won">${teamBlock(team(cur[p.key]), `${D.season} winner`)}</div>`;
      } else if (p.key === 'pts' && !seasonDone()) {
        const leader = D.ids.slice().sort((a, b) => team(b).pf - team(a).pf)[0];
        const fav = D.ids.slice().sort((a, b) => S.ptsLead[idx.get(b)] - S.ptsLead[idx.get(a)])[0];
        status = `<div class="paywho">${teamBlock(team(leader), `Leading now with ${pfTxt(team(leader))} PF`)}</div>
          ${fav !== leader ? `<div class="payodds">Most likely to finish first: ${esc(team(fav).name)} (${pct(S.ptsLead[idx.get(fav)])})</div>` : `<div class="payodds">${pct(S.ptsLead[idx.get(leader)])} chance to hold on</div>`}`;
      } else if (S.bracketOK || p.key === 'pts') {
        const arr = S[oddsKey[p.key]];
        const fav = D.ids.slice().sort((a, b) => arr[idx.get(b)] - arr[idx.get(a)])[0];
        status = `<div class="paywho">${teamBlock(team(fav), `Favorite, ${pct(arr[idx.get(fav)])}`)}</div>`;
      } else {
        status = '<div class="payodds">To be decided</div>';
      }
      html += `<article class="paycard${cur[p.key] != null ? ' decided' : ''}"><div class="payhead"><span class="payamt">${usd(p.amount)}</span><span class="paypct">${p.pct}% of pot</span></div>
        <h3>${p.label}</h3>${status}</article>`;
    });
    html += '</div>';

    // Projected winnings for the current season
    if (S.bracketOK) {
      const decided = k => cur[k] != null;
      const ev = D.ids.map(rid => {
        const i = idx.get(rid);
        let e = 0, cash = 0;
        PAYOUTS.forEach(p => {
          const prob = decided(p.key) ? (cur[p.key] === rid ? 1 : 0) : S[oddsKey[p.key]][i];
          e += prob * p.amount;
        });
        const champish = decided('champ') ? (cur.champ === rid || cur.runner === rid ? 1 : 0) : S.finals[i];
        const thirdP = decided('third') ? (cur.third === rid ? 1 : 0) : S.third[i];
        const ptsP = decided('pts') ? (cur.pts === rid ? 1 : 0) : S.ptsLead[i];
        cash = 1 - (1 - champish) * (1 - thirdP) * (1 - ptsP);
        return { rid, e, cash: Math.min(1, cash) };
      }).sort((a, b) => b.e - a.e);
      html += `<h2 class="sech">Projected ${D.season} winnings</h2>
        <p class="note">Each team’s expected payout, based on the Playoff Odds simulations. Net subtracts the ${usd(BUY_IN)} buy-in.</p>
        <div class="tablewrap"><table><thead><tr><th class="tl" scope="col">Team</th><th scope="col">Record</th><th scope="col">Chance to cash</th><th scope="col">Expected payout</th><th scope="col">Expected net</th></tr></thead><tbody>
        ${ev.map(x => `<tr><td class="tl">${teamBlock(team(x.rid), '')}</td><td>${record(team(x.rid))}</td><td>${pct(x.cash)}</td>
          <td class="avgp">${usd(x.e, true)}</td><td class="${x.e - BUY_IN >= 0 ? 'pos' : 'neg'}">${usd(x.e - BUY_IN, true)}</td></tr>`).join('')}
        </tbody></table></div>`;
    }

    // All-time money list
    html += `<h2 class="sech">All-time money list</h2>`;
    if (!D.money) return html + '<p class="status">Loading league history…</p>';
    if (D.money.error) return html + `<div class="error"><strong>${esc(D.money.error)}</strong><br>Try Refresh.</div>`;
    html += `<p class="note">Winnings from payouts that have been decided, across ${money.seasons} season${money.seasons === 1 ? '' : 's'}. Buy-ins paid counts ${usd(BUY_IN)} for every season a manager has played, including this one. Uses the current payout structure for every season.</p>
      <div class="tablewrap"><table><thead><tr><th class="tl" scope="col">Manager</th><th scope="col">Seasons</th><th scope="col">Won</th><th scope="col">Buy-ins paid</th><th scope="col">Net</th><th scope="col">Payouts</th></tr></thead><tbody>`;
    money.list.forEach(m => {
      const net = m.won - m.paid;
      const tags = PAYOUTS.filter(p => m.wins[p.key]).map(p => `${p.label}${m.wins[p.key] > 1 ? ' ×' + m.wins[p.key] : ''}`).join(', ') || '–';
      html += `<tr><td class="tl">${teamBlock(m.latest, esc(m.latest.manager) + (m.current ? '' : ', former'))}</td><td>${m.seasons.size}</td><td>${usd(m.won)}</td><td>${usd(m.paid)}</td>
        <td class="avgp ${net >= 0 ? 'pos' : 'neg'}">${usd(net)}</td><td class="tags">${esc(tags)}</td></tr>`;
    });
    return html + '</tbody></table></div>';
  }

  // ---------- Team construction ----------
  const POS_ORDER = ['QB', 'RB', 'WR', 'TE', 'K', 'DL', 'LB', 'DB'];

  async function playerInfoFor(ids){
    let cache = {};
    try { cache = JSON.parse(store.get('playerInfo') || '{}'); } catch (e) {}
    const missing = ids.filter(id => !cache[id] || cache[id].ye === undefined);
    if (missing.length) {
      const all = await getJSON('/players/nfl');
      missing.forEach(id => {
        const p = all[id];
        if (!p) return;
        cache[id] = {
          n: p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || id,
          pos: p.position || '', t: p.team || '', b: p.birth_date || '',
          a: typeof p.age === 'number' ? p.age : null,
          ry: Number(p.rookie_year) || null, ye: typeof p.years_exp === 'number' ? p.years_exp : null
        };
      });
      store.set('playerInfo', JSON.stringify(cache));
    }
    return cache;
  }
  const ageOf = p => {
    if (p.b) { const t = Date.parse(p.b); if (!isNaN(t)) return (Date.now() - t) / 31557600000; }
    return p.a;
  };
  const durTxt = ms => {
    const d = Math.max(0, Math.floor(ms / 86400000));
    if (d < 14) return `${d} day${d === 1 ? '' : 's'}`;
    if (d < 60) return `${Math.floor(d / 7)} weeks`;
    if (d < 730) return `${Math.round(d / 30.4)} months`;
    return `${(d / 365.25).toFixed(1)} years`;
  };

  // Who has held each player the longest, from draft picks and transactions across every season
  async function loadAcquisitions(hist){
    const holder = new Map(), log = new Map();
    const oldest = hist.length ? hist[hist.length - 1].season : null;
    const note = (pid, e) => { if (!log.has(pid)) log.set(pid, []); log.get(pid).push(e); };
    for (const L of hist.slice().reverse()) {
      const ownerOfRid = new Map(L.rosters.map(r => [r.roster_id, r.owner_id || `${L.id}-${r.roster_id}`]));
      const ev = [];
      const drafts = await getJSON(`/league/${L.id}/drafts`).catch(() => []);
      for (const d of (Array.isArray(drafts) ? drafts : [])) {
        const picks = await getJSON(`/draft/${d.draft_id}/picks`).catch(() => []);
        const ts = d.last_picked || d.start_time || 0;
        const dName = `${d.season || L.season} ${String(d.season || L.season) === String(oldest) ? 'startup' : 'rookie'} draft`;
        const teamsN = (d.settings && d.settings.teams) || L.rosters.length || 12;
        (Array.isArray(picks) ? picks : []).forEach(pk => {
          if (!pk.player_id || !ownerOfRid.has(pk.roster_id)) return;
          const owner = ownerOfRid.get(pk.roster_id);
          ev.push({ ts, ord: pk.pick_no || 0, kind: 'add', pid: pk.player_id, owner });
          const slot = pk.draft_slot || (((pk.pick_no || 1) - 1) % teamsN) + 1;
          note(pk.player_id, { ts, ord: pk.pick_no || 0, how: 'draft', to: owner, draft: dName, round: pk.round, slot, no: pk.pick_no });
        });
      }
      const weeks = await Promise.all([...Array(19).keys()].map(w => getJSON(`/league/${L.id}/transactions/${w}`).catch(() => [])));
      weeks.forEach(list => (Array.isArray(list) ? list : []).forEach(t => {
        if (!t || t.status !== 'complete') return;
        const ts = t.status_updated || t.created || 0;
        Object.entries(t.adds || {}).forEach(([pid, rid]) => { if (ownerOfRid.has(rid)) ev.push({ ts, ord: 0, kind: 'add', pid, owner: ownerOfRid.get(rid) }); });
        const how = t.type === 'trade' ? 'trade' : t.type === 'waiver' ? 'waiver' : t.type === 'free_agent' ? 'fa' : 'commish';
        Object.entries(t.adds || {}).forEach(([pid, rid]) => {
          if (!ownerOfRid.has(rid)) return;
          const fromRid = (t.drops || {})[pid];
          note(pid, { ts, ord: 1, how, to: ownerOfRid.get(rid), from: fromRid != null && ownerOfRid.has(fromRid) ? ownerOfRid.get(fromRid) : null, bid: Number((t.settings || {}).waiver_bid) || 0, week: t.leg, season: L.season });
        });
        if (t.type !== 'trade') Object.entries(t.drops || {}).forEach(([pid, rid]) => {
          if (ownerOfRid.has(rid)) note(pid, { ts, ord: 0, how: 'drop', from: ownerOfRid.get(rid), week: t.leg, season: L.season });
        });
        Object.entries(t.drops || {}).forEach(([pid, rid]) => { if (ownerOfRid.has(rid)) ev.push({ ts, ord: 0, kind: 'drop', pid, owner: ownerOfRid.get(rid) }); });
      }));
      ev.sort((a, b) => (a.ts - b.ts) || (a.kind === b.kind ? 0 : a.kind === 'drop' ? -1 : 1) || (a.ord - b.ord));
      ev.forEach(e => {
        if (e.kind === 'add') holder.set(e.pid, { owner: e.owner, ts: e.ts, ord: e.ord });
        else { const h = holder.get(e.pid); if (h && h.owner === e.owner) holder.delete(e.pid); }
      });
    }
    log.forEach(list => list.sort((a, b) => (a.ts - b.ts) || (a.ord - b.ord)));
    holder.log = log;
    return holder;
  }

  async function loadBuild(){
    if (!D || D.build || D.buildLoading) return;
    const myD = D;
    myD.buildLoading = true;
    try {
      const hist = await loadHistory();
      const rosters = (myD.rosters || []).filter(r => r.roster_id != null);
      const ids = [...new Set(rosters.flatMap(r => r.players || []))];
      const [info, holder] = await Promise.all([playerInfoFor(ids), loadAcquisitions(hist).catch(() => new Map())]);
      myD.build = { info, holder, rosters };
    } catch (e) {
      myD.build = { error: e.message || 'Couldn’t load player data from Sleeper.' };
    } finally {
      myD.buildLoading = false;
      if (D === myD && opts.tab === 'build') render();
    }
  }

  function renderBuild(){
    if (!D.build) { loadBuild(); return '<p class="status">Loading rosters and player ages…</p>'; }
    if (D.build.error) return `<div class="error"><strong>${esc(D.build.error)}</strong><br>Try Refresh.</div>`;
    const { info, holder, rosters } = D.build;
    if (!rosters.some(r => (r.players || []).length)) return '<p class="note">Rosters are empty so far. Team construction shows up once teams have players.</p>';

    const teams = rosters.map(r => {
      const players = (r.players || []).map(id => info[id] ? { id, ...info[id] } : null).filter(Boolean);
      const byPos = {};
      let ageSum = 0, ageN = 0;
      players.forEach(p => {
        if (!p.pos || p.pos === 'DEF') return;
        const a = ageOf(p);
        const b = byPos[p.pos] || (byPos[p.pos] = { n: 0, ages: [] });
        b.n++;
        if (a != null) { b.ages.push(a); ageSum += a; ageN++; }
      });
      const nfl = {};
      players.forEach(p => { if (p.pos === 'DEF') return; const k = p.t || 'FA'; nfl[k] = (nfl[k] || 0) + 1; });
      const key = r.owner_id || `${leagueId}-${r.roster_id}`;
      let tenured = null;
      players.forEach(p => {
        const h = holder.get(p.id);
        if (!h || h.owner !== key) return;
        if (!tenured || h.ts < tenured.ts || (h.ts === tenured.ts && h.ord < tenured.ord)) tenured = { p, ts: h.ts, ord: h.ord };
      });
      return { rid: r.roster_id, r, players, byPos, avg: ageN ? ageSum / ageN : null, nfl, tenured };
    }).sort((a, b) => team(a.rid).name.localeCompare(team(b.rid).name));

    const posList = POS_ORDER.filter(pos => teams.some(t => t.byPos[pos] && t.byPos[pos].ages.length));
    const posAvg = (t, pos) => { const b = t.byPos[pos]; return b && b.ages.length ? avg(b.ages) : null; };
    const cmp = {};
    posList.forEach(pos => { cmp[pos] = teams.map(t => posAvg(t, pos)).filter(v => v != null); });
    const allVals = teams.map(t => t.avg).filter(v => v != null);
    const cell = (val, vals) => {
      if (val == null) return '<td>–</td><td>–</td>';
      const r = 1 + vals.filter(v => v < val - 1e-9).length, n = vals.length;
      const cls = n >= 6 ? (r <= 3 ? ' class="pos"' : r > n - 3 ? ' class="neg"' : '') : '';
      return `<td>${val.toFixed(1)}</td><td${cls}>#${r} of ${n}</td>`;
    };

    const sel = teams.some(x => x.rid === opts.buildTeam) ? opts.buildTeam : teams[0].rid;
    const t = teams.find(x => x.rid === sel);
    const tm = team(sel);
    const pmap = new Map(t.players.map(p => [p.id, p]));
    const slots = (D.league.roster_positions || []).filter(x => !['BN', 'IR', 'TAXI'].includes(x));
    const starters = t.r.starters || [];
    const inStart = new Set(starters), inIR = new Set(t.r.reserve || []), inTaxi = new Set(t.r.taxi || []);
    const ownerKey = t.r.owner_id || `${leagueId}-${t.r.roster_id}`;
    const since = id => { const h = holder.get(id); return h && h.owner === ownerKey ? h.ts : null; };
    const posIdx = p => { const i = POS_ORDER.indexOf(p.pos); return i < 0 ? 99 : i; };
    const row = (p, label) => {
      const ts = since(p.id), a = ageOf(p);
      return `<li class="rrow prow-click" role="button" tabindex="0" data-player="${esc(p.id)}" aria-label="Open ${esc(p.n)} game log and history"><span class="pbadge pb-${esc(p.pos || 'X')}">${esc(label)}</span>${shot(p.id, p.pos, p.t, p.n)}
        <div class="rtx"><div class="rname">${esc(p.n)}</div><div class="rsub">${esc([p.pos, p.t || 'FA'].filter(Boolean).join(' · '))} · Age ${a == null ? '–' : a.toFixed(1)}</div></div>
        <span class="rten">${ts ? durTxt(Date.now() - ts) : ''}</span></li>`;
    };
    const group = (title, rowsHtml, n) => n ? `<h3 class="rhead">${title}<small>${n}</small></h3><ul class="rlist2">${rowsHtml}</ul>` : '';

    const nflF = opts.nflFilter && t.nfl[opts.nflFilter] ? opts.nflFilter : null;
    const posF = opts.posFilter && t.byPos[opts.posFilter] ? opts.posFilter : null;
    const matches = p => (!nflF || (p.pos !== 'DEF' && (p.t || 'FA') === nflF)) && (!posF || p.pos === posF);
    const startItems = starters.map((id, i) => ({ id, label: SLOT[slots[i]] || slots[i] || '', p: pmap.get(id) }))
      .filter(x => (nflF || posF) ? (x.p && matches(x.p)) : true);
    const startRows = startItems.map(x => (!x.id || x.id === '0')
      ? `<li class="rrow"><span class="pbadge">${esc(x.label)}</span><span></span><div class="rtx"><div class="rname empty">Empty slot</div></div><span></span></li>`
      : (x.p ? row(x.p, x.label) : '')).join('');
    const bench = t.players.filter(p => !inStart.has(p.id) && !inIR.has(p.id) && !inTaxi.has(p.id) && matches(p))
      .sort((x, y) => posIdx(x) - posIdx(y) || (ageOf(y) ?? 0) - (ageOf(x) ?? 0));
    const irList = t.players.filter(p => inIR.has(p.id) && matches(p)), taxiList = t.players.filter(p => inTaxi.has(p.id) && matches(p));

    const pickOrder = currentOrder(), myPicks = [];
    D.seasons.forEach(y => { for (let rd = 1; rd <= opts.rounds; rd++) D.ids.forEach(orig => { if (ownerOf(y, rd, orig) === sel) myPicks.push({ y, r: rd, orig, slot: y === D.draftSeason ? slotOf(pickOrder, rd, orig) : null }); }); });
    myPicks.sort((a, b) => a.y - b.y || a.r - b.r || (a.slot ?? 0) - (b.slot ?? 0));
    const acqN = myPicks.filter(p => p.orig !== sel).length;
    const pickPop = D.seasons.map(y => { const yi = myPicks.filter(p => p.y === y);
      return `<span class="pp-yr">${y}</span><span class="pp-chips">${yi.length ? yi.map(p => `<span class="chip${p.orig !== sel ? ' acq' : ''}"><b>${p.slot ? pickLabel(p.r, p.slot) : ordinal(p.r)}</b>${p.orig !== sel ? `from ${esc(team(p.orig).name)}` : ''}</span>`).join('') : '<span class="asset-sub">No picks</span>'}</span>`; }).join('');
    const teamOpts = teams.map(x => `<option value="${x.rid}" ${x.rid === sel ? 'selected' : ''}>${esc(team(x.rid).name)}</option>`).join('');
    let html = `<div class="controls"><label class="field">Team<select data-opt="buildTeam">${teamOpts}</select></label></div>
      <p class="note">Ages come from Sleeper’s player database. Age rank compares this team’s average age at a position to the rest of the league: #1 is the youngest, and the three youngest and oldest teams are colored. The time on the right of each player is how long they’ve been on this roster, from draft and transaction history.</p>
      <div class="bsplit">
      <article class="bcard"><header>${teamBlock(tm, `${esc(tm.manager)}${tm.manager ? ', ' : ''}${record(tm)}`)}<span class="count">${t.players.length}<small>players</small></span></header>
        <table class="btable"><thead><tr><th scope="col">Pos</th><th scope="col">Players</th><th scope="col">Avg age</th><th scope="col">Age rank</th></tr></thead><tbody>
        ${posList.map(pos => { const ps = t.players.filter(p => p.pos === pos).sort((a, b) => (ageOf(a) ?? 99) - (ageOf(b) ?? 99));
          const pop = ps.length ? `<span class="pickpop" role="tooltip"><span class="pp-yr">${pos} (${ps.length})</span>${ps.map(p => { const a = ageOf(p); return `<span class="pp-pl"><b>${esc(p.n)}</b><span class="asset-sub">${esc(p.t || 'FA')} · ${a == null ? '–' : a.toFixed(1)}</span></span>`; }).join('')}</span>` : '';
          return `<tr><td>${pos}</td><td>${ps.length ? `<button type="button" class="pickbtn posbtn" data-pos-filter="${pos}" aria-pressed="${posF === pos}" aria-label="Show only ${pos}s on the roster"><b>${ps.length}</b>${pop}</button>` : 0}</td>${cell(posAvg(t, pos), cmp[pos])}</tr>`; }).join('')}
        <tr class="all"><td>All</td><td>${t.players.filter(p => p.pos !== 'DEF').length}</td>${cell(t.avg, allVals)}</tr>
        <tr class="prow"><td>Picks</td><td colspan="3"><button type="button" class="pickbtn" data-own-team="${sel}" aria-label="${myPicks.length} draft picks. Open Pick Ownership"><span><b>${myPicks.length}</b> draft pick${myPicks.length === 1 ? '' : 's'}${acqN ? ` <span class="asset-sub">(${acqN} acquired)</span>` : ''}</span><span class="pp-go">View ›</span><span class="pickpop" role="tooltip">${pickPop}</span></button></td></tr></tbody></table>
        <div class="yr">Players per NFL team <span class="asset-sub">(tap one to filter the roster)</span></div><div class="chips">
        ${Object.entries(t.nfl).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([k, n]) =>
          `<button type="button" class="chip chipbtn${n >= 3 ? ' stack' : ''}" data-nfl="${esc(k)}" aria-pressed="${nflF === k}"><b>${esc(k)}</b>${n} player${n === 1 ? '' : 's'}</button>`).join('') || '<span class="tempty">No players</span>'}</div>
        <div class="yr">Longest tenured</div>
        ${t.tenured ? `<div class="tenure"><b>${esc(t.tenured.p.n)}</b> <span class="asset-sub">${esc([t.tenured.p.pos, t.tenured.p.t].filter(Boolean).join(', '))}</span>
          <div class="asset-sub">On this roster since ${new Date(t.tenured.ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })} (${durTxt(Date.now() - t.tenured.ts)})</div></div>`
          : '<div class="tempty">Not available yet</div>'}
      </article>
      <article class="bcard"><h2 class="rtitle">Current roster</h2>${nflF ? `<div class="fbar">Showing <b>${esc(nflF)}</b> players only <button type="button" class="linkbtn" data-nfl="${esc(nflF)}">Clear filter</button></div>` : ''}${posF ? `<div class="fbar">Showing <b>${esc(posF)}</b>s only <button type="button" class="linkbtn" data-pos-filter="${esc(posF)}">Clear filter</button></div>` : ''}
        ${group('Starters', startRows, startItems.length)}${group('Bench', bench.map(p => row(p, p.pos || '')).join(''), bench.length)}
        ${group('Injured reserve', irList.map(p => row(p, p.pos || '')).join(''), irList.length)}${group('Taxi squad', taxiList.map(p => row(p, p.pos || '')).join(''), taxiList.length)}
      </article></div>`;
    return html;
  }

  // ---------- League history (shared) ----------
  function loadHistory(){
    if (D.historyPromise) return D.historyPromise;
    const myD = D;
    const avatarOf = u => {
      const md = (u && u.metadata) || {};
      if (md.avatar && /^https?:\/\//.test(md.avatar)) return md.avatar;
      return u && u.avatar ? `https://sleepercdn.com/avatars/thumbs/${u.avatar}` : null;
    };
    myD.historyPromise = (async () => {
      const out = [];
      const curBracket = await getJSON(`/league/${leagueId}/winners_bracket`).catch(() => null);
      out.push({ id: leagueId, season: myD.season, current: true, league: myD.league, rosters: myD.rosters || [], users: myD.users || [],
        weeks: myD.completedWeeks, bracket: curBracket || [], teamOf: rid => team(rid) });
      let prev = myD.league.previous_league_id, guard = 0;
      while (prev && prev !== '0' && guard++ < 15) {
        const [lg, ros, us, br] = await Promise.all([
          getJSON(`/league/${prev}`), getJSON(`/league/${prev}/rosters`), getJSON(`/league/${prev}/users`),
          getJSON(`/league/${prev}/winners_bracket`).catch(() => null)
        ]);
        if (!lg) break;
        const ub = new Map((us || []).map(u => [u.user_id, u]));
        const tm = new Map((ros || []).map(r => {
          const u = ub.get(r.owner_id) || {};
          return [r.roster_id, { rid: r.roster_id, name: (u.metadata && u.metadata.team_name) || u.display_name || `Team ${r.roster_id}`, manager: u.display_name || '', avatar: avatarOf(u) }];
        }));
        const st = lg.settings || {};
        const sw = st.start_week || 1, last = (st.playoff_week_start || 15) - 1;
        const ws = [];
        for (let w = sw; w <= last; w++) ws.push(w);
        const lists = await Promise.all(ws.map(w => getJSON(`/league/${prev}/matchups/${w}`).catch(() => [])));
        out.push({ id: prev, season: Number(lg.season), current: false, league: lg, rosters: ros || [], users: us || [],
          weeks: ws.map((w, i) => ({ week: w, list: lists[i] || [] })), bracket: br || [],
          teamOf: rid => tm.get(rid) || { rid, name: `Team ${rid}`, avatar: null } });
        prev = lg.previous_league_id;
      }
      return out;
    })();
    myD.historyPromise.catch(() => { myD.historyPromise = null; });
    return myD.historyPromise;
  }

  // ---------- Manager profiles ----------
  async function loadProfiles(){
    if (!D || D.profiles || D.profilesLoading) return;
    const myD = D;
    myD.profilesLoading = true;
    try {
      myD.profiles = computeProfiles(await loadHistory());
    } catch (e) {
      myD.profiles = { error: e.message || 'Couldn’t load league history from Sleeper.' };
    } finally {
      myD.profilesLoading = false;
      if (D === myD && opts.tab === 'mgr') render();
    }
  }

  function computeProfiles(hist){
    const M = new Map();
    const currentKeys = new Set();
    const get = k => {
      if (!M.has(k)) M.set(k, { key: k, seasons: new Set(), w: 0, l: 0, t: 0, pf: 0, pa: 0, pw: 0, pl: 0, weeklyTop: 0, trophies: [], latest: null });
      return M.get(k);
    };
    const highs = [], lows = [], seasonPts = [], blowouts = [], closes = [], hiLosses = [], loWins = [], streaks = [];

    hist.forEach(L => {
      const keyOf = new Map();
      const ub = new Map(L.users.map(u => [u.user_id, u]));
      L.rosters.forEach(r => {
        const k = r.owner_id || `${L.id}-${r.roster_id}`;
        keyOf.set(r.roster_id, k);
        if (L.current) currentKeys.add(k);
        const m = get(k), st = r.settings || {};
        m.seasons.add(L.season);
        m.w += st.wins || 0; m.l += st.losses || 0; m.t += st.ties || 0;
        m.pf += (st.fpts || 0) + (st.fpts_decimal || 0) / 100;
        m.pa += (st.fpts_against || 0) + (st.fpts_against_decimal || 0) / 100;
        if (!m.latest || L.season >= m.latest.season) {
          const t = L.teamOf(r.roster_id), u = ub.get(r.owner_id) || {};
          m.latest = { season: L.season, name: t.name, avatar: t.avatar, manager: u.display_name || t.manager || '' };
        }
      });
      const K = rid => keyOf.get(rid);
      const regDone = L.current ? seasonDone() : true;
      const award = (rid, type, detail) => { const k = K(rid); if (k) get(k).trophies.push({ type, season: L.season, detail }); };

      if (regDone && L.rosters.length) {
        const rs = L.rosters.map(r => {
          const st = r.settings || {}, g = (st.wins || 0) + (st.losses || 0) + (st.ties || 0);
          return { rid: r.roster_id, pct: g ? ((st.wins || 0) + 0.5 * (st.ties || 0)) / g : 0, pf: (st.fpts || 0) + (st.fpts_decimal || 0) / 100, rec: `${st.wins || 0}-${st.losses || 0}${st.ties ? '-' + st.ties : ''}` };
        });
        const best = rs.slice().sort((a, b) => b.pct - a.pct || b.pf - a.pf)[0];
        if (best && best.pct > 0) award(best.rid, 'reg', best.rec);
        const pts = rs.slice().sort((a, b) => b.pf - a.pf)[0];
        if (pts && pts.pf > 0) award(pts.rid, 'pts', `${pts.pf.toFixed(1)} pts`);
      }

      (L.bracket || []).forEach(b => {
        if (b.w == null || b.l == null) return;
        if (K(b.w)) get(K(b.w)).pw++;
        if (K(b.l)) get(K(b.l)).pl++;
        if (b.p === 1) { award(b.w, 'champ'); award(b.l, 'runner'); }
        if (b.p === 3) award(b.w, 'third');
      });

      const pf = new Map(), cur = new Map(), bestStreak = new Map();
      L.weeks.slice().sort((a, b) => a.week - b.week).forEach(({ week, list }) => {
        const valid = (list || []).filter(m => typeof m.points === 'number' && K(m.roster_id));
        if (!valid.some(m => m.points > 0)) return;
        const top = Math.max(...valid.map(m => m.points));
        valid.forEach(m => {
          if (m.points === top) get(K(m.roster_id)).weeklyTop++;
          if (m.points > 0) { const rcd = { k: K(m.roster_id), val: m.points, season: L.season, week }; highs.push(rcd); lows.push(rcd); }
          pf.set(m.roster_id, (pf.get(m.roster_id) || 0) + m.points);
        });
        const groups = new Map();
        valid.forEach(m => { if (m.matchup_id == null) return; if (!groups.has(m.matchup_id)) groups.set(m.matchup_id, []); groups.get(m.matchup_id).push(m); });
        groups.forEach(g => {
          if (g.length !== 2) return;
          const [a, b] = g[0].points >= g[1].points ? g : [g[1], g[0]];
          if (a.points === b.points) { cur.set(a.roster_id, 0); cur.set(b.roster_id, 0); return; }
          blowouts.push({ k: K(a.roster_id), val: a.points - b.points, season: L.season, week });
          closes.push({ k: K(a.roster_id), val: a.points - b.points, season: L.season, week });
          hiLosses.push({ k: K(b.roster_id), val: b.points, season: L.season, week });
          loWins.push({ k: K(a.roster_id), val: a.points, season: L.season, week });
          const c = (cur.get(a.roster_id) || 0) + 1;
          cur.set(a.roster_id, c);
          if (c > (bestStreak.get(a.roster_id) || 0)) bestStreak.set(a.roster_id, c);
          cur.set(b.roster_id, 0);
        });
      });
      pf.forEach((v, rid) => seasonPts.push({ k: K(rid), val: v, season: L.season }));
      bestStreak.forEach((v, rid) => streaks.push({ k: K(rid), val: v, season: L.season }));
    });

    const holder = (arr, title, fmt, lowest) => {
      if (!arr.length) return;
      const top = arr.slice().sort((a, b) => lowest ? a.val - b.val : b.val - a.val)[0];
      get(top.k).trophies.push({ type: 'record', title, detail: fmt(top) });
    };
    holder(highs, 'Highest single-week score', x => `${x.val.toFixed(2)}, ${x.season} week ${x.week}`);
    holder(seasonPts, 'Most points in a season', x => `${x.val.toFixed(2)}, ${x.season}`);
    holder(blowouts, 'Biggest blowout', x => `+${x.val.toFixed(2)}, ${x.season} week ${x.week}`);
    holder(streaks, 'Longest win streak', x => `${x.val} straight wins, ${x.season}`);
    holder(lows, 'Lowest single-week score', x => `${x.val.toFixed(2)}, ${x.season} week ${x.week}`, true);
    holder(closes, 'Closest game', x => `Won by ${x.val.toFixed(2)}, ${x.season} week ${x.week}`, true);
    holder(hiLosses, 'Highest score in a loss', x => `${x.val.toFixed(2)}, ${x.season} week ${x.week}`);
    holder(loWins, 'Lowest score in a win', x => `${x.val.toFixed(2)}, ${x.season} week ${x.week}`, true);

    const list = [...M.values()].filter(m => m.latest).map(m => ({ ...m, current: currentKeys.has(m.key),
      champs: m.trophies.filter(t => t.type === 'champ').length,
      pct: (m.w + m.l + m.t) ? (m.w + 0.5 * m.t) / (m.w + m.l + m.t) : 0 }));
    list.sort((a, b) => (b.current - a.current) || (b.champs - a.champs) || (b.pct - a.pct) || (b.pf - a.pf));
    return { list, seasons: hist.length };
  }

  const RECORD_ICONS = {
    'Highest single-week score': '🚀',
    'Most points in a season': '📈',
    'Biggest blowout': '💥',
    'Longest win streak': '⚡',
    'Closest game': '⏱️',
    'Highest score in a loss': '💔',
    'Lowest score in a win': '🍀',
    'Lowest single-week score': '🥶'
  };
  const TROPHIES = [
    ['champ', '🏆', 'League champion'],
    ['runner', '🥈', 'Runner-up'],
    ['third', '🥉', 'Third place'],
    ['reg', '⭐', 'Best regular-season record'],
    ['pts', '🔥', 'Points title']
  ];

  function renderProfiles(){
    if (!D.profiles) {
      loadProfiles();
      return '<p class="status">Loading league history from Sleeper…</p>';
    }
    if (D.profiles.error) return `<div class="error"><strong>${esc(D.profiles.error)}</strong><br>Try Refresh.</div>`;
    let html = `<p class="note">All-time records are regular-season games${seasonDone() ? '' : ', including this season so far'}. Playoff records count winners-bracket games. Season awards are given once a regular season ends, and playoff trophies once the bracket is decided. League record trophies belong to whoever holds that record right now, and they move when a record is broken.</p><div class="pgrid">`;
    D.profiles.list.forEach(m => {
      const n = m.seasons.size;
      const g = m.w + m.l + m.t;
      const pct = g ? m.pct.toFixed(3).replace(/^0/, '') : '.000';
      const meta = `${m.latest.manager ? esc(m.latest.manager) + ', ' : ''}${n} season${n === 1 ? '' : 's'}${m.current ? '' : ', former manager'}`;
      let trophies = '';
      TROPHIES.forEach(([type, icon, label]) => {
        const got = m.trophies.filter(t => t.type === type);
        if (!got.length) return;
        const years = got.map(t => t.detail ? `${t.season} (${t.detail})` : t.season).join(', ');
        trophies += `<li><span class="ticon" aria-hidden="true">${icon}</span><span><b>${label}${got.length > 1 ? ` ×${got.length}` : ''}</b><small>${esc(years)}</small></span></li>`;
      });
      m.trophies.filter(t => t.type === 'record').forEach(t => {
        trophies += `<li><span class="ticon" aria-hidden="true">${RECORD_ICONS[t.title] || '🎖️'}</span><span><b>League record: ${esc(t.title)}</b><small>${esc(t.detail)}</small></span></li>`;
      });
      html += `<article class="pcard">${teamBlock(m.latest, meta)}
        <div class="prec"><span class="pbig">${m.w}-${m.l}${m.t ? '-' + m.t : ''}</span><span class="psub">All-time record<br>${pct} win pct</span></div>
        <dl class="pstats">
          <div><dt>Playoffs</dt><dd>${m.pw}-${m.pl}</dd></div>
          <div><dt>Points for</dt><dd>${m.pf.toFixed(1)}</dd></div>
          <div><dt>Points against</dt><dd>${m.pa.toFixed(1)}</dd></div>
          <div><dt>Per game</dt><dd>${g ? (m.pf / g).toFixed(1) : '0.0'}</dd></div>
          <div><dt>Top score of the week</dt><dd>${m.weeklyTop}×</dd></div>
        </dl>
        <h3 class="tch">Trophy case</h3>
        ${trophies ? `<ul class="trophies">${trophies}</ul>` : '<p class="tempty">Empty for now.</p>'}
      </article>`;
    });
    return html + '</div>';
  }

  // ---------- Trade history ----------
  async function playerNames(ids){
    let cache = {};
    try { cache = JSON.parse(store.get('playerNames') || '{}'); } catch (e) {}
    const missing = ids.filter(id => !cache[id]);
    if (missing.length) {
      try {
        const all = await getJSON('/players/nfl');
        missing.forEach(id => {
          const p = all[id];
          const name = p ? (p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || id) : id;
          cache[id] = [name, p ? (p.position || '') : '', p ? (p.team || '') : ''].join('|');
        });
        store.set('playerNames', JSON.stringify(cache));
      } catch (e) {}
    }
    return cache;
  }

  async function loadTrades(){
    if (!D || D.trades || D.tradesLoading) return;
    const myD = D;
    myD.tradesLoading = true;
    try {
      const leagues = await loadHistory();
      const list = [];
      for (const L of leagues) {
        const weeks = await Promise.all([...Array(19).keys()].map(w => getJSON(`/league/${L.id}/transactions/${w}`).catch(() => [])));
        const seen = new Set();
        weeks.flat().forEach(t => {
          if (!t || t.type !== 'trade' || t.status !== 'complete' || seen.has(t.transaction_id)) return;
          seen.add(t.transaction_id);
          list.push({ t, L });
        });
      }
      list.sort((a, b) => (b.t.status_updated || b.t.created || 0) - (a.t.status_updated || a.t.created || 0));
      const ids = new Set();
      list.forEach(({ t }) => Object.keys(t.adds || {}).forEach(id => ids.add(id)));
      const players = ids.size ? await playerNames([...ids]) : {};
      myD.trades = { list, players };
    } catch (e) {
      myD.trades = { error: e.message || 'Couldn’t load trades from Sleeper.' };
    } finally {
      myD.tradesLoading = false;
      if (D === myD && opts.tab === 'trades') render();
    }
  }

  function renderTrades(){
    if (!D.trades) {
      loadTrades();
      return '<p class="status">Loading trades from Sleeper…</p>';
    }
    if (D.trades.error) return `<div class="error"><strong>${esc(D.trades.error)}</strong><br>Try Refresh.</div>`;
    const sel = opts.tradeTeam || 0;
    const teamOpts = D.ids.slice().sort((a, b) => team(a).name.localeCompare(team(b).name))
      .map(r => `<option value="${r}" ${sel === r ? 'selected' : ''}>${esc(team(r).name)}</option>`).join('');
    let html = `<div class="controls"><label class="field">Show trades for<select data-opt="tradeTeam">
      <option value="0" ${!sel ? 'selected' : ''}>All teams</option>${teamOpts}</select></label></div>`;
    const list = D.trades.list.filter(({ t }) => !sel || (t.roster_ids || []).includes(sel));
    if (!list.length) {
      return html + `<p class="note">${sel ? `${esc(team(sel).name)} hasn’t made any trades yet.` : 'No trades have been made in this league yet.'}</p>`;
    }
    html += `<p class="note">${list.length} trade${list.length === 1 ? '' : 's'}, newest first.</p><div class="tlist">`;
    const order = currentOrder();
    const { players } = D.trades;
    list.forEach(({ t, L }) => {
      const ts = t.status_updated || t.created;
      const date = ts ? new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : `${L.season} season`;
      html += `<article class="trade"><time>${esc(date)}</time><div class="sides">`;
      (t.roster_ids || []).forEach(rid => {
        const items = [];
        Object.entries(t.adds || {}).forEach(([pid, to]) => {
          if (to !== rid) return;
          const [nm, pos, tm] = (players[pid] || `${pid}||`).split('|');
          items.push(`<li><span class="asset-main">${PL(pid, nm, 'span')}</span>${pos || tm ? `<span class="asset-sub">${esc([pos, tm].filter(Boolean).join(', '))}</span>` : ''}</li>`);
        });
        (t.draft_picks || []).forEach(dp => {
          if (dp.owner_id !== rid) return;
          const parts = [];
          parts.push(dp.roster_id === rid ? 'Their own pick back' : `${L.teamOf(dp.roster_id).name}’s pick`);
          if (L.current && Number(dp.season) === D.draftSeason && D.ids.includes(dp.roster_id)) {
            parts.push(`${seasonDone() ? 'slot' : 'currently'} ${pickLabel(dp.round, slotOf(order, dp.round, dp.roster_id))}`);
          }
          items.push(`<li class="asset-pick"><span class="asset-main">${esc(dp.season)} ${ordinal(dp.round)}</span><span class="asset-sub">${esc(parts.join(', '))}</span></li>`);
        });
        (t.waiver_budget || []).forEach(w => {
          if (w.receiver === rid) items.push(`<li><span class="asset-main">$${esc(w.amount)} FAAB</span></li>`);
        });
        html += `<div class="side">${teamBlock(L.teamOf(rid), 'received')}<ul>${items.join('') || '<li class="asset-sub">Nothing</li>'}</ul></div>`;
      });
      html += '</div></article>';
    });
    return html + '</div>';
  }

  // ---------- Player card: header, game logs, career, news, depth chart, transactions ----------
  const SAPI = 'https://api.sleeper.com';
  const pcache = new Map();
  const getOnce = (k, url) => {
    if (!pcache.has(k)) pcache.set(k, fetch(url, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null));
    return pcache.get(k);
  };
  const statsFor = (pid, season, weekly) => getOnce(`s:${pid}:${season}:${weekly ? 'w' : 's'}`, `${SAPI}/stats/nfl/player/${encodeURIComponent(pid)}?season_type=regular&season=${season}${weekly ? '&grouping=week' : ''}`);
  const projFor = (pid, season) => getOnce(`p:${pid}:${season}`, `${SAPI}/projections/nfl/player/${encodeURIComponent(pid)}?season_type=regular&season=${season}&grouping=week`);
  const playerFor = pid => getOnce(`i:${pid}`, `${SAPI}/players/nfl/${encodeURIComponent(pid)}`);
  const newsFor = pid => getOnce(`n:${pid}`, `${SAPI}/players/nfl/${encodeURIComponent(pid)}/news?limit=5`);
  const schedFor = season => getOnce(`sch:${season}`, `${SAPI}/schedule/nfl/regular/${season}`);
  // Team depth charts come from Sleeper's full player list, which is large, so keep a compact copy for 12 hours.
  async function depthCharts(){
    try { const c = JSON.parse(store.get('depthCharts') || 'null'); if (c && Date.now() - c.ts < 43200000) return c.teams; } catch (e) {}
    const all = await getOnce('all', `${API}/players/nfl`);
    if (!all) return null;
    const teams = {};
    Object.values(all).forEach(p => {
      if (!p || !p.team || !p.depth_chart_position || p.depth_chart_order == null || !p.active) return;
      const t = teams[p.team] || (teams[p.team] = {});
      (t[p.depth_chart_position] || (t[p.depth_chart_position] = [])).push([p.depth_chart_order, p.full_name || `${p.first_name} ${p.last_name}`, p.player_id]);
    });
    Object.values(teams).forEach(t => Object.values(t).forEach(a => a.sort((x, y) => x[0] - y[0])));
    try { store.set('depthCharts', JSON.stringify({ ts: Date.now(), teams })); } catch (e) {}
    return teams;
  }
  // Fantasy points with this league's own scoring settings.
  const fpts = st => { const sc = (D.league && D.league.scoring_settings) || {}; let t = 0; for (const k in st || {}) if (sc[k] != null && typeof st[k] === 'number') t += st[k] * sc[k]; return Math.round(t * 100) / 100; };
  const TEAMS = { ARI: ['Cardinals', '#97233F'], ATL: ['Falcons', '#A71930'], BAL: ['Ravens', '#241773'], BUF: ['Bills', '#00338D'], CAR: ['Panthers', '#0076B6'], CHI: ['Bears', '#0B162A'],
    CIN: ['Bengals', '#C2410C'], CLE: ['Browns', '#311D00'], DAL: ['Cowboys', '#041E42'], DEN: ['Broncos', '#C2410C'], DET: ['Lions', '#0076B6'], GB: ['Packers', '#203731'], HOU: ['Texans', '#03202F'],
    IND: ['Colts', '#002C5F'], JAX: ['Jaguars', '#006778'], KC: ['Chiefs', '#C8102E'], LV: ['Raiders', '#2A2A2A'], LAC: ['Chargers', '#0067A6'], LAR: ['Rams', '#003594'], MIA: ['Dolphins', '#007C85'],
    MIN: ['Vikings', '#4F2683'], NE: ['Patriots', '#002244'], NO: ['Saints', '#7A6A45'], NYG: ['Giants', '#0B2265'], NYJ: ['Jets', '#125740'], PHI: ['Eagles', '#004C54'], PIT: ['Steelers', '#1F1F1F'],
    SF: ['49ers', '#AA0000'], SEA: ['Seahawks', '#002244'], TB: ['Buccaneers', '#B00A0A'], TEN: ['Titans', '#0C2340'], WAS: ['Commanders', '#5A1414'] };
  const n0 = v => (v == null || isNaN(v)) ? 0 : v;
  const dash = v => (v == null || v === 0) ? '-' : (Math.round(v * 100) / 100);
  const ratio = (a, b) => b ? Math.round(a / b * 100) / 100 : '-';
  // Column groups per position. Each column: [label, value fn, higherIsBetter (true/false/null = no shading)]
  const G = {
    pass: ['Pass', [['ATT', s => s.pass_att, true], ['CMP', s => s.pass_cmp, true], ['YD', s => s.pass_yd, true], ['TD', s => s.pass_td, true], ['INT', s => s.pass_int, false]]],
    rush: ['Rushing', [['ATT', s => s.rush_att, true], ['YD', s => s.rush_yd, true], ['YPC', s => s.rush_att ? ratio(n0(s.rush_yd), s.rush_att) : null, true], ['TD', s => s.rush_td, true]]],
    rec: ['Receiving', [['TGT', s => s.rec_tgt, true], ['REC', s => s.rec, true], ['YD', s => s.rec_yd, true], ['YPR', s => s.rec ? ratio(n0(s.rec_yd), s.rec) : null, true], ['TD', s => s.rec_td, true]]],
    sack: ['Sacked', [['SK', s => s.pass_sack, false], ['YDS', s => s.pass_sack_yds, false]]],
    fum: ['Fumble', [['FUM', s => s.fum, false], ['LOST', s => s.fum_lost, false]]],
    kick: ['Kicking', [['FGM', s => s.fgm, true], ['FGA', s => s.fga, null], ['LNG', s => s.fgm_lng, true], ['XPM', s => s.xpm, true], ['XPA', s => s.xpa, null]]],
    def: ['Defense', [['PA', s => s.pts_allow, false], ['SACK', s => s.sack, true], ['INT', s => s.int, true], ['FR', s => s.fum_rec, true], ['TD', s => n0(s.def_td) + n0(s.st_td), true]]]
  };
  const GROUPS = { QB: ['pass', 'rush', 'sack', 'fum'], RB: ['rush', 'rec', 'fum'], WR: ['rec', 'rush', 'fum'], TE: ['rec', 'rush', 'fum'], K: ['kick'], DEF: ['def'] };
  const ownerName = key => { const r = (D.rosters || []).find(x => (x.owner_id || `${leagueId}-${x.roster_id}`) === key); return r ? team(r.roster_id).name : 'a former team'; };
  function historyHtml(pid){
    if (!D.build) return '<p class="status">Loading league history…</p>';
    const log = D.build && D.build.holder && D.build.holder.log;
    const evs = (log && log.get(pid)) || [];
    if (!evs.length) return '<p class="pc-empty">No draft or transaction history in this league yet.</p>';
    const dt = ts => ts ? new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : '';
    const B = x => `<b>${esc(ownerName(x))}</b>`;
    return '<ol class="pc-hist">' + evs.slice().reverse().map(e => {
      const txt = e.how === 'draft' ? `Drafted by ${B(e.to)} in the ${esc(e.draft)}, pick ${e.round}.${String(e.slot).padStart(2, '0')}${e.no ? ` (#${e.no} overall)` : ''}`
        : e.how === 'trade' ? `Traded ${e.from ? `from ${B(e.from)} ` : ''}to ${B(e.to)}`
        : e.how === 'waiver' ? `Claimed off waivers by ${B(e.to)}${e.bid ? ` for $${e.bid.toLocaleString()} FAAB` : ''}`
        : e.how === 'fa' ? `Signed as a free agent by ${B(e.to)}`

      const item = r => {
        if (r.bye && !r.playedIt) return `<div class="pm-g bye"><div class="pm-gh"><span class="pm-wk">W${r.w}</span><span class="pm-opp">BYE</span></div></div>`;
        const luB = r.lu ? `<span class="pc-lu ${r.lu.started ? 'on' : ''}">${r.lu.started ? 'Start' : 'Bench'}</span>` : '';
        if (!r.playedIt) return `<div class="pm-g ${r.done ? 'dnp' : 'fut'}"><div class="pm-gh"><span class="pm-wk">W${r.w}</span><span class="pm-opp">${esc(r.opp || '-')}</span>${luB}<span class="pm-line">${r.done ? 'Did not play' : 'Upcoming'}</span><span class="pm-pt"><b>${r.done ? '–' : (r.proj != null ? r.proj.toFixed(1) : '–')}</b><small>${r.done ? '' : 'proj'}</small></span></div></div>`;
        const det = groups.map(g => `<div class="pm-dg"><span class="pm-dgh">${g[0]}</span><div class="pm-dgc">${g[1].map(c => `<div><span>${c[0]}</span><b>${dash(c[1](r.st))}</b></div>`).join('')}</div></div>`).join('')
          + `<div class="pm-dg"><span class="pm-dgh">Usage</span><div class="pm-dgc"><div><span>Snap%</span><b>${r.snp == null ? '-' : r.snp}</b></div><div><span>Proj</span><b>${r.proj != null ? r.proj.toFixed(1) : '-'}</b></div></div></div>`;
        return `<div class="pm-g"><button type="button" class="pm-gh" data-pm-exp aria-expanded="false"><span class="pm-wk">W${r.w}</span><span class="pm-opp">${esc(r.opp || '-')}</span>${luB}<span class="pm-line">${esc(statLine(pos, r.st))}</span><span class="pm-pt${tone(r.pts)}"><b>${r.pts.toFixed(1)}</b><small>${r.proj != null ? `proj ${r.proj.toFixed(1)}` : ''}</small></span></button><div class="pm-det" hidden>${det}</div></div>`;
      };
      const items = past.map(item).join('') + (next.length ? `<h4 class="pm-sub">Upcoming</h4>${next.map(item).join('')}` : '');
      box.innerHTML = (wk || pj) ? `${sumM}<div class="pm-glist">${items}</div><p class="pc-note">Tap a game for the full stat line. Points use this league’s scoring.</p>` : '<p class="pc-empty">Couldn’t load stats from Sleeper. Try again in a moment.</p>';
      return;
    }
    const sum = played.length ? `<div class="pc-sum"><div><b>${tot.toFixed(1)}</b><span>Fantasy pts</span></div><div><b>${(tot / played.length).toFixed(1)}</b><span>Per game</span></div><div><b>${played.length}</b><span>Games</span></div><div><b>${Math.max(...played.map(r => r.pts)).toFixed(1)}</b><span>Best game</span></div></div>` : '';
    box.innerHTML = (wk || pj) ? `${sum}<div class="pc-tblwrap"><table class="pc-log"><thead>${head1}${head2}</thead><tbody>${body}</tbody></table></div><p class="pc-note">Fantasy points and projections use this league’s scoring.${cur ? ' Lineup shows whether his league team started him.' : ''}</p>`
      : '<p class="pc-empty">Couldn’t load stats from Sleeper. Try again in a moment.</p>';
  }

  async function drawCareer(){
    const my = PC; if (!my) return;
    const { pid, info } = my, pos = info.pos || 'WR';
    const rows = await Promise.all(my.seasons.map(y => statsFor(pid, y, false).then(j => ({ y, st: j && j.stats, tm: j && j.team }))));
    if (PC !== my) return;
    const box = document.getElementById('pccareer'); if (!box) return;
    const groups = (GROUPS[pos] || GROUPS.WR).map(k => G[k]), cols = groups.flatMap(g => g[1]);
    const have = rows.filter(r => r.st && (r.st.gp || r.st.gms_active));
    if (isPhone()) {
      box.innerHTML = have.length ? '<div class="pm-glist">' + have.map(r => { const gp = r.st.gp || r.st.gms_active || 0, f = fpts(r.st);
        return `<button type="button" class="pm-car" data-pc-season="${r.y}"><span class="pm-cy"><b>${r.y}</b><small>${esc(r.tm || '–')} · ${gp} GP${r.st.pos_rank_ppr ? ` · ${esc(pos)}${r.st.pos_rank_ppr}` : ''}</small></span><span class="pm-line">${esc(statLine(pos, r.st))}</span><span class="pm-pt"><b>${f.toFixed(1)}</b><small>${gp ? (f / gp).toFixed(1) : '–'} ppg</small></span></button>`; }).join('') + '</div><p class="pc-note">Tap a season to open its game log.</p>'
        : '<p class="pc-empty">No NFL regular-season stats yet.</p>';
      return;
    }
    box.innerHTML = have.length ? `<div class="pc-tblwrap"><table class="pc-log"><thead><tr class="pc-gh"><th colspan="2"></th><th colspan="4">Fantasy</th>${groups.map(g => `<th colspan="${g[1].length}">${g[0]}</th>`).join('')}</tr>
      <tr><th>Season</th><th>Team</th><th>GP</th><th class="pc-fp">FPts</th><th>PPG</th><th>Rank</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>
      ${have.map(r => { const gp = r.st.gp || r.st.gms_active || 0, f = fpts(r.st); return `<tr><td><button type="button" class="linkbtn" data-pc-season="${r.y}">${r.y}</button></td><td>${esc(r.tm || '–')}</td><td>${gp}</td><td class="pc-fp"><b>${f.toFixed(1)}</b></td><td>${gp ? (f / gp).toFixed(1) : '–'}</td><td>${r.st.pos_rank_ppr ? `${esc(pos)}${r.st.pos_rank_ppr}` : '–'}</td>${cols.map(c => `<td>${dash(c[1](r.st))}</td>`).join('')}</tr>`; }).join('')}
      </tbody></table></div><p class="pc-note">Tap a season to load its game log above.</p>`
      : '<p class="pc-empty">No NFL regular-season stats yet.</p>';
  }

  // ---------- Streak breakdown (week-by-week matchups in the current streak) ----------
  function openStreak(rid){
    const x = standingsData().get(rid); if (!x) return;
    const c = x.cur; if (!c.n) return;
    const games = x.gm.slice(-c.n).reverse(), t = team(rid);
    const word = c.t === 'W' ? 'win' : c.t === 'L' ? 'losing' : 'tie';
    const side = (rt, pts, win) => `<div class="sk-side${win ? ' win' : ''}">${teamBlock(rt, '')}<span class="sk-pts">${pts.toFixed(2)}</span></div>`;
    const rows = games.map(g => {
      const res = `<span class="sk-res ${g.res.toLowerCase()}">${g.res}</span>`;
      const body = g.med != null
        ? `${side(t, g.pts, g.res === 'W')}<div class="sk-side sk-med${g.res === 'L' ? ' win' : ''}"><div class="team"><div class="tx"><div class="tname">League median</div></div></div><span class="sk-pts">${g.med.toFixed(2)}</span></div>`
        : `${side(t, g.pts, g.pts > g.oppPts)}${side(team(g.opp), g.oppPts, g.oppPts > g.pts)}`;
      return `<button type="button" class="sk-row" data-goto-match="${g.w}:${g.mid}"><span class="sk-wk">Week ${g.w}</span>${res}<div class="sk-teams">${body}</div><span class="sk-go">›</span></button>`;
    }).join('');
    closeStreak();
    const el = document.createElement('div'); el.className = 'sk-overlay'; el.id = 'skov';
    el.innerHTML = `<div class="sk-modal" role="dialog" aria-modal="true" aria-label="${esc(t.name)} ${word} streak">
      <header>${teamBlock(t, `${c.n}-game ${word} streak`)}<button type="button" class="sk-x" data-sk-close aria-label="Close">×</button></header>
      <div class="sk-list">${rows}</div><p class="sk-note">Tap a week to open the full matchup.</p></div>`;
    document.body.appendChild(el); document.body.classList.add('sk-lock');
    el.addEventListener('click', e => {
      if (e.target === el || e.target.closest('[data-sk-close]')) return closeStreak();
      const row = e.target.closest('[data-goto-match]'); if (!row) return;
      closeStreak(); const [w, mid] = row.dataset.gotoMatch.split(':').map(Number);
      opts.tab = 'match'; opts.week = w; D.openMatch = { w, id: mid }; saveOpts(); render();
      const card = document.querySelector(`[data-card="${mid}"]`); window.scrollTo(0, card ? Math.max(0, window.scrollY + card.getBoundingClientRect().top - 80) : 0);
    });
    el.querySelector('.sk-x').focus();
  }
  function closeStreak(){ const el = document.getElementById('skov'); if (el) el.remove(); document.body.classList.remove('sk-lock'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeStreak(); });

  // ---------- Floating tooltips for [data-tip] (HTML built by the app, escaped at build time) ----------
  let tipEl = null;
  function showTip(el){
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'ftip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl); }
    tipEl.innerHTML = el.dataset.tip; tipEl.style.display = 'block';
    const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
    let left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), innerWidth - t.width - 8);
    let top = r.bottom + 8; if (top + t.height > innerHeight - 8) top = r.top - t.height - 8;
    tipEl.style.left = left + 'px'; tipEl.style.top = Math.max(8, top) + 'px';
  }
  function hideTip(){ if (tipEl) tipEl.style.display = 'none'; }
  document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && matchMedia('(hover:hover)').matches) showTip(el); });
  document.addEventListener('mouseout', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && !el.contains(e.relatedTarget)) hideTip(); });
  document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('[data-tip]')) showTip(e.target); });
  document.addEventListener('focusout', hideTip);
  window.addEventListener('scroll', hideTip, { passive: true });

  // ---------- Events ----------
  $('#app').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open-match], [data-player]')) { e.preventDefault(); e.target.click(); } });
  $('#app').addEventListener('click', e => {
    document.querySelectorAll('.tabgroup.open').forEach(g => { if (!g.contains(e.target)) g.classList.remove('open'); });
    const cpick = e.target.closest('[data-calc-pick]');
    if (cpick) { const k = cpick.dataset.calcPick; D.calc[k].items.push(cpick.dataset.key); render(); return; }
    if (!e.target.closest('.csearch')) document.querySelectorAll('.csug').forEach(u => { u.hidden = true; });
    const crm = e.target.closest('[data-calc-rm]');
    if (crm) { const it = D.calc[crm.dataset.calcRm].items; it.splice(it.indexOf(crm.dataset.key), 1); render(); return; }
    const grp = e.target.closest('[data-group]');
    if (grp) { const o = grp.parentElement.classList.toggle('open'); grp.setAttribute('aria-expanded', o); return; }
    const pl = e.target.closest('[data-player]');
    if (pl) { openPlayer(pl.dataset.player); return; }
    const sk = e.target.closest('[data-streak]');
    if (sk) { hideTip(); openStreak(Number(sk.dataset.streak)); return; }
    const gm = e.target.closest('[data-goto-match]');
    if (gm) { const [w, mid] = gm.dataset.gotoMatch.split(':').map(Number); hideTip();
      opts.tab = 'match'; opts.week = w; D.openMatch = { w, id: mid }; saveOpts(); render();
      const card = document.querySelector(`[data-card="${mid}"]`); window.scrollTo(0, card ? Math.max(0, window.scrollY + card.getBoundingClientRect().top - 80) : 0); return; }
    const pf = e.target.closest('[data-pos-filter]');
    if (pf) { opts.posFilter = opts.posFilter === pf.dataset.posFilter ? null : pf.dataset.posFilter; render(); return; }
    const ot = e.target.closest('[data-own-team]');
    if (ot) { const rid = ot.dataset.ownTeam; opts.tab = 'own'; saveOpts(); render();
      const card = document.getElementById('own-' + rid);
      if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1600); }
      return; }
    const bt = e.target.closest('[data-build-team]');
    if (bt) { opts.buildTeam = Number(bt.dataset.buildTeam); opts.nflFilter = null; opts.posFilter = null; opts.tab = 'build'; saveOpts(); render(); window.scrollTo(0, 0); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab) { opts.tab = tab.dataset.tab; saveOpts(); render(); return; }
    const b = e.target.closest('[data-basis]');
    if (b) { opts.basis = b.dataset.basis; saveOpts(); render(); return; }
    const br = e.target.closest('[data-side]');
    if (br) { opts.bracketSide = br.dataset.side; render(); return; }
    const nflb = e.target.closest('[data-nfl]');
    if (nflb) { opts.nflFilter = opts.nflFilter === nflb.dataset.nfl ? null : nflb.dataset.nfl; render(); return; }
    const om = e.target.closest('[data-open-match]');
    if (om) { morphMatch(Number(om.dataset.openMatch), true); return; }
    if (e.target.closest('[data-close-match]')) { morphMatch(D.openMatch && D.openMatch.id, false); return; }
    const plb = e.target.closest('[data-pid]');
    if (plb) { toggleBreakdown(plb); return; }
    const wk = e.target.closest('[data-week-step]');
    if (wk) {
      const w = (opts.week || D.defWeek) + Number(wk.dataset.weekStep);
      if (w >= D.startWeek && w <= D.playoff.lastWeek) { opts.week = w; saveOpts(); render(); }
    }
  });
  $('#app').addEventListener('change', e => {
    const cadd = null, cteam = e.target.closest('[data-calc-team]'), cst = e.target.closest('[data-calc-st]');
    if (cadd || cteam || cst) {
      if (cteam) D.calc[cteam.dataset.calcTeam] = { rid: Number(cteam.value), items: [], st: D.calc[cteam.dataset.calcTeam].st };
      if (cst) D.calc[cst.dataset.calcSt].st = cst.value;
      render(); return;
    }
    const el = e.target.closest('[data-opt]');
    if (!el) return;
    const k = el.dataset.opt;
    const openDetails = !!e.target.closest('details[open]');
    opts[k] = (k === 'rounds' || k === 'season' || k === 'tradeTeam' || k === 'week' || k === 'buildTeam' || k === 'tfTeam' || k === 'tfTol') ? Number(el.value) : el.value;
    saveOpts();
    if (k === 'tiebreak') runSim();
    if (k === 'buildTeam') { opts.nflFilter = null; opts.posFilter = null; }
    render();
    if (openDetails) { const d = document.querySelector('details.more'); if (d) d.open = true; }
  });

  // Trade Calculator search box: type to find a player or pick on the chosen team.
  function calcSuggest(input){
    const k = input.dataset.calcSearch, ul = document.querySelector(`[data-sug="${k}"]`);
    if (!ul || !D || !D.calc || !D.tf || D.tf.error) return;
    const t = finderModel().teams.get(D.calc[k].rid); if (!t) return;
    const q = input.value.trim().toLowerCase();
    const words = q.split(/\s+/).filter(Boolean);
    const list = t.assets.filter(a => !D.calc[k].items.includes(a.key))
      .filter(a => !words.length || words.every(w => `${a.label} ${a.sub}`.toLowerCase().includes(w))).slice(0, 8);
    ul.innerHTML = list.length ? list.map(a => `<li><button type="button" data-calc-pick="${k}" data-key="${esc(a.key)}">${a.kind === 'p' ? shot(a.id, a.pos, a.p.tm, a.label) : '<span class="hs pick" aria-hidden="true">PK</span>'}<span class="tfn2"><span class="asset-main">${esc(a.label)}</span><span class="asset-sub">${esc(a.sub)}</span></span><b class="tfv">${Math.round(a.v).toLocaleString()}</b></button></li>`).join('') : '<li class="asset-sub csnone">No match on this roster</li>';
    ul.hidden = false;
  }
  $('#app').addEventListener('input', e => { if (e.target.matches('[data-calc-search]')) calcSuggest(e.target); });
  $('#app').addEventListener('focusin', e => { if (e.target.matches('[data-calc-search]')) calcSuggest(e.target); });
  $('#app').addEventListener('keydown', e => {
    if (!e.target.matches('[data-calc-search]')) return;
    if (e.key === 'Enter') { e.preventDefault(); const b = document.querySelector(`[data-sug="${e.target.dataset.calcSearch}"] [data-calc-pick]`); if (b) b.click(); }
    if (e.key === 'Escape') { document.querySelectorAll('.csug').forEach(u => { u.hidden = true; }); }
  });
  $('#refresh').addEventListener('click', load);
  $('#leagueForm').addEventListener('submit', e => {
    e.preventDefault();
    const raw = $('#leagueInput').value.trim();
    const m = raw.match(/\d{8,}/);
    if (!m) { $('#leagueInput').focus(); return; }
    leagueId = m[0];
    store.set('leagueId', leagueId);
    const u = new URL(location.href); u.searchParams.set('league', leagueId); history.replaceState(null, '', u);
    D = null;
    load();
  });

  // Countdown: April 29, 2027, 8:00 PM Eastern (EDT, UTC-4) = April 30, 2027 00:00 UTC
  const CD_TARGET = Date.UTC(2027, 3, 30, 0, 0, 0);
  function tickCountdown(){
    let ms = CD_TARGET - Date.now();
    if (ms <= 0) { $('#cdgrid').innerHTML = '<div class="cddone">It’s time!</div>'; return false; }
    const sec = Math.floor(ms / 1000);
    const set = (id, v, pad) => { const e = $(id); if (e) e.textContent = pad ? String(v).padStart(2, '0') : String(v); };
    set('#cdD', Math.floor(sec / 86400)); set('#cdH', Math.floor(sec % 86400 / 3600), true);
    set('#cdM', Math.floor(sec % 3600 / 60), true); set('#cdS', sec % 60, true);
    return true;
  }
  if (tickCountdown()) { const cdTimer = setInterval(() => { if (!tickCountdown()) clearInterval(cdTimer); }, 1000); }

  load();
})();
</script>
</body>
</html>
